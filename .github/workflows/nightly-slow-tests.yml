name: Nightly slow tests

# Runs the expensive tests excluded from per-PR CI:
#  - LargeSessionListPerformanceTests — XCTMeasure perf baselines (~65s)
#  - IntegratedStreamingPerformanceTests — full pipeline TTFT/cadence/E2E baselines (~20s)
#  - TrafficBoundaryAuditTest — source-tree boundary audit (~50s)
#  - ManifoldAuditSabotageSuiteTests — SABOTAGE=1 audit tripwire proof
#  - ManifoldMCPE2ESmokeTests — explicitly gated MCP streamable-HTTP E2E smoke
# Most are gated by RUN_SLOW_TESTS=1 in their setUp; the main `ci.yml`
# job leaves that unset so they skip there. Local `swift test` runs them
# unconditionally (CI is also unset locally). The sabotage suite is separately
# gated by SABOTAGE=1, and MCP E2E remains separately gated by RUN_MCP_E2E=1
# plus a narrow smoke filter so npx/network subprocess tests do not run here.

on:
  schedule:
    # 04:30 UTC daily — quiet window. (fuzz-nightly's 05:00 UTC slot is
    # currently dispatch-only pending a self-hosted Apple-Silicon runner.)
    - cron: "30 4 * * *"
  workflow_dispatch:

# A `workflow_dispatch` triggered while a scheduled run is still in flight
# would race on the SwiftPM cache key and double-bill the macos-15 runner.
# Cancel the in-flight run so only one is ever active.
concurrency:
  group: nightly-slow-tests
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  slow:
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    env:
      RUN_SLOW_TESTS: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Swift CI environment
        uses: ./.github/actions/setup-swift-ci

      - name: Test — LargeSessionListPerformanceTests
        id: test-large-session-list
        env:
          MANIFOLD_TEST_OUTPUT_FILE: ${{ github.workspace }}/test-diagnostics/test-large-session-list.log
        run: scripts/test.sh --filter "ManifoldUITests.LargeSessionListPerformanceTests" --disable-default-traits --skip-update --min-passed 1

      - name: Test — IntegratedStreamingPerformanceTests
        id: test-integrated-streaming
        env:
          MANIFOLD_TEST_OUTPUT_FILE: ${{ github.workspace }}/test-diagnostics/test-integrated-streaming.log
        run: scripts/test.sh --filter "ManifoldUITests.IntegratedStreamingPerformanceTests" --disable-default-traits --skip-update --min-passed 1

      - name: Test — TrafficBoundaryAuditTest
        id: test-traffic-boundary-audit
        env:
          MANIFOLD_TEST_OUTPUT_FILE: ${{ github.workspace }}/test-diagnostics/test-traffic-boundary-audit.log
        run: scripts/test.sh --filter "ManifoldInferenceTests.TrafficBoundaryAuditTest" --disable-default-traits --skip-update --min-passed 1

      - name: Test — Audit sabotage suite
        id: test-audit-sabotage
        env:
          SABOTAGE: "1"
          MANIFOLD_TEST_OUTPUT_FILE: ${{ github.workspace }}/test-diagnostics/test-audit-sabotage.log
        run: |
          set -euo pipefail
          scripts/test.sh --filter "ManifoldAuditSabotageSuiteTests" --disable-default-traits --skip-update --min-passed 1
          echo "Audit sabotage suite proof (SABOTAGE=${SABOTAGE}):"
          grep -E "Test Case '-\\[ManifoldAuditSabotageSuiteTests\\.|TOTAL RUN:|Passed:|RESULT: PASSED" "$MANIFOLD_TEST_OUTPUT_FILE" || true
          if ! grep -qE "Test Case '-\\[ManifoldAuditSabotageSuiteTests\\." "$MANIFOLD_TEST_OUTPUT_FILE"; then
            echo "::error::Sabotage suite log did not contain any ManifoldAuditSabotageSuiteTests test-case lines."
            exit 1
          fi
          if grep -q "Set SABOTAGE=1 to run sabotage suite" "$MANIFOLD_TEST_OUTPUT_FILE"; then
            echo "::error::Sabotage suite skipped despite SABOTAGE=1."
            exit 1
          fi

      - name: Test — MCP streamable HTTP E2E smoke
        id: test-mcp-e2e-smoke
        env:
          RUN_MCP_E2E: "1"
          MANIFOLD_TEST_OUTPUT_FILE: ${{ github.workspace }}/test-diagnostics/test-mcp-e2e-smoke.log
        run: scripts/test.sh --filter "ManifoldMCPE2ESmokeTests" --disable-default-traits --skip-update --min-passed 1

      - name: Test — Operational tier (soak + migration)
        id: test-operational
        env:
          RUN_OPERATIONAL_TESTS: "1"
          MANIFOLD_TEST_OUTPUT_FILE: ${{ github.workspace }}/test-diagnostics/test-operational.log
        run: |
          scripts/test.sh --filter "ManifoldPersistenceSwiftDataTests.SchemaV3MigrationTests" \
            --disable-default-traits --skip-update --min-passed 1
          scripts/test.sh --filter "ManifoldRuntimeTests.SoakRunnerTests" \
            --disable-default-traits --skip-update --min-passed 1
          scripts/test.sh --filter "ManifoldRuntimeTests.SessionDiscardOrderingTests" \
            --disable-default-traits --skip-update --min-passed 1

      # Coverage thresholds — runs a fresh swift test with --enable-code-coverage
      # over the four critical modules and verifies each module's line coverage
      # meets its threshold (set 10pp below the 2026-05-15 baseline). Moved here
      # from ci.yml's per-main-push step to reclaim ~130s wall (~22 billed
      # macOS-min) per push; thresholds are conservative enough that a ≤24h
      # detection delay is acceptable. See scripts/check-coverage.sh for
      # threshold values and rationale.
      - name: Coverage thresholds
        id: test-coverage-thresholds
        timeout-minutes: 15
        env:
          MANIFOLD_TEST_OUTPUT_FILE: ${{ github.workspace }}/test-diagnostics/test-coverage-thresholds.log
        run: |
          set -euo pipefail
          swift test \
            --filter ManifoldCoreTests \
            --filter ManifoldRuntimeTests \
            --filter ManifoldPersistenceSwiftDataTests \
            --filter ManifoldInferenceTests \
            --filter ManifoldMCPTests \
            --disable-default-traits \
            --enable-code-coverage \
            --skip-update
          scripts/check-coverage.sh

      - name: Public API source-compatibility check (full — all five modules)
        # Full unconditional check across all five trait-free public targets.
        # The per-PR gate in ci.yml only runs on modules that changed in the PR
        # and skips entirely on doc/test/script-only changes — this step
        # catches any API break that slipped through, within 24 h.
        #
        # `--targets` is REQUIRED: whole-package mode fails on the trait-gated
        # `llama` C module ("missing required module 'llama'").
        #
        # The umbrella `ManifoldKit` target is DELIBERATELY NOT listed: it
        # `@_exported`-re-exports `ManifoldBackends`, which transitively pulls in
        # the llama-dependent family targets, producing "baseline for ManifoldKit
        # contains no symbols". The five targets below cover everything
        # `import ManifoldKit` consumers touch except the backend families,
        # which are pinned indirectly via the backend contract suite.
        id: api-check
        run: |
          set -euo pipefail
          # diagnose-api-breaking-changes checks out the baseline tree object
          # from origin/main. A shallow clone (actions/checkout default) omits
          # those objects and causes "unable to read tree" (#1723). --unshallow
          # converts the shallow clone to a full one; fall back to a plain fetch
          # if the repo is already full-depth (e.g. local runs).
          git fetch --unshallow origin main 2>/dev/null || git fetch origin main
          # See ci.yml for why the allowlist exists: it absorbs the false-positive
          # "removed" reports from downward type relocations behind `@_exported`
          # re-export shims (P2a Contract extraction, #1719/#1723). Entries
          # self-expire once the relocation lands on main.
          swift package diagnose-api-breaking-changes origin/main \
            --targets ManifoldInference --targets ManifoldRuntime --targets ManifoldCloudCore \
            --targets ManifoldPersistenceSwiftData --targets ManifoldUI \
            --breakage-allowlist-path .github/api-breakage-allowlist.txt

      - name: Stage test diagnostics
        # Mirrors ci.yml: each step writes to a unique workspace log path so
        # diagnostics from earlier failures are preserved.
        if: failure()
        env:
          LARGE_SESSION_LIST_FAILED: ${{ steps.test-large-session-list.outcome == 'failure' }}
          INTEGRATED_STREAMING_FAILED: ${{ steps.test-integrated-streaming.outcome == 'failure' }}
          TRAFFIC_BOUNDARY_AUDIT_FAILED: ${{ steps.test-traffic-boundary-audit.outcome == 'failure' }}
          AUDIT_SABOTAGE_FAILED: ${{ steps.test-audit-sabotage.outcome == 'failure' }}
          MCP_E2E_SMOKE_FAILED: ${{ steps.test-mcp-e2e-smoke.outcome == 'failure' }}
          OPERATIONAL_FAILED: ${{ steps.test-operational.outcome == 'failure' }}
          COVERAGE_THRESHOLDS_FAILED: ${{ steps.test-coverage-thresholds.outcome == 'failure' }}
          API_CHECK_FAILED: ${{ steps.api-check.outcome == 'failure' }}
        run: |
          mkdir -p test-diagnostics
          {
            echo "run-id=${{ github.run_id }}"
            echo "run-attempt=${{ github.run_attempt }}"
            echo "job=slow"
            echo "large-session-list-failed=${LARGE_SESSION_LIST_FAILED}"
            echo "integrated-streaming-failed=${INTEGRATED_STREAMING_FAILED}"
            echo "traffic-boundary-audit-failed=${TRAFFIC_BOUNDARY_AUDIT_FAILED}"
            echo "audit-sabotage-failed=${AUDIT_SABOTAGE_FAILED}"
            echo "mcp-e2e-smoke-failed=${MCP_E2E_SMOKE_FAILED}"
            echo "operational-failed=${OPERATIONAL_FAILED}"
            echo "coverage-thresholds-failed=${COVERAGE_THRESHOLDS_FAILED}"
            echo "api-check-failed=${API_CHECK_FAILED}"
          } > test-diagnostics/failed-steps.txt

      - name: Upload test diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-slow-tests-diagnostics-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 7
          path: test-diagnostics/

      - name: Open GitHub issue on failure
        # Creates a tracking issue so a nightly failure is visible without
        # relying on GitHub's email digest. De-duplication: if an open issue
        # with the same title prefix already exists, appends a comment instead
        # of opening a second issue — avoids spam during multi-day failure runs.
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          title="Nightly slow tests failed"
          existing=$(gh issue list \
            --repo "${{ github.repository }}" \
            --state open \
            --search "${title} in:title" \
            --json number \
            --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "Open issue #${existing} already exists — adding comment."
            gh issue comment "$existing" \
              --repo "${{ github.repository }}" \
              --body "Also failed on [run ${{ github.run_id }}](${run_url})."
          else
            gh issue create \
              --repo "${{ github.repository }}" \
              --title "${title}" \
              --body "$(printf '## Nightly slow tests failed\n\n**Run:** [%s](%s)\n\nCheck the run logs for which steps failed and close this issue once resolved.' "${{ github.run_id }}" "${run_url}")"
          fi

  # Cold-start conformance gates (tier 1/2/3 + specialised MCP/Voice/
  # UIModelManagement), consolidated onto a single runner — same approach as
  # ci.yml. These were per-PR gates in ci.yml until they were carved out here:
  # they very rarely fail (they exercise stable package-graph + public-surface
  # shape) and added ~9 min of 10×-billed macOS wall-clock to every PR. ci.yml
  # still runs them on PRs that actually touch Package.swift / Package.resolved
  # / the gate scripts / Sources/ManifoldFoundation; this nightly job re-runs
  # them unconditionally so we still catch Sources-only regressions that wiggle
  # a public symbol downstream-visible. Steps 2–6 use
  # `if: success() || failure()` so one failure doesn't mask the others.
  cold-start:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Swift CI environment
        uses: ./.github/actions/setup-swift-ci

      - name: Cold-start tier 1 — public consumer surface
        timeout-minutes: 10
        run: scripts/cold-start-conformance.sh

      - name: Cold-start tier 2 — ManifoldBootstrap → ChatViewModel
        if: success() || failure()
        timeout-minutes: 10
        run: scripts/cold-start-tier2-bootstrap.sh

      - name: Cold-start tier 3 — ChatView composition
        if: success() || failure()
        timeout-minutes: 10
        run: bash scripts/cold-start-tier3-chatview.sh

      - name: Cold-start specialised — ManifoldMCP
        if: success() || failure()
        timeout-minutes: 10
        run: scripts/cold-start-specialised-mcp.sh

      - name: Cold-start specialised — ManifoldVoice
        if: success() || failure()
        timeout-minutes: 10
        run: scripts/cold-start-specialised-voice.sh

      - name: Cold-start specialised — ManifoldUIModelManagement
        if: success() || failure()
        timeout-minutes: 10
        run: scripts/cold-start-specialised-uimodelmanagement.sh

  foundation-only-build:
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Swift CI environment
        uses: ./.github/actions/setup-swift-ci
        with:
          cache-key-suffix: "-foundation-only"

      - name: Run FoundationOnly bundle audit
        timeout-minutes: 10
        run: scripts/check-foundation-only-bundle.sh
