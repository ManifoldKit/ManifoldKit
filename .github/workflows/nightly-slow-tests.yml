name: Nightly slow tests

# Runs the expensive tests excluded from per-PR CI:
#  - LargeSessionListPerformanceTests — XCTMeasure perf baselines (~65s)
#  - IntegratedStreamingPerformanceTests — full pipeline TTFT/cadence/E2E baselines (~20s)
#  - TrafficBoundaryAuditTest — source-tree boundary audit (~50s)
#  - ManifoldMCPE2ESmokeTests — explicitly gated MCP streamable-HTTP E2E smoke
# These are gated by RUN_SLOW_TESTS=1 in their setUp; the main `ci.yml`
# job leaves that unset so they skip there. Local `swift test` runs them
# unconditionally (CI is also unset locally). MCP E2E remains separately gated
# by RUN_MCP_E2E=1 and a narrow smoke filter so npx/network subprocess tests do
# not run here.

on:
  schedule:
    # 04:30 UTC daily — quiet window. (fuzz-nightly's 05:00 UTC slot is
    # currently dispatch-only pending a self-hosted Apple-Silicon runner.)
    - cron: "30 4 * * *"
  workflow_dispatch:

# A `workflow_dispatch` triggered while a scheduled run is still in flight
# would race on the SwiftPM cache key and double-bill the macos-15 runner.
# Cancel the in-flight run so only one is ever active.
concurrency:
  group: nightly-slow-tests
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  slow:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      RUN_SLOW_TESTS: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.3"

      - name: Cache SwiftPM build
        uses: actions/cache@v5
        with:
          path: |
            .build/artifacts
            .build/checkouts
            .build/repositories
          key: ${{ runner.os }}-${{ runner.arch }}-xcode-26.3-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-xcode-26.3-spm-
            ${{ runner.os }}-${{ runner.arch }}-spm-

      - name: Test — LargeSessionListPerformanceTests
        id: test-large-session-list
        env:
          MANIFOLD_TEST_OUTPUT_FILE: ${{ github.workspace }}/test-diagnostics/test-large-session-list.log
        run: scripts/test.sh --filter "ManifoldUITests.LargeSessionListPerformanceTests" --disable-default-traits --skip-update --min-passed 1

      - name: Test — IntegratedStreamingPerformanceTests
        id: test-integrated-streaming
        env:
          MANIFOLD_TEST_OUTPUT_FILE: ${{ github.workspace }}/test-diagnostics/test-integrated-streaming.log
        run: scripts/test.sh --filter "ManifoldUITests.IntegratedStreamingPerformanceTests" --disable-default-traits --skip-update --min-passed 1

      - name: Test — TrafficBoundaryAuditTest
        id: test-traffic-boundary-audit
        env:
          MANIFOLD_TEST_OUTPUT_FILE: ${{ github.workspace }}/test-diagnostics/test-traffic-boundary-audit.log
        run: scripts/test.sh --filter "ManifoldInferenceTests.TrafficBoundaryAuditTest" --disable-default-traits --skip-update --min-passed 1

      - name: Test — MCP streamable HTTP E2E smoke
        id: test-mcp-e2e-smoke
        env:
          RUN_MCP_E2E: "1"
          MANIFOLD_TEST_OUTPUT_FILE: ${{ github.workspace }}/test-diagnostics/test-mcp-e2e-smoke.log
        run: scripts/test.sh --filter "ManifoldMCPE2ESmokeTests" --disable-default-traits --traits MCP --skip-update --min-passed 1

      - name: Test — Operational tier (soak + migration)
        id: test-operational
        env:
          RUN_OPERATIONAL_TESTS: "1"
          MANIFOLD_TEST_OUTPUT_FILE: ${{ github.workspace }}/test-diagnostics/test-operational.log
        run: |
          scripts/test.sh --filter "ManifoldPersistenceSwiftDataTests.SchemaV3MigrationTests" \
            --disable-default-traits --skip-update --min-passed 1
          scripts/test.sh --filter "ManifoldRuntimeTests.SoakRunnerTests" \
            --disable-default-traits --skip-update --min-passed 1

      - name: Stage test diagnostics
        # Mirrors ci.yml: each step writes to a unique workspace log path so
        # diagnostics from earlier failures are preserved.
        if: failure()
        env:
          LARGE_SESSION_LIST_FAILED: ${{ steps.test-large-session-list.outcome == 'failure' }}
          INTEGRATED_STREAMING_FAILED: ${{ steps.test-integrated-streaming.outcome == 'failure' }}
          TRAFFIC_BOUNDARY_AUDIT_FAILED: ${{ steps.test-traffic-boundary-audit.outcome == 'failure' }}
          MCP_E2E_SMOKE_FAILED: ${{ steps.test-mcp-e2e-smoke.outcome == 'failure' }}
          OPERATIONAL_FAILED: ${{ steps.test-operational.outcome == 'failure' }}
        run: |
          mkdir -p test-diagnostics
          {
            echo "run-id=${{ github.run_id }}"
            echo "run-attempt=${{ github.run_attempt }}"
            echo "job=slow"
            echo "large-session-list-failed=${LARGE_SESSION_LIST_FAILED}"
            echo "integrated-streaming-failed=${INTEGRATED_STREAMING_FAILED}"
            echo "traffic-boundary-audit-failed=${TRAFFIC_BOUNDARY_AUDIT_FAILED}"
            echo "mcp-e2e-smoke-failed=${MCP_E2E_SMOKE_FAILED}"
            echo "operational-failed=${OPERATIONAL_FAILED}"
          } > test-diagnostics/failed-steps.txt

      - name: Upload test diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-slow-tests-diagnostics-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 7
          path: test-diagnostics/
