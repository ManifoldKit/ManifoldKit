name: Nightly slow tests

# Runs the expensive tests excluded from per-PR CI:
#  - LargeSessionListPerformanceTests — XCTMeasure perf baselines (~65s)
#  - IntegratedStreamingPerformanceTests — full pipeline TTFT/cadence/E2E baselines (~20s)
#  - TrafficBoundaryAuditTest — source-tree boundary audit (~50s); as of
#    issue #1706 this also runs per-PR in ci.yml's ManifoldInferenceTests
#    batch — it is kept here for nightly double-coverage, no longer gated.
#    When this audit fails (e.g. issue #1709: a new file did direct URLSession
#    I/O), the fix is to route the call through URLSessionProvider or add the
#    file to TrafficBoundaryAuditTest.networkIOAllowlist with reviewer sign-off
#    — the audit is doing its job, not flaking.
#  - ManifoldAuditSabotageSuiteTests — SABOTAGE=1 audit tripwire proof
#  - ManifoldMCPE2ESmokeTests — explicitly gated MCP streamable-HTTP E2E smoke
# The perf suites are gated by RUN_SLOW_TESTS=1 in their setUp; the main `ci.yml`
# job leaves that unset so they skip there. Local `swift test` runs them
# unconditionally (CI is also unset locally). The sabotage suite is separately
# gated by SABOTAGE=1, and MCP E2E remains separately gated by RUN_MCP_E2E=1
# plus a narrow smoke filter so npx/network subprocess tests do not run here.

on:
  schedule:
    # 04:30 UTC daily — quiet window. (fuzz-nightly's 05:00 UTC slot is
    # currently dispatch-only pending a self-hosted Apple-Silicon runner.)
    - cron: "30 4 * * *"
  workflow_dispatch:

# A `workflow_dispatch` triggered while a scheduled run is still in flight
# would race on the SwiftPM cache key and double-bill the macos-15 runner.
# Cancel the in-flight run so only one is ever active.
concurrency:
  group: nightly-slow-tests
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  slow:
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    env:
      RUN_SLOW_TESTS: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Full history + tags: the API baseline below is resolved via
          # `git describe --tags`, which needs every tag ref plus the tag
          # commit's tree objects present locally. A shallow, tagless clone
          # (the actions/checkout default) can neither resolve nor diff
          # against a tag. fetch-tags is redundant once fetch-depth is 0 (a
          # full fetch pulls tags regardless) but is set explicitly so the
          # dependency is obvious without reading the checkout-action docs.
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Swift CI environment
        uses: ./.github/actions/setup-swift-ci

      - name: Capture API baseline SHA
        # The nightly api-check (below) diffs the current tree against the
        # latest release tag — not against `origin/main` and not against
        # this job's own HEAD. A floating branch ref re-resolved live,
        # ~26 min into the job, races any PR that merges to main in the
        # meantime: the moving ref can end up newer than the checked-out
        # tree, and diagnose-api-breaking-changes reports inverted
        # (spurious) breakages. That race fired in run 28574236073 (#2113).
        # A release tag is immutable once cut, so resolving it once here —
        # right after checkout, while tags are guaranteed present (see the
        # Checkout step's fetch-depth/fetch-tags) — and reusing the SHA for
        # the rest of the job is race-free by construction, with no
        # HEAD-vs-HEAD degenerate case.
        run: |
          set -euo pipefail
          BASELINE_TAG=$(git describe --tags --abbrev=0)
          BASELINE_SHA=$(git rev-parse "$BASELINE_TAG")
          echo "Baseline: $BASELINE_TAG ($BASELINE_SHA)"
          echo "BASELINE_SHA=$BASELINE_SHA" >> "$GITHUB_ENV"

      - name: Test — LargeSessionListPerformanceTests
        id: test-large-session-list
        env:
          MANIFOLD_TEST_OUTPUT_FILE: ${{ github.workspace }}/test-diagnostics/test-large-session-list.log
        run: scripts/test.sh --filter "ManifoldUITests.LargeSessionListPerformanceTests" --skip-update --min-passed 1

      - name: Test — IntegratedStreamingPerformanceTests
        id: test-integrated-streaming
        env:
          MANIFOLD_TEST_OUTPUT_FILE: ${{ github.workspace }}/test-diagnostics/test-integrated-streaming.log
        run: scripts/test.sh --filter "ManifoldUITests.IntegratedStreamingPerformanceTests" --skip-update --min-passed 1

      - name: Test — TrafficBoundaryAuditTest
        id: test-traffic-boundary-audit
        env:
          MANIFOLD_TEST_OUTPUT_FILE: ${{ github.workspace }}/test-diagnostics/test-traffic-boundary-audit.log
        run: scripts/test.sh --filter "ManifoldInferenceTests.TrafficBoundaryAuditTest" --skip-update --min-passed 1

      - name: Test — Audit sabotage suite
        id: test-audit-sabotage
        env:
          SABOTAGE: "1"
          MANIFOLD_TEST_OUTPUT_FILE: ${{ github.workspace }}/test-diagnostics/test-audit-sabotage.log
        run: |
          set -euo pipefail
          scripts/test.sh --filter "ManifoldAuditSabotageSuiteTests" --skip-update --min-passed 1
          echo "Audit sabotage suite proof (SABOTAGE=${SABOTAGE}):"
          grep -E "Test Case '-\\[ManifoldAuditSabotageSuiteTests\\.|TOTAL RUN:|Passed:|RESULT: PASSED" "$MANIFOLD_TEST_OUTPUT_FILE" || true
          if ! grep -qE "Test Case '-\\[ManifoldAuditSabotageSuiteTests\\." "$MANIFOLD_TEST_OUTPUT_FILE"; then
            echo "::error::Sabotage suite log did not contain any ManifoldAuditSabotageSuiteTests test-case lines."
            exit 1
          fi
          if grep -q "Set SABOTAGE=1 to run sabotage suite" "$MANIFOLD_TEST_OUTPUT_FILE"; then
            echo "::error::Sabotage suite skipped despite SABOTAGE=1."
            exit 1
          fi

      - name: Test — MCP streamable HTTP E2E smoke
        id: test-mcp-e2e-smoke
        env:
          RUN_MCP_E2E: "1"
          MANIFOLD_TEST_OUTPUT_FILE: ${{ github.workspace }}/test-diagnostics/test-mcp-e2e-smoke.log
        run: scripts/test.sh --filter "ManifoldMCPE2ESmokeTests" --skip-update --min-passed 1

      - name: Test — Operational tier (soak + migration)
        id: test-operational
        env:
          RUN_OPERATIONAL_TESTS: "1"
          MANIFOLD_TEST_OUTPUT_FILE: ${{ github.workspace }}/test-diagnostics/test-operational.log
        run: |
          scripts/test.sh --filter "ManifoldPersistenceSwiftDataTests.SchemaV3MigrationTests" \
            --skip-update --min-passed 1
          scripts/test.sh --filter "ManifoldRuntimeTests.SoakRunnerTests" \
            --skip-update --min-passed 1
          scripts/test.sh --filter "ManifoldRuntimeTests.SessionDiscardOrderingTests" \
            --skip-update --min-passed 1

      # Coverage thresholds — runs a fresh swift test with --enable-code-coverage
      # over the four critical modules and verifies each module's line coverage
      # meets its threshold (set 10pp below the 2026-05-15 baseline). Moved here
      # from ci.yml's per-main-push step to reclaim ~130s wall (~22 billed
      # macOS-min) per push; thresholds are conservative enough that a ≤24h
      # detection delay is acceptable. See scripts/check-coverage.sh for
      # threshold values and rationale.
      - name: Coverage thresholds
        id: test-coverage-thresholds
        timeout-minutes: 15
        env:
          MANIFOLD_TEST_OUTPUT_FILE: ${{ github.workspace }}/test-diagnostics/test-coverage-thresholds.log
        run: |
          set -euo pipefail
          swift test \
            --filter ManifoldCoreTests \
            --filter ManifoldRuntimeTests \
            --filter ManifoldPersistenceSwiftDataTests \
            --filter ManifoldInferenceTests \
            --filter ManifoldMCPTests \
            --enable-code-coverage \
            --skip-update
          scripts/check-coverage.sh

      - name: Public API source-compatibility check (full — all five modules)
        # Full unconditional check across all five trait-free public targets,
        # diffed against $BASELINE_SHA — the latest release tag, resolved
        # once in "Capture API baseline SHA" above — not a live-reresolved
        # `origin/main` ref and not this job's own HEAD.
        #
        # Why a release tag and not `origin/main`: `origin/main` is a
        # floating ref. Re-resolving it live, ~26 min into this job, races
        # any PR that merges to main in the meantime — the ref can move
        # newer than the checked-out tree, and diagnose-api-breaking-changes
        # reports inverted (spurious) breakages. That race fired in run
        # 28574236073 (#2113). Pinning to HEAD-at-checkout closed the race
        # but made the diff a permanent HEAD-vs-HEAD no-op — every run
        # compared the tree to itself, so this check could never actually
        # fail. A release tag is immutable once cut, giving a fixed,
        # meaningfully-different baseline with no re-resolution race.
        #
        # Why this step exists at all, given ci.yml's per-PR gate: that gate
        # only runs on modules that changed in the PR, skips entirely on
        # doc/test/script-only changes, and does not run on `merge_group`
        # events at all — so queue-merged trees are never digester-checked
        # by it. This nightly run is the only place that coverage lives; it
        # is the 24h backstop that catches whatever the per-PR gate's path
        # filters, merge_group skip, or an admin merge let through.
        # Intentional breaking changes are covered the same way they always
        # were: the PR that makes the change adds a permanent entry to
        # .github/api-breakage-allowlist.txt (see ci.yml for why the
        # allowlist exists — it also absorbs false-positive "removed"
        # reports from downward type relocations behind `@_exported`
        # re-export shims, P2a Contract extraction, #1719/#1723).
        #
        # `--targets` is kept (rather than whole-package mode) for scope
        # control; the historical blocker — the trait-gated `llama` C module
        # ("missing required module 'llama'") — left with the C2 companion
        # split, so whole-package mode may work again; revisit in C4.
        #
        # The umbrella `ManifoldKit` target is DELIBERATELY NOT listed: the
        # five targets below cover everything `import ManifoldKit` consumers
        # touch except the backend families, which are pinned via the backend
        # seam freeze fixture + companion contract suites.
        id: api-check
        run: |
          set -euo pipefail
          swift package diagnose-api-breaking-changes "$BASELINE_SHA" \
            --targets ManifoldInference --targets ManifoldRuntime --targets ManifoldCloudCore \
            --targets ManifoldPersistenceSwiftData --targets ManifoldUI \
            --breakage-allowlist-path .github/api-breakage-allowlist.txt

      - name: Stage test diagnostics
        # Mirrors ci.yml: each step writes to a unique workspace log path so
        # diagnostics from earlier failures are preserved.
        if: failure()
        env:
          LARGE_SESSION_LIST_FAILED: ${{ steps.test-large-session-list.outcome == 'failure' }}
          INTEGRATED_STREAMING_FAILED: ${{ steps.test-integrated-streaming.outcome == 'failure' }}
          TRAFFIC_BOUNDARY_AUDIT_FAILED: ${{ steps.test-traffic-boundary-audit.outcome == 'failure' }}
          AUDIT_SABOTAGE_FAILED: ${{ steps.test-audit-sabotage.outcome == 'failure' }}
          MCP_E2E_SMOKE_FAILED: ${{ steps.test-mcp-e2e-smoke.outcome == 'failure' }}
          OPERATIONAL_FAILED: ${{ steps.test-operational.outcome == 'failure' }}
          COVERAGE_THRESHOLDS_FAILED: ${{ steps.test-coverage-thresholds.outcome == 'failure' }}
          API_CHECK_FAILED: ${{ steps.api-check.outcome == 'failure' }}
        run: |
          mkdir -p test-diagnostics
          {
            echo "run-id=${{ github.run_id }}"
            echo "run-attempt=${{ github.run_attempt }}"
            echo "job=slow"
            echo "large-session-list-failed=${LARGE_SESSION_LIST_FAILED}"
            echo "integrated-streaming-failed=${INTEGRATED_STREAMING_FAILED}"
            echo "traffic-boundary-audit-failed=${TRAFFIC_BOUNDARY_AUDIT_FAILED}"
            echo "audit-sabotage-failed=${AUDIT_SABOTAGE_FAILED}"
            echo "mcp-e2e-smoke-failed=${MCP_E2E_SMOKE_FAILED}"
            echo "operational-failed=${OPERATIONAL_FAILED}"
            echo "coverage-thresholds-failed=${COVERAGE_THRESHOLDS_FAILED}"
            echo "api-check-failed=${API_CHECK_FAILED}"
          } > test-diagnostics/failed-steps.txt

      - name: Upload test diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-slow-tests-diagnostics-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 7
          path: test-diagnostics/

      - name: Open GitHub issue on failure
        # Creates a tracking issue so a nightly failure is visible without
        # relying on GitHub's email digest. De-duplication: if an open issue
        # with the same title prefix already exists, appends a comment instead
        # of opening a second issue — avoids spam during multi-day failure runs.
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          title="Nightly slow tests failed"
          existing=$(gh issue list \
            --repo "${{ github.repository }}" \
            --state open \
            --search "${title} in:title" \
            --json number \
            --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "Open issue #${existing} already exists — adding comment."
            gh issue comment "$existing" \
              --repo "${{ github.repository }}" \
              --body "Also failed on [run ${{ github.run_id }}](${run_url})."
          else
            gh issue create \
              --repo "${{ github.repository }}" \
              --title "${title}" \
              --body "$(printf '## Nightly slow tests failed\n\n**Run:** [%s](%s)\n\nCheck the run logs for which steps failed and close this issue once resolved.' "${{ github.run_id }}" "${run_url}")"
          fi

  # Cold-start conformance gates (tier 1/2/3 + specialised MCP/Voice/
  # UIModelManagement), consolidated onto a single runner — same approach as
  # ci.yml. These were per-PR gates in ci.yml until they were carved out here:
  # they very rarely fail (they exercise stable package-graph + public-surface
  # shape) and added ~9 min of 10×-billed macOS wall-clock to every PR. ci.yml
  # still runs them on PRs that actually touch Package.swift / Package.resolved
  # / the gate scripts / Sources/ManifoldFoundation; this nightly job re-runs
  # them unconditionally so we still catch Sources-only regressions that wiggle
  # a public symbol downstream-visible. Steps 2–6 use
  # `if: success() || failure()` so one failure doesn't mask the others.
  cold-start:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Swift CI environment
        uses: ./.github/actions/setup-swift-ci

      - name: Cold-start tier 1 — public consumer surface
        timeout-minutes: 10
        run: scripts/cold-start-conformance.sh

      - name: Cold-start tier 2 — ManifoldBootstrap → ChatViewModel
        if: success() || failure()
        timeout-minutes: 10
        run: scripts/cold-start-tier2-bootstrap.sh

      - name: Cold-start tier 3 — ChatView composition
        if: success() || failure()
        timeout-minutes: 10
        run: bash scripts/cold-start-tier3-chatview.sh

      - name: Cold-start specialised — ManifoldMCP
        if: success() || failure()
        timeout-minutes: 10
        run: scripts/cold-start-specialised-mcp.sh

      - name: Cold-start specialised — ManifoldVoice
        if: success() || failure()
        timeout-minutes: 10
        run: scripts/cold-start-specialised-voice.sh

      - name: Cold-start specialised — ManifoldUIModelManagement
        if: success() || failure()
        timeout-minutes: 10
        run: scripts/cold-start-specialised-uimodelmanagement.sh

  # Merged-tree backstop for the trait-gated / simulator suites that the merge
  # queue never validates. On merge_group ci.yml bypasses the paths-filter, so
  # server-tests / macros-tests / ci-ios-file-protection never run on the queue
  # branch, and since the queue-validated post-merge skip (#2115) they no longer
  # re-run on push-to-main either. Their last run is the PR-level check against
  # the merge-ref at ready time — this job re-runs all three daily against
  # actual main, so a cross-PR semantic conflict in these surfaces is caught
  # within 24h (same trade as the push-burst collapse, #1871, and doc-gates
  # below). cold-start already has its own unconditional nightly job above.
  # Steps use `if: success() || failure()` so one failure doesn't mask the rest.
  queue-merge-backstop:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Swift CI environment
        uses: ./.github/actions/setup-swift-ci
        with:
          verify-toolchain: "true"

      - name: Test — Server suite (Server trait)
        timeout-minutes: 15
        run: scripts/test.sh --filter ManifoldServerTests --traits Server --skip-update --min-passed 1

      - name: Test — @ToolSchema macro suite (Macros trait)
        if: success() || failure()
        timeout-minutes: 15
        run: scripts/test.sh --filter ToolSchemaMacro --traits Macros --skip-update --min-passed 1

      - name: Test — ModelContainerFileProtectionTests (iOS Simulator)
        if: success() || failure()
        timeout-minutes: 15
        run: scripts/test-ios-simulator.sh --ci

  # Doc-snippet + human-path cold-start gates — the 24h post-merge backstop.
  # readme-snippets.yml and cold-start-human.yml run these scripts on PRs (via
  # their source `paths:` filters), but as of PR #1870 those workflows dropped
  # their push-to-main triggers. This job restores a real backstop: it runs both
  # gate scripts on the nightly schedule so a Sources-only change that landed via
  # a PR whose paths filter didn't fire (or a direct doc edit) is still caught
  # within 24h. cold-start-human.yml additionally wires a persistent build cache
  # via MANIFOLDKIT_COLD_START_BUILD_CACHE_DIR, but that is a per-run speed
  # optimization only — the script runs correctly without it, so it is omitted
  # here.
  doc-gates:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Swift CI environment
        uses: ./.github/actions/setup-swift-ci

      - name: README + QUICKSTART + DocC snippet compile gate
        timeout-minutes: 20
        run: scripts/extract-snippets-test.sh

      - name: Cold-start tier 4 — human path (README from line 1)
        if: success() || failure()
        timeout-minutes: 10
        run: bash scripts/cold-start-human.sh
