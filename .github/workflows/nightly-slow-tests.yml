name: Nightly slow tests

# Runs the expensive tests excluded from per-PR CI:
#  - LargeSessionListPerformanceTests — XCTMeasure perf baselines (~65s)
#  - IntegratedStreamingPerformanceTests — full pipeline TTFT/cadence/E2E baselines (~20s)
#  - TrafficBoundaryAuditTest — source-tree boundary audit (~50s); as of
#    issue #1706 this also runs per-PR in ci.yml's ManifoldInferenceTests
#    batch — it is kept here for nightly double-coverage, no longer gated.
#    When this audit fails (e.g. issue #1709: a new file did direct URLSession
#    I/O), the fix is to route the call through URLSessionProvider or add the
#    file to TrafficBoundaryAuditTest.networkIOAllowlist with reviewer sign-off
#    — the audit is doing its job, not flaking.
#  - ManifoldMCPE2ESmokeTests — explicitly gated MCP streamable-HTTP E2E smoke
# The perf suites are gated by RUN_SLOW_TESTS=1 in their setUp; the main `ci.yml`
# job leaves that unset so they skip there. Local `swift test` runs them
# unconditionally (CI is also unset locally). MCP E2E remains separately gated
# by RUN_MCP_E2E=1 plus a narrow smoke filter so npx/network subprocess tests
# do not run here. (The former SABOTAGE=1 audit-sabotage suite retired 2026-07:
# sabotage tests now live in each audit's own file and run per-PR.)

on:
  schedule:
    # 04:30 UTC daily — quiet window. (fuzz-nightly's 05:00 UTC slot is
    # currently dispatch-only pending a self-hosted Apple-Silicon runner.)
    - cron: "30 4 * * *"
  workflow_dispatch:

# A `workflow_dispatch` triggered while a scheduled run is still in flight
# would race on the SwiftPM cache key and double-bill the macos-15 runner.
# Cancel the in-flight run so only one is ever active.
concurrency:
  group: nightly-slow-tests
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  slow:
    runs-on: macos-15
    # Steps sum well past 30 on a cold cache (coverage alone is ~15m, plus the
    # full-package api-digester step and six test steps) — 45 gives headroom.
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
    env:
      RUN_SLOW_TESTS: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Full history + tags: the API baseline below is resolved via
          # `git describe --tags`, which needs every tag ref plus the tag
          # commit's tree objects present locally. A shallow, tagless clone
          # (the actions/checkout default) can neither resolve nor diff
          # against a tag. fetch-tags is redundant once fetch-depth is 0 (a
          # full fetch pulls tags regardless) but is set explicitly so the
          # dependency is obvious without reading the checkout-action docs.
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Swift CI environment
        uses: ./.github/actions/setup-swift-ci

      - name: Capture API baseline SHA
        # The nightly api-check (below) diffs the current tree against the
        # latest release tag — not against `origin/main` and not against
        # this job's own HEAD. A floating branch ref re-resolved live,
        # ~26 min into the job, races any PR that merges to main in the
        # meantime: the moving ref can end up newer than the checked-out
        # tree, and diagnose-api-breaking-changes reports inverted
        # (spurious) breakages. That race fired in run 28574236073 (#2113).
        # A release tag is immutable once cut, so resolving it once here —
        # right after checkout, while tags are guaranteed present (see the
        # Checkout step's fetch-depth/fetch-tags) — and reusing the SHA for
        # the rest of the job is race-free by construction, with no
        # HEAD-vs-HEAD degenerate case.
        run: |
          set -euo pipefail
          BASELINE_TAG=$(git describe --tags --abbrev=0)
          BASELINE_SHA=$(git rev-parse "$BASELINE_TAG")
          echo "Baseline: $BASELINE_TAG ($BASELINE_SHA)"
          echo "BASELINE_SHA=$BASELINE_SHA" >> "$GITHUB_ENV"

      - name: Test — LargeSessionListPerformanceTests
        id: test-large-session-list
        env:
          MANIFOLD_TEST_OUTPUT_FILE: ${{ github.workspace }}/test-diagnostics/test-large-session-list.log
        run: scripts/test.sh --filter "ManifoldUITests.LargeSessionListPerformanceTests" --skip-update --min-passed 1

      - name: Test — IntegratedStreamingPerformanceTests
        id: test-integrated-streaming
        env:
          MANIFOLD_TEST_OUTPUT_FILE: ${{ github.workspace }}/test-diagnostics/test-integrated-streaming.log
        run: scripts/test.sh --filter "ManifoldUITests.IntegratedStreamingPerformanceTests" --skip-update --min-passed 1

      - name: Test — TrafficBoundaryAuditTest
        id: test-traffic-boundary-audit
        env:
          MANIFOLD_TEST_OUTPUT_FILE: ${{ github.workspace }}/test-diagnostics/test-traffic-boundary-audit.log
        run: scripts/test.sh --filter "ManifoldInferenceTests.TrafficBoundaryAuditTest" --skip-update --min-passed 1

      - name: Test — MCP streamable HTTP E2E smoke
        id: test-mcp-e2e-smoke
        env:
          RUN_MCP_E2E: "1"
          MANIFOLD_TEST_OUTPUT_FILE: ${{ github.workspace }}/test-diagnostics/test-mcp-e2e-smoke.log
        run: scripts/test.sh --filter "ManifoldMCPE2ESmokeTests" --skip-update --min-passed 1

      - name: Test — Operational tier (soak + migration)
        id: test-operational
        env:
          RUN_OPERATIONAL_TESTS: "1"
          MANIFOLD_TEST_OUTPUT_FILE: ${{ github.workspace }}/test-diagnostics/test-operational.log
        run: |
          scripts/test.sh --filter "ManifoldPersistenceSwiftDataTests.SchemaV3MigrationTests" \
            --skip-update --min-passed 1
          scripts/test.sh --filter "ManifoldRuntimeTests.SoakRunnerTests" \
            --skip-update --min-passed 1
          scripts/test.sh --filter "ManifoldRuntimeTests.SessionDiscardOrderingTests" \
            --skip-update --min-passed 1

      # Coverage thresholds — runs a fresh swift test with --enable-code-coverage
      # over the four critical modules and verifies each module's line coverage
      # meets its threshold (set 10pp below the 2026-05-15 baseline). Moved here
      # from ci.yml's per-main-push step to reclaim ~130s wall (~22 billed
      # macOS-min) per push; thresholds are conservative enough that a ≤24h
      # detection delay is acceptable. See scripts/check-coverage.sh for
      # threshold values and rationale.
      #
      # Bounded retry (issue #2277): this step used to call `swift test`
      # directly instead of scripts/test.sh, reimplementing (badly) that
      # script's crash-vs-failure accounting. It now routes through
      # scripts/test.sh so it inherits the SAME suite-completion tracking
      # every other step in this workflow already relies on
      # (xctest_crashed_suites / st_crashed_suites → "RESULT: INCOMPLETE"),
      # rather than a hand-rolled, weaker copy.
      #
      # scripts/test.sh classifies every run into exactly one of:
      #   RESULT: PASSED
      #   RESULT: FAILED (N test failure(s))               — a real assertion failed
      #   RESULT: INCOMPLETE — N suite(s) crashed (signal…) — a suite started but
      #                                                        never printed passed/failed
      #   RESULT: FAILED (swift test exit code N)           — 0 failures AND 0 crashed
      #                                                        suites (every suite that
      #                                                        started also finished
      #                                                        cleanly), yet the
      #                                                        underlying `swift test`
      #                                                        process still exited
      #                                                        nonzero.
      # Only the last shape is retried: it is the one case scripts/test.sh's
      # own accounting proves is not an observed regression — a real crashing
      # test (fatalError/precondition/trap before the failing test ever prints
      # its own "failed" line) shows up as a crashed suite → INCOMPLETE, which
      # is NEVER retried, so a nondeterministic crash cannot be retried away
      # into a false green. Run 29478463863 hit exactly the retryable shape:
      # 0 XCTest/Swift-Testing failures anywhere in the log, but the raw
      # `swift test` exit code was nonzero on a stray "unexpected signal code"
      # line near the tail — check-coverage.sh never even got to run before
      # the old `set -euo pipefail` inline script killed the step.
      - name: Coverage thresholds
        id: test-coverage-thresholds
        timeout-minutes: 30
        env:
          MANIFOLD_TEST_OUTPUT_FILE: ${{ github.workspace }}/test-diagnostics/test-coverage-thresholds.log
        run: |
          # GitHub's default bash wrapper for `run:` sets -e; we need it off so
          # a nonzero scripts/test.sh exit doesn't abort this script before we
          # can inspect its exit code and decide whether to retry.
          set +e -uo pipefail

          mkdir -p "$(dirname "$MANIFOLD_TEST_OUTPUT_FILE")"

          MAX_ATTEMPTS=2
          ATTEMPT=1
          while :; do
            # Per-attempt log so a flake-then-pass sequence stays auditable in
            # the uploaded test-diagnostics artifact instead of the first
            # attempt's output being overwritten by the retry.
            #
            # ATTEMPT_LOG (passed as scripts/test.sh's own MANIFOLD_TEST_OUTPUT_FILE)
            # only ever receives the raw `swift test | tee` stream that script
            # captures internally (test.sh:~402) — it never contains the
            # "RESULT: ..." classification line, which test.sh prints to ITS
            # OWN stdout from the summary block (test.sh:~568-591). That summary
            # is what we grep below, so it must be captured separately here via
            # its own tee, with PIPESTATUS[0] (not tee's exit code) as TEST_EXIT.
            ATTEMPT_LOG="${MANIFOLD_TEST_OUTPUT_FILE}.attempt${ATTEMPT}"
            ATTEMPT_SUMMARY="${ATTEMPT_LOG}.summary"

            echo "::group::scripts/test.sh --enable-code-coverage (attempt ${ATTEMPT}/${MAX_ATTEMPTS})"
            MANIFOLD_TEST_OUTPUT_FILE="$ATTEMPT_LOG" scripts/test.sh \
              --filter ManifoldCoreTests \
              --filter ManifoldRuntimeTests \
              --filter ManifoldPersistenceSwiftDataTests \
              --filter ManifoldInferenceTests \
              --filter ManifoldMCPTests \
              --enable-code-coverage \
              --skip-update \
              --min-passed 2500 2>&1 | tee "$ATTEMPT_SUMMARY"
            TEST_EXIT=${PIPESTATUS[0]}
            echo "::endgroup::"

            cp "$ATTEMPT_LOG" "$MANIFOLD_TEST_OUTPUT_FILE"

            if [[ $TEST_EXIT -eq 0 ]]; then
              break
            fi

            # The RESULT line lives in the summary (test.sh's own stdout), not
            # in ATTEMPT_LOG (the raw swift-test capture) — see the comment
            # above. test.sh's "FAILED (N test failure(s))" and "FAILED (swift
            # test exit code N)" branches can both exit 1, so only this printed
            # classification — not the bare exit code — tells them apart.
            if grep -q "RESULT: FAILED (swift test exit code" "$ATTEMPT_SUMMARY" && [[ $ATTEMPT -lt $MAX_ATTEMPTS ]]; then
              echo "scripts/test.sh reported 0 test failures and 0 crashed suites, but swift test's own exit code was nonzero — retrying (known flake, issue #2277)."
              ATTEMPT=$((ATTEMPT + 1))
              continue
            fi

            echo "scripts/test.sh failed (exit ${TEST_EXIT}) — see ${ATTEMPT_LOG} for full test output and ${ATTEMPT_SUMMARY} for the classification. Not retrying: either a real test failure or a suite never completed (RESULT: INCOMPLETE), which is never treated as benign."
            exit "$TEST_EXIT"
          done

          scripts/check-coverage.sh

      - name: Public API source-compatibility check (full — all library-product targets)
        # Full unconditional check across every `.library()` product in
        # Package.swift, diffed against $BASELINE_SHA — the latest release
        # tag, resolved once in "Capture API baseline SHA" above — not a
        # live-reresolved `origin/main` ref and not this job's own HEAD.
        #
        # Why a release tag and not `origin/main`: `origin/main` is a
        # floating ref. Re-resolving it live, ~26 min into this job, races
        # any PR that merges to main in the meantime — the ref can move
        # newer than the checked-out tree, and diagnose-api-breaking-changes
        # reports inverted (spurious) breakages. That race fired in run
        # 28574236073 (#2113). Pinning to HEAD-at-checkout closed the race
        # but made the diff a permanent HEAD-vs-HEAD no-op — every run
        # compared the tree to itself, so this check could never actually
        # fail. A release tag is immutable once cut, giving a fixed,
        # meaningfully-different baseline with no re-resolution race.
        #
        # Why this step exists at all, given ci.yml's per-PR gate: that gate
        # skips entirely on doc/test/script-only changes and does not run on
        # `merge_group` events at all — so queue-merged trees are never
        # digester-checked by it. This nightly run is the only place that
        # coverage lives unconditionally; it is the 24h backstop that catches
        # whatever the per-PR gate's path filter, merge_group skip, or an
        # admin merge let through. Intentional breaking changes are covered
        # the same way they always were: the PR that makes the change adds a
        # permanent entry to .github/api-breakage-allowlist.txt (see ci.yml
        # for why the allowlist exists — it also absorbs false-positive
        # "removed" reports from downward type relocations behind
        # `@_exported` re-export shims, P2a Contract extraction, #1719/#1723).
        #
        # `--targets` is kept (rather than whole-package mode) for scope
        # control; the historical blocker — the trait-gated `llama` C module
        # ("missing required module 'llama'") — left with the C2 companion
        # split, so whole-package mode may work again; revisit in C4.
        #
        # Shared list from scripts/api-digester-targets.txt (with ci.yml) so
        # the two digester invocations cannot drift. Edit the .txt when a
        # product is added/removed/renamed. ManifoldServerKit intentionally
        # excluded (trait-gated; see the .txt header).
        id: api-check
        run: |
          set -euo pipefail
          TARGETS=()
          while IFS= read -r flag; do
            TARGETS+=("$flag")
          done < <(scripts/api-digester-targets.sh)
          swift package diagnose-api-breaking-changes "$BASELINE_SHA" "${TARGETS[@]}" \
            --breakage-allowlist-path .github/api-breakage-allowlist.txt

      - name: Stage test diagnostics
        # Mirrors ci.yml: each step writes to a unique workspace log path so
        # diagnostics from earlier failures are preserved.
        if: failure()
        env:
          LARGE_SESSION_LIST_FAILED: ${{ steps.test-large-session-list.outcome == 'failure' }}
          INTEGRATED_STREAMING_FAILED: ${{ steps.test-integrated-streaming.outcome == 'failure' }}
          TRAFFIC_BOUNDARY_AUDIT_FAILED: ${{ steps.test-traffic-boundary-audit.outcome == 'failure' }}
          MCP_E2E_SMOKE_FAILED: ${{ steps.test-mcp-e2e-smoke.outcome == 'failure' }}
          OPERATIONAL_FAILED: ${{ steps.test-operational.outcome == 'failure' }}
          COVERAGE_THRESHOLDS_FAILED: ${{ steps.test-coverage-thresholds.outcome == 'failure' }}
          API_CHECK_FAILED: ${{ steps.api-check.outcome == 'failure' }}
        run: |
          mkdir -p test-diagnostics
          {
            echo "run-id=${{ github.run_id }}"
            echo "run-attempt=${{ github.run_attempt }}"
            echo "job=slow"
            echo "large-session-list-failed=${LARGE_SESSION_LIST_FAILED}"
            echo "integrated-streaming-failed=${INTEGRATED_STREAMING_FAILED}"
            echo "traffic-boundary-audit-failed=${TRAFFIC_BOUNDARY_AUDIT_FAILED}"
            echo "mcp-e2e-smoke-failed=${MCP_E2E_SMOKE_FAILED}"
            echo "operational-failed=${OPERATIONAL_FAILED}"
            echo "coverage-thresholds-failed=${COVERAGE_THRESHOLDS_FAILED}"
            echo "api-check-failed=${API_CHECK_FAILED}"
          } > test-diagnostics/failed-steps.txt

      - name: Upload test diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-slow-tests-diagnostics-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 7
          path: test-diagnostics/

      - name: Open GitHub issue on failure
        # Creates a tracking issue so a nightly failure is visible without
        # relying on GitHub's email digest. De-duplication keys on the STABLE
        # search title ("Nightly slow tests failed") so repeat failures keep
        # threading onto one issue — but the created/commented title and body
        # inline which step(s) actually failed (from failed-steps.txt, staged
        # above) instead of a generic "check the logs" pointer. A prior shape
        # here left failed-steps.txt computed but unused in the issue itself.
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          search_title="Nightly slow tests failed"

          failed_list=""
          if [ -f test-diagnostics/failed-steps.txt ]; then
            while IFS='=' read -r key value; do
              case "$key" in
                run-id|run-attempt|job) continue ;;
              esac
              if [ "$value" = "true" ]; then
                step_name="${key%-failed}"
                if [ -z "$failed_list" ]; then
                  failed_list="$step_name"
                else
                  failed_list="$failed_list, $step_name"
                fi
              fi
            done < test-diagnostics/failed-steps.txt
          fi
          first_failed="${failed_list%%,*}"

          if [ -n "$first_failed" ]; then
            title="${search_title}: ${first_failed}"
            cause_line="**Failed step(s):** ${failed_list}"
          else
            title="$search_title"
            cause_line="**Failed step(s):** unknown (a step outside the tracked set failed — check the run logs)"
          fi

          existing=$(gh issue list \
            --repo "${{ github.repository }}" \
            --state open \
            --search "${search_title} in:title" \
            --json number \
            --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "Open issue #${existing} already exists — adding comment."
            gh issue comment "$existing" \
              --repo "${{ github.repository }}" \
              --body "$(printf 'Also failed on [run %s](%s).\n\n%s' "${{ github.run_id }}" "${run_url}" "${cause_line}")"
          else
            gh issue create \
              --repo "${{ github.repository }}" \
              --title "${title}" \
              --body "$(printf '## Nightly slow tests failed\n\n**Run:** [%s](%s)\n\n%s\n\nCheck the run logs for full detail and close this issue once resolved.' "${{ github.run_id }}" "${run_url}" "${cause_line}")"
          fi

  # Cold-start conformance gates (tier 1/2/3 + specialised MCP/Voice/
  # UIModelManagement), consolidated onto a single runner — same approach as
  # ci.yml. These were per-PR gates in ci.yml until they were carved out here:
  # they very rarely fail (they exercise stable package-graph + public-surface
  # shape) and added ~9 min of 10×-billed macOS wall-clock to every PR. ci.yml
  # still runs them on PRs that actually touch Package.swift / Package.resolved
  # / the gate scripts / Sources/ManifoldFoundation; this nightly job re-runs
  # them unconditionally so we still catch Sources-only regressions that wiggle
  # a public symbol downstream-visible. Steps 2–6 use
  # `if: success() || failure()` so one failure doesn't mask the others.
  cold-start:
    runs-on: macos-15
    # Must exceed the sum of the step budgets (6 × 10 min) plus checkout +
    # Swift CI setup + the issue-reporter step: a job-level timeout marks
    # steps `cancelled`, not `failure`, so the `if: failure()` reporter below
    # would be skipped and the failure would stay silent — the reporter only
    # works if per-step timeouts, not the job ceiling, are what trip first.
    timeout-minutes: 75
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Swift CI environment
        uses: ./.github/actions/setup-swift-ci

      - name: Cold-start tier 1 — public consumer surface
        id: cs-tier1
        timeout-minutes: 10
        run: scripts/cold-start-conformance.sh

      - name: Cold-start tier 2 — ManifoldBootstrap → ChatViewModel
        id: cs-tier2
        if: success() || failure()
        timeout-minutes: 10
        run: scripts/cold-start-tier2-bootstrap.sh

      - name: Cold-start tier 3 — ChatView composition
        id: cs-tier3
        if: success() || failure()
        timeout-minutes: 10
        run: bash scripts/cold-start-tier3-chatview.sh

      - name: Cold-start specialised — ManifoldMCP
        id: cs-mcp
        if: success() || failure()
        timeout-minutes: 10
        run: scripts/cold-start-specialised-mcp.sh

      - name: Cold-start specialised — ManifoldVoice
        id: cs-voice
        if: success() || failure()
        timeout-minutes: 10
        run: scripts/cold-start-specialised-voice.sh

      - name: Cold-start specialised — ManifoldUIModelManagement
        id: cs-uimm
        if: success() || failure()
        timeout-minutes: 10
        run: scripts/cold-start-specialised-uimodelmanagement.sh

      - name: Open GitHub issue on failure
        # Creates a tracking issue so a nightly failure is visible without
        # relying on GitHub's email digest. De-duplication keys on the STABLE
        # search title ("Nightly cold-start gates failed") so repeat failures keep threading
        # onto one issue — but the created/commented title and body inline
        # which step(s) actually failed instead of a generic "check the
        # logs" pointer. GH_TOKEN is still needed for gh; kept alongside the outcome env vars below.
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          CS_TIER1_FAILED: ${{ steps.cs-tier1.outcome == 'failure' }}
          CS_TIER2_FAILED: ${{ steps.cs-tier2.outcome == 'failure' }}
          CS_TIER3_FAILED: ${{ steps.cs-tier3.outcome == 'failure' }}
          CS_MCP_FAILED: ${{ steps.cs-mcp.outcome == 'failure' }}
          CS_VOICE_FAILED: ${{ steps.cs-voice.outcome == 'failure' }}
          CS_UIMM_FAILED: ${{ steps.cs-uimm.outcome == 'failure' }}
        run: |
          set -euo pipefail
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          search_title="Nightly cold-start gates failed"

          failed_list=""
          add_if_failed() {
            if [ "$2" = "true" ]; then
              if [ -z "$failed_list" ]; then failed_list="$1"; else failed_list="$failed_list, $1"; fi
            fi
          }
          add_if_failed "cs-tier1" "${CS_TIER1_FAILED}"
          add_if_failed "cs-tier2" "${CS_TIER2_FAILED}"
          add_if_failed "cs-tier3" "${CS_TIER3_FAILED}"
          add_if_failed "cs-mcp" "${CS_MCP_FAILED}"
          add_if_failed "cs-voice" "${CS_VOICE_FAILED}"
          add_if_failed "cs-uimm" "${CS_UIMM_FAILED}"
          first_failed="${failed_list%%,*}"

          if [ -n "$first_failed" ]; then
            title="${search_title}: ${first_failed}"
            cause_line="**Failed step(s):** ${failed_list}"
          else
            title="$search_title"
            cause_line="**Failed step(s):** unknown (a step outside the tracked set failed — check the run logs)"
          fi

          existing=$(gh issue list \
            --repo "${{ github.repository }}" \
            --state open \
            --search "${search_title} in:title" \
            --json number \
            --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "Open issue #${existing} already exists — adding comment."
            gh issue comment "$existing" \
              --repo "${{ github.repository }}" \
              --body "$(printf 'Also failed on [run %s](%s).\n\n%s' "${{ github.run_id }}" "${run_url}" "${cause_line}")"
          else
            gh issue create \
              --repo "${{ github.repository }}" \
              --title "${title}" \
              --body "$(printf '## Nightly cold-start gates failed\n\n**Run:** [%s](%s)\n\n%s\n\nCheck the run logs for full detail and close this issue once resolved.' "${{ github.run_id }}" "${run_url}" "${cause_line}")"
          fi

  # Member-aware public-surface baseline (docs/plans/api-review-wave2-2026-07.md
  # item 0.A). Complements the `slow` job's api-check step above: that step
  # diagnoses BREAKING changes only (removals, type/signature changes) via
  # `swift package diagnose-api-breaking-changes` against the last release
  # tag; this job catches pure ADDITIONS and public->package DEMOTIONS via
  # scripts/api-surface-baseline.sh's member-granular checked-in baseline
  # (Tests/APIFreezeTests/api-surface-baseline/*.txt), diffed against the
  # live working tree. Neither gate subsumes the other — see the script's
  # own header "Division of labor" section. Own job (not folded into `slow`)
  # because the script's cold-cache cost (~13 min measured at 7-module scope,
  # more at the current 27-module scope) doesn't fit inside `slow`'s 30-minute
  # timeout alongside everything else that job already runs.
  api-surface-baseline:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Swift CI environment
        uses: ./.github/actions/setup-swift-ci

      - name: Public API member-aware surface baseline (--check)
        run: bash scripts/api-surface-baseline.sh --check

  # Merged-tree backstop for the trait-gated / simulator suites that the merge
  # queue never validates. On merge_group ci.yml bypasses the paths-filter, so
  # server-tests / macros-tests / ci-ios-file-protection / mcp-fixture-check
  # never run on the queue branch, and since the queue-validated post-merge skip
  # (#2115) they no longer re-run on push-to-main either. Their last run is the
  # PR-level check against the merge-ref at ready time — this job re-runs all
  # four daily against actual main, so a cross-PR semantic conflict in these
  # surfaces is caught within 24h (same trade as the push-burst collapse, #1871,
  # and doc-gates below). cold-start already has its own unconditional nightly
  # job above. Steps use `if: success() || failure()` so one failure doesn't
  # mask the rest.
  queue-merge-backstop:
    runs-on: macos-15
    # Step budgets sum to 50 min (15+15+15+5); checkout + Swift CI setup +
    # the issue-reporter step need real headroom on top — a job-level timeout
    # marks steps `cancelled`, not `failure`, which would skip the
    # `if: failure()` reporter below (see cold-start).
    timeout-minutes: 70
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Swift CI environment
        uses: ./.github/actions/setup-swift-ci
        with:
          verify-toolchain: "true"

      - name: Test — Server suite (Server trait)
        id: test-server
        timeout-minutes: 15
        run: scripts/test.sh --filter ManifoldServerTests --traits Server --skip-update --min-passed 1

      - name: Test — @ToolSchema macro suite (Macros trait)
        id: test-macros
        if: success() || failure()
        timeout-minutes: 15
        run: scripts/test.sh --filter ToolSchemaMacro --traits Macros --skip-update --min-passed 1

      - name: Test — ModelContainerFileProtectionTests (iOS Simulator)
        id: test-ios-file-protection
        if: success() || failure()
        timeout-minutes: 15
        run: scripts/test-ios-simulator.sh --ci

      - name: Check MCP provider fixtures are up to date
        id: check-mcp-fixtures
        if: success() || failure()
        timeout-minutes: 5
        run: scripts/regenerate-mcp-fixtures.sh --check

      - name: Open GitHub issue on failure
        # Creates a tracking issue so a nightly failure is visible without
        # relying on GitHub's email digest. De-duplication keys on the STABLE
        # search title ("Nightly queue-merge backstop failed") so repeat failures keep threading
        # onto one issue — but the created/commented title and body inline
        # which step(s) actually failed instead of a generic "check the
        # logs" pointer.
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_SERVER_FAILED: ${{ steps.test-server.outcome == 'failure' }}
          TEST_MACROS_FAILED: ${{ steps.test-macros.outcome == 'failure' }}
          TEST_IOS_FILE_PROTECTION_FAILED: ${{ steps.test-ios-file-protection.outcome == 'failure' }}
          CHECK_MCP_FIXTURES_FAILED: ${{ steps.check-mcp-fixtures.outcome == 'failure' }}
        run: |
          set -euo pipefail
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          search_title="Nightly queue-merge backstop failed"

          failed_list=""
          add_if_failed() {
            if [ "$2" = "true" ]; then
              if [ -z "$failed_list" ]; then failed_list="$1"; else failed_list="$failed_list, $1"; fi
            fi
          }
          add_if_failed "test-server" "${TEST_SERVER_FAILED}"
          add_if_failed "test-macros" "${TEST_MACROS_FAILED}"
          add_if_failed "test-ios-file-protection" "${TEST_IOS_FILE_PROTECTION_FAILED}"
          add_if_failed "check-mcp-fixtures" "${CHECK_MCP_FIXTURES_FAILED}"
          first_failed="${failed_list%%,*}"

          if [ -n "$first_failed" ]; then
            title="${search_title}: ${first_failed}"
            cause_line="**Failed step(s):** ${failed_list}"
          else
            title="$search_title"
            cause_line="**Failed step(s):** unknown (a step outside the tracked set failed — check the run logs)"
          fi

          existing=$(gh issue list \
            --repo "${{ github.repository }}" \
            --state open \
            --search "${search_title} in:title" \
            --json number \
            --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "Open issue #${existing} already exists — adding comment."
            gh issue comment "$existing" \
              --repo "${{ github.repository }}" \
              --body "$(printf 'Also failed on [run %s](%s).\n\n%s' "${{ github.run_id }}" "${run_url}" "${cause_line}")"
          else
            gh issue create \
              --repo "${{ github.repository }}" \
              --title "${title}" \
              --body "$(printf '## Nightly queue-merge backstop failed\n\n**Run:** [%s](%s)\n\n%s\n\nCheck the run logs for full detail and close this issue once resolved.' "${{ github.run_id }}" "${run_url}" "${cause_line}")"
          fi

  # Doc-snippet + human-path cold-start gates — the 24h post-merge backstop.
  # readme-snippets.yml and cold-start-human.yml run these scripts on PRs (via
  # their source `paths:` filters), but as of PR #1870 those workflows dropped
  # their push-to-main triggers. This job restores a real backstop: it runs both
  # gate scripts on the nightly schedule so a Sources-only change that landed via
  # a PR whose paths filter didn't fire (or a direct doc edit) is still caught
  # within 24h. cold-start-human.yml additionally wires a persistent build cache
  # via MANIFOLDKIT_COLD_START_BUILD_CACHE_DIR, but that is a per-run speed
  # optimization only — the script runs correctly without it, so it is omitted
  # here.
  doc-gates:
    runs-on: macos-15
    # Step budgets sum to 30 min (20+10); checkout + Swift CI setup + the
    # issue-reporter step need headroom on top — a job-level timeout marks
    # steps `cancelled`, not `failure`, which would skip the `if: failure()`
    # reporter below (see cold-start).
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Swift CI environment
        uses: ./.github/actions/setup-swift-ci

      - name: README + QUICKSTART + DocC snippet compile gate
        id: doc-snippets
        timeout-minutes: 20
        run: scripts/extract-snippets-test.sh

      - name: Cold-start tier 4 — human path (README from line 1)
        id: cold-start-human
        if: success() || failure()
        timeout-minutes: 10
        run: bash scripts/cold-start-human.sh

      - name: Open GitHub issue on failure
        # Creates a tracking issue so a nightly failure is visible without
        # relying on GitHub's email digest. De-duplication keys on the STABLE
        # search title ("Nightly doc gates failed") so repeat failures keep threading
        # onto one issue — but the created/commented title and body inline
        # which step(s) actually failed instead of a generic "check the
        # logs" pointer.
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          DOC_SNIPPETS_FAILED: ${{ steps.doc-snippets.outcome == 'failure' }}
          COLD_START_HUMAN_FAILED: ${{ steps.cold-start-human.outcome == 'failure' }}
        run: |
          set -euo pipefail
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          search_title="Nightly doc gates failed"

          failed_list=""
          add_if_failed() {
            if [ "$2" = "true" ]; then
              if [ -z "$failed_list" ]; then failed_list="$1"; else failed_list="$failed_list, $1"; fi
            fi
          }
          add_if_failed "doc-snippets" "${DOC_SNIPPETS_FAILED}"
          add_if_failed "cold-start-human" "${COLD_START_HUMAN_FAILED}"
          first_failed="${failed_list%%,*}"

          if [ -n "$first_failed" ]; then
            title="${search_title}: ${first_failed}"
            cause_line="**Failed step(s):** ${failed_list}"
          else
            title="$search_title"
            cause_line="**Failed step(s):** unknown (a step outside the tracked set failed — check the run logs)"
          fi

          existing=$(gh issue list \
            --repo "${{ github.repository }}" \
            --state open \
            --search "${search_title} in:title" \
            --json number \
            --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "Open issue #${existing} already exists — adding comment."
            gh issue comment "$existing" \
              --repo "${{ github.repository }}" \
              --body "$(printf 'Also failed on [run %s](%s).\n\n%s' "${{ github.run_id }}" "${run_url}" "${cause_line}")"
          else
            gh issue create \
              --repo "${{ github.repository }}" \
              --title "${title}" \
              --body "$(printf '## Nightly doc gates failed\n\n**Run:** [%s](%s)\n\n%s\n\nCheck the run logs for full detail and close this issue once resolved.' "${{ github.run_id }}" "${run_url}" "${cause_line}")"
          fi
