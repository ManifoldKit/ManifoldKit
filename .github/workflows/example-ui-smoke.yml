name: Example UI smoke (advisory)

on:
  schedule:
    # Weekly Monday 06:15 UTC keeps macOS simulator spend bounded.
    - cron: "15 6 * * 1"
  workflow_dispatch:

concurrency:
  group: advisory-example-ui-smoke
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.3"

      - name: Build Example app UI tests
        run: scripts/example-ui-tests.sh build-for-testing

      - name: Run Example UI smoke test
        run: scripts/example-ui-tests.sh test-without-building -only-testing:AdvancedUITests/ChatFlowUITests/testEmptyStateShowsWelcome
