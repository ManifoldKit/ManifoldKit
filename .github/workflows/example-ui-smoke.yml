name: Example UI smoke (advisory)

on:
  schedule:
    # Weekly Monday 06:15 UTC keeps macOS simulator spend bounded.
    - cron: "15 6 * * 1"
  workflow_dispatch:

concurrency:
  group: advisory-example-ui-smoke
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: "26.3"

      - name: Build Example app UI tests
        run: scripts/example-ui-tests.sh build-for-testing

      - name: Run Example UI smoke test
        run: scripts/example-ui-tests.sh test-without-building -only-testing:AdvancedUITests/ChatFlowUITests/testEmptyStateShowsWelcome

      - name: Open GitHub issue on failure
        # Creates a tracking issue so an advisory smoke failure is visible
        # without relying on GitHub's email digest. De-duplication: if an open
        # issue with the same title prefix already exists, appends a comment
        # instead of opening a second issue — avoids spam during multi-week
        # failure runs.
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          title="Example UI smoke failed"
          existing=$(gh issue list \
            --repo "${{ github.repository }}" \
            --state open \
            --search "${title} in:title" \
            --json number \
            --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "Open issue #${existing} already exists — adding comment."
            gh issue comment "$existing" \
              --repo "${{ github.repository }}" \
              --body "Also failed on [run ${{ github.run_id }}](${run_url})."
          else
            gh issue create \
              --repo "${{ github.repository }}" \
              --title "${title}" \
              --body "$(printf '## Example UI smoke failed\n\n**Run:** [%s](%s)\n\nCheck the run logs for which steps failed and close this issue once resolved.' "${{ github.run_id }}" "${run_url}")"
          fi
