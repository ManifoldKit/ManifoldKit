name: README Snippets

# Compiles every `swift`-fenced code block in README.md, docs/QUICKSTART*.md,
# and every DocC catalog Markdown file under Sources/*/Documentation.docc/
# against the current ManifoldKit package. Catches snippet drift the moment a
# `feat:` PR renames a public type or removes an initializer that the docs
# still copy-paste.
#
# Wave D-C1 of the DX overhaul. DocC coverage added 2026-05-23 (A2-F8):
# broken `BuildingAChatUI.md` snippet shipped because the README-scoped gate
# could not see DocC articles. See:
#   - scripts/extract-snippets.sh        (block extraction + skip policy)
#   - scripts/extract-snippets-test.sh   (per-snippet swift build scaffold)
#
# Discrete workflow (not folded into ci.yml) because the failure mode is
# orthogonal: doc copy-paste correctness has nothing to do with the
# library's own test suites. Failures on this workflow point the author at
# the README/QUICKSTART/DocC block to fix, not at a Sources/ test target.

on:
  pull_request:
    # `ready_for_review` required so a draft→ready transition triggers this
    # gate (see CLAUDE.md §"Draft-PR review loop"); the job's draft guard keeps
    # drafts a zero-CI staging area.
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      # Any of these can invalidate a snippet:
      #   - The docs themselves (a new fence may need a no-build tag).
      #   - The umbrella module's public surface.
      #   - The Hello World's transitive surface (QuickStart, ManifoldUI types).
      #   - DocC catalog Markdown — added 2026-05-23 (A2-F8).
      #   - The scripts the gate runs (including check-readme.sh, which the
      #     workflow's pre-flight step invokes — leaving the script off the
      #     filter would mean an edit to the lint silently bypasses the gate).
      # Coverage is derived by extract-snippets.sh from README.md, AGENTS.md
      # and docs/*.md (minus its reasoned opt-out list), so this filter is a
      # superset rather than a hand-kept echo of it. The previous filter globbed
      # docs/QUICKSTART*.md while the extractor used an explicit list missing
      # QUICKSTART-IMAGE-GEN.md — so editing that file triggered this
      # job and compiled nothing from it. A superset can over-trigger; it can
      # never silently under-cover.
      # Scoped to exactly what extract-snippets.sh sweeps: root-level *.md and
      # docs/*.md (maxdepth 1). Deliberately NOT docs/**/*.md — that would
      # trigger this job for docs/plans/*.md, which the extractor does
      # not read, reinstating the QUICKSTART-IMAGE-GEN defect (job runs, checks
      # nothing) at a different scope.
      - "*.md"
      - "docs/*.md"
      - "Sources/**/*.docc/**/*.md"
      - "Sources/ManifoldKit/**"
      - "Sources/ManifoldUI/**"
      # ManifoldKitError lives in ManifoldModelCatalog; the dropped
      # QuickStart*.swift glob never existed — the Sources/ManifoldKit/**
      # glob above already covers the umbrella's Hello World surface.
      - "Sources/ManifoldModelCatalog/ManifoldKitError.swift"
      - "Package.swift"
      - "Package.resolved"
      - "scripts/check-readme.sh"
      - "scripts/extract-snippets.sh"
      # The ratchet's budget file. Listed for the same reason as the scripts
      # themselves: without it, a PR editing ONLY the TSV (bumping every count,
      # or deleting rows) runs no gate and nothing validates the change, then a
      # follow-up PR lands skips "within budget". Same self-validation rule the
      # cold-start filter states verbatim.
      - "scripts/snippet-skip-baseline.tsv"
      - "scripts/extract-snippets-test.sh"
      - ".github/workflows/readme-snippets.yml"

  # Merge queue. Required for this workflow to EVER become a required check: a
  # required context that never reports on the queue's `merge_group` branch is
  # assumed failed after `check_response_timeout_minutes` (60, per main's ruleset)
  # and the entry is ejected — so every batch stalls an hour and its PRs are
  # kicked out, repeatedly. Self-clearing rather than permanent, but self-inflicted
  # and awful; AGENTS.md's "stalls it forever" wording overstates it the same way.
  #
  # Beyond enabling the toggle, this run is worth having on its own merits: the
  # `paths:` filter above lists Sources/ManifoldKit/** and Sources/ManifoldUI/**,
  # but the snippets `import ManifoldKit`, whose umbrella target also depends on
  # ManifoldInference, ManifoldRuntime and ManifoldPersistenceSwiftData — none of
  # which appear in that filter. So a public rename in Inference or Runtime can
  # break a published snippet without triggering this workflow on the PR — not
  # always, but in the case that matters: an author who also updated the DocC
  # articles matches `Sources/**/*.docc/**/*.md` and does trigger it, so the gap
  # is precisely the DRIFT case, the author who forgot the docs. `test` does not
  # close it (the repo's own source and test targets are updated in the same PR,
  # so it is green; it does not compile docs) and `api-digester-check` flags the
  # rename itself, not the stale snippet. Today only nightly-slow-tests.yml's
  # `doc-gates` catches that, post-merge, within 24h. The unconditional queue run
  # is the only pre-merge coverage for the snippet still compiling. (The PR-level filter under-covering the umbrella's real dependency
  # surface is a pre-existing gap worth its own issue, not this PR's job.)
  #
  # merge_group carries no paths filter, so this runs on EVERY queued batch
  # regardless of the `paths:` above — including batches that touch no docs. That
  # is deliberate and matches ci.yml:88 ("the queue branch is the real pre-merge
  # state, so we always validate it"), but it is not free: each batch now holds a
  # second macos-15 slot alongside ci.yml's required `test`, against an org-wide
  # cap of ~5 concurrent. The job itself is short — MEASURED at 3-4 min across
  # recent runs, not the "~14 min" this file claimed until now; that figure was
  # already stale when written in #2183, because #1870 had cut this gate from
  # ~17 min to ~2.5 min (AGENTS.md records exactly that). Expect the merge_group
  # run to sit at the slower end: caches saved under a `gh-readonly-queue/...` ref
  # die with the batch (ci.yml:370-380), so every batch takes the restore-keys
  # partial hit.
  #
  # That cost only buys something once `readme-snippets` is actually required —
  # until then the queue does not wait on it and the result is discarded. So the
  # interim window should be SHORT: land this, confirm the check reports on a real
  # merge_group run, then add the required context. Leaving it un-required
  # indefinitely is the worst of both (full cost, no gate), and a failure on an
  # already-merged batch head surfaces as a red check on main that nothing gated
  # on — the red-but-not-blocking conditioning behind #2274 / #2287.
  merge_group:
    types: [checks_requested]

concurrency:
  group: readme-snippets-${{ github.event_name }}-${{ github.ref }}
  # Mirrors lint.yml for consistency. Note this is INERT for merge_group: the
  # group key already includes `github.ref`, which for a queue batch is the unique
  # `refs/heads/gh-readonly-queue/main/pr-N-<sha>` (ci.yml:113 documents the same),
  # so two batches never share a group and cancel-in-progress is never consulted.
  # Kept because the PR-side behaviour (force-push collapse) is what it is for.
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

permissions:
  contents: read

jobs:
  readme-snippets:
    # Skip on draft PRs — CI runs once the PR is marked ready.
    # The `github.event_name != 'pull_request'` clause states the intent
    # explicitly. It is NOT load-bearing, contrary to what this repo asserted in
    # four places (ci.yml, build-modes.yml, #2065's commit message, and an earlier
    # draft of this file): the claim was that a bare `…draft == false` evaluates
    # FALSE on a non-PR event and skips the job. Measured, it does not — an absent
    # property yields null, GitHub coerces null and false alike to 0, so
    # `null == false` is TRUE and the bare form RUNS. A throwaway push-triggered
    # workflow with both forms was dispatched to settle it: both jobs ran. That
    # was measured on a `push` event; a merge_group payload likewise carries no
    # `pull_request` key, so the same coercion applies there — an inference, and
    # this PR's own queue run is the confirming observation.
    #
    # No run in this repo could ever have falsified the claim, because every
    # workflow with a non-PR trigger already used the compound form. Keep the
    # compound form — it is correct under either reading and says what it means —
    # but do not repeat the mechanism as though it were the reason.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: macos-15  # matches ci.yml — Apple Silicon arm64 standard runner
    # macOS jobs are org-capped at ~5 concurrent; an unbounded default (360
    # min) can stall the whole org queue if this job hangs (#2099 CI review).
    # 25, not 45. Once `readme-snippets` is a required context the binding
    # constraint stops being this job's own runtime and becomes the queue's
    # `check_response_timeout_minutes` (60): the whole checks_requested →
    # conclusion window must fit inside it. At 45 that left ~15 min for the job to
    # even acquire a macOS runner — while this change simultaneously adds a second
    # macOS job per batch to an org-wide pool of ~5. Under a burst, a job that sits
    # pending >15 min and then runs perfectly normally would have its queue entry
    # ejected: a spurious failure indistinguishable from a flake. Measured runs
    # are 3-4 min, so 25 keeps ~7x headroom on the job and guarantees >=35 min of
    # queueing slack (~56 min typical). The old 45 was chosen when nothing waited
    # on the total, and justified with a "~14 min" figure that was already stale.
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          # Same pin as ci.yml — single source of toolchain truth.
          xcode-version: "26.3"

      - name: Cache SwiftPM dependencies
        # Each per-snippet throwaway package re-resolves the same dependency
        # set, so caching .build/checkouts + .build/repositories pays for
        # itself even though the snippet-package's own .build is ephemeral.
        # We key on Package.resolved exactly like ci.yml.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            .build/artifacts
            .build/checkouts
            .build/repositories
          key: ${{ runner.os }}-snippets-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-snippets-spm-

      - name: README structure pre-flight
        # Cheap tripwire — fails fast if the Hello World fence vanished.
        run: scripts/check-readme.sh

      - name: Compile README + QUICKSTART + DocC Swift snippets
        run: scripts/extract-snippets-test.sh
