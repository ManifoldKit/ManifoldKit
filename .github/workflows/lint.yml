name: Lint

# Consolidates previously-separate ubuntu-latest lint jobs into one
# sequenced runner. Each former job is now a step inside this workflow:
#
#   - actionlint                    (was actionlint.yml)
#   - changelog-lint                (was changelog-lint.yml)
#   - changelog-parser-check        (scripts/changelog-parser-check.sh —
#                                     #2380: re-runs release-please's own
#                                     commit parser and reds on any commit
#                                     it would silently drop; runs per-PR
#                                     (every PR, its own commits) and, on
#                                     the release-please branch, again over
#                                     the whole release range)
#   - commitlint                    (was commitlint.yml — Lint PR Title)
#   - known-issue-lint              (was known-issue-lint.yml)
#   - docs-header-lint              (scripts/lint-docs-headers.sh — cheap mirror
#                                     of DocsAudienceStatusAuditTest so a docs-only
#                                     PR, which skips ci.yml's paths-filtered macOS
#                                     `test` job, still gets the check on the PR run
#                                     instead of first failing in the merge queue)
#   - availability-audit            (scripts/audit-availability.sh — n-1 floor)
#   - secret-scan                   (was security-scans.yml: secret-scan)
#   - dependency-review             (was security-scans.yml: dependency-review)
#   - dep-budget                    (was ci.yml: dep-budget)
#   - release-context                (is this run validating a release? needs
#                                     BOTH that the change modifies version.txt
#                                     (checked first — purely local) and that
#                                     version.txt is valid SemVer and strictly
#                                     newer than the latest published tag.
#                                     Gates the two release-only
#                                     steps; pull_request + merge_group only)
#   - companion-canary-gate          (release-only, pull_request ONLY, with
#                                     --dispatch so the evidence is fresh —
#                                     needs COMPANION_DISPATCH_TOKEN. Blocks
#                                     because `lint` is a required check, so
#                                     the release PR cannot be queued until it
#                                     is green. Deliberately does NOT run on
#                                     merge_group — see the step comments)
#   - migration-index-gate           (release-only: scripts/migration-index-
#                                     check.sh --release — hard-blocks a
#                                     release if any migration-note row still
#                                     says "next")
#   - migration-index-completeness   (EVERY run: the required `lint` mirror of
#                                     MigrationIndexAuditTest, which is
#                                     markdown-driven and so would otherwise
#                                     first fire inside the merge queue on a
#                                     docs-only PR)
#
# Why one job: each separate ubuntu-latest job paid ~10s of runner cold-start
# overhead — ~50–70s aggregate per PR. Hoisting into a single runner removes
# that overhead. The trade-off is that we lose per-job badge color in the PR
# checks UI, but per-step status remains visible (each step has a name and an
# explicit pass/fail outcome). `if: always()` on every step after the first
# guarantees a failure in step N does not skip steps N+1..end.
#
# Issue #953 — Lever D.

on:
  pull_request:
    # Covers the union of triggers from the seven original workflows.
    # `edited` + `reopened` matter for commitlint (PR title revalidation);
    # `opened` + `synchronize` are the GitHub default for pull_request.
    types: [opened, edited, synchronize, reopened]
    branches: [main]
  push:
    branches: [main]
    paths:
      # On push to main, PR-only steps self-skip; the content checks that still
      # run are: actionlint, action-pin-audit, known-issue-lint, docs-header-lint,
      # availability-audit, readme-lint, secret-scan. This filter covers the
      # union of what each step checks so a push that can't affect any of them
      # (e.g. a Package.resolved Dependabot bump) doesn't spin up a runner.
      #
      #   actionlint          → .github/workflows/**
      #   action-pin-audit    → .github/workflows/**, .github/actions/**
      #   known-issue-lint    → Sources/**, Tests/**
      #   docs-header-lint    → docs/*.md, scripts/lint-docs-headers.sh
      #   doc-claims-lint     → *.md, docs/**, Sources/**/*.docc/**, scripts/lint-doc-claims.sh
      #   snippet-policy-lint → *.md, docs/**, Sources/**/*.docc/**, scripts/extract-snippets.sh, scripts/snippet-skip-baseline.tsv
      #   readme-lint         → README.md, version.txt, scripts/check-readme.sh
      #   availability-audit  → Sources/**, scripts/audit-availability.sh
      #   secret-scan         → Sources/**, Tests/**, .github/workflows/**
      #
      # Package.resolved, Package.swift, and unrelated scripts/ changes are
      # excluded: Dependabot PRs already run the full lint on the PR event.
      - "Sources/**"
      - "Tests/**"
      - "docs/*.md"
      # doc-claims-lint additionally reads root-level *.md, docs/
      # subdirectories, and DocC articles — a broken link in any of them
      # must trigger it, so its surface is listed rather than assumed.
      - "*.md"
      - "docs/**"
      - "Sources/**/*.docc/**"
      - ".github/workflows/**"
      - ".github/actions/**"
      - "README.md"
      - "version.txt"
      - "scripts/check-readme.sh"
      - "scripts/audit-availability.sh"
      - "scripts/lint-docs-headers.sh"
      - "scripts/lint-doc-claims.sh"
      - "scripts/extract-snippets.sh"
      - "scripts/snippet-skip-baseline.tsv"
  # Merge queue: `lint` is a required check, so it MUST report on the queue's
  # `merge_group` branch or the queue stalls. The content-check steps (actionlint,
  # pin-audit, known-issue, availability, readme) run; PR-only steps (commitlint,
  # changelog, dependency-review, dep-budget) self-skip on their `pull_request`
  # guard; secret-scan is gated off merge_group (no base/head to diff — it already
  # ran on the PR before queuing).
  merge_group:
    types: [checks_requested]

concurrency:
  # Mirror the per-event/per-ref pattern the originals used so a force-push
  # cancels in-flight runs of the same PR / branch.
  group: lint-${{ github.event_name }}-${{ github.ref }}
  # Don't cancel a merge_group lint run mid-flight (would stall the queue).
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

# Default to read-only. Steps that need more elevate via `permissions:` blocks
# at workflow scope below — kept tight to the minimum each tool requires.
permissions:
  contents: read
  pull-requests: read

jobs:
  lint:
    runs-on: ubuntu-latest
    # This job had no explicit timeout and so inherited GitHub's 360-minute
    # default — an unbounded default wastes a runner slot and delays detection
    # of a hang (#2099's CI review makes the same point about release-please.yml).
    # 60 is sized for the one genuinely slow step: companion-canary-gate's
    # `--dispatch` path polls each companion for up to 20 min (POLL_SECONDS=30 ×
    # POLL_MAX=40), so ~40 min worst case plus the ordinary lint steps. Every
    # other run of this job finishes in a couple of minutes. The dispatch step
    # carries its own tighter step-level timeout so a hang there is attributed
    # to that step rather than reading as "lint hung".
    timeout-minutes: 60
    steps:
      # Single checkout shared by every step. fetch-depth: 0 is required by:
      #   - trufflehog (diffs git history for secret leakage)
      #   - dep-budget (`git diff base...HEAD -- Package.resolved`)
      #   - large-file-guard (`git merge-base` against the PR base)
      #   - release-context (diffs the base ref against HEAD on pull_request,
      #     and merge_group's base_sha against head_sha, to decide whether the
      #     change modifies version.txt — a shallow checkout would leave those
      #     unresolvable and, because that step fails closed, red the job)
      # The cost is small on Ubuntu so we pay it unconditionally rather than
      # checking out twice. Do NOT re-fetch the base with `--depth=1` later —
      # a shallow tip of origin/<base> has no merge-base with a long-lived PR
      # branch and false-fails both dep-budget and large-file-guard.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # ── actionlint ────────────────────────────────────────────────────────
      # Previously bootstrapped via `bash <(curl ... download-actionlint.bash)
      # 1.7.7` — a mutable tag ref (`v1.7.7`) piped straight to bash. A
      # retargeted upstream tag is RCE in this job, and unlike a `uses:` step
      # this pipe-to-bash pattern is invisible to the action-pin-audit step
      # below (it only scans `uses:` lines). Replaced with a direct,
      # checksum-verified download of the release asset: the hash below was
      # computed locally from the downloaded tarball and cross-checked against
      # rhysd/actionlint's own published `actionlint_1.7.7_checksums.txt` for
      # this release (both matched).
      - name: Install actionlint
        id: install_actionlint
        run: |
          set -euo pipefail
          curl -sSfL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz"
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          echo "executable=$PWD/actionlint" >> "$GITHUB_OUTPUT"

      - name: actionlint — lint GitHub Actions workflows
        if: always()
        run: ${{ steps.install_actionlint.outputs.executable }} -color

      # ── action-pin-audit ──────────────────────────────────────────────────
      # Supply-chain guard: every third-party action must be pinned to a full
      # 40-hex commit SHA, not a mutable tag (`@v4`) or branch (`@main`). A tag
      # can be silently retargeted at a malicious commit; a SHA cannot. We let
      # Dependabot (`.github/dependabot.yml`, github-actions ecosystem) bump the
      # pins weekly so this stays sustainable. Local (`./…`) and reusable
      # in-repo workflow refs are exempt — they are not third-party.
      #
      # Scans both `.github/workflows/**` (regular workflows) and
      # `.github/actions/**` (composite actions) — a composite action's own
      # `uses:` steps are just as third-party as a workflow's (#2099: this
      # scope gap let `actions/cache@v5` slip through unpinned in
      # setup-swift-ci/action.yml).
      #
      # NOTE: the `push:` paths filter above includes both directories, so
      # this guard runs whenever a workflow or composite action changes
      # (gate-validates-itself rule).
      - name: action-pin-audit — require SHA-pinned third-party actions
        if: always()
        run: |
          set -euo pipefail
          # Match `uses: <ref>`, skipping local `./` refs. A pinned ref is
          # owner/repo[/path]@<40 hex chars>. Anything else (a `@vX` tag, a
          # branch, or a short SHA) is a finding.
          violations=$(grep -rEn '^\s*-?\s*uses:\s*[^.]' .github/workflows/ .github/actions/ \
            | grep -vE 'uses:\s*\./' \
            | grep -vE 'uses:\s*[^@]+@[0-9a-fA-F]{40}(\s|$|#)' \
            || true)
          if [ -n "$violations" ]; then
            echo "::error::Unpinned GitHub Actions found. Pin to a 40-char commit SHA (e.g. owner/action@<sha> # vX.Y.Z):"
            echo "$violations"
            exit 1
          fi
          echo "All third-party actions are SHA-pinned."

      # ── shim-drift ────────────────────────────────────────────────────────
      # Each required path-filtered check has a companion shim whose
      # `paths-ignore` must stay the exact inverse of the real workflow's
      # pull_request `paths:` (see each shim's header comment for why) — a
      # drift lets a PR either dodge the real suite (a missing entry in the
      # real workflow) or get wrongly blocked as untestable (a missing entry
      # in the shim). A 2026-07-10 CI review found `scripts/regenerate-mcp-
      # fixtures.sh` present in ci.yml's paths but absent from the shim's
      # paths-ignore; this step is the tripwire so that class of drift fails
      # CI instead of silently shipping. Pairs checked:
      #   - ci.yml ↔ ci-required-test-shim.yml (`test` / `api-digester-check`)
      #   - example-ui-build-check.yml ↔ example-ui-build-required-shim.yml
      #     (`build-for-testing`, #2377)
      - name: shim-drift — path-filtered required checks must equal their shims
        if: always()
        run: |
          # PyYAML ships preinstalled on ubuntu-latest's system python3, but
          # that is a runner-image detail, not a contract — install it if a
          # future image drops it rather than hard-failing the required lint.
          python3 -c 'import yaml' 2>/dev/null || python3 -m pip install --quiet PyYAML
          python3 <<'PYEOF'
          import sys
          import yaml

          # PyYAML parses the bare top-level `on:` key as the boolean True
          # (YAML 1.1's on/off/yes/no are booleans), not the string "on" — so
          # it must be looked up via wf.get('on', wf.get(True)) or a plain
          # wf['on'] KeyErrors on every run.
          def on_block(wf):
              return wf.get('on', wf.get(True))

          def check_pair(real_path, shim_path, real_label, shim_label):
              with open(real_path) as f:
                  real = yaml.safe_load(f)
              with open(shim_path) as f:
                  shim = yaml.safe_load(f)
              real_paths = sorted(on_block(real)['pull_request']['paths'])
              shim_ignore = sorted(on_block(shim)['pull_request']['paths-ignore'])
              if real_paths != shim_ignore:
                  real_only = sorted(set(real_paths) - set(shim_ignore))
                  shim_only = sorted(set(shim_ignore) - set(real_paths))
                  print(f"::error::{real_label}'s pull_request.paths and {shim_label}'s "
                        "pull_request.paths-ignore have drifted apart. They must stay identical "
                        "(see the shim's header comment for why: the shim reports a green "
                        "required context for PRs that don't touch a real-check-relevant path, "
                        "and a drifted list either lets a real change dodge the suite or wrongly "
                        "blocks a safe PR).")
                  if real_only:
                      print(f"  In {real_label}'s paths but missing from the shim's "
                            f"paths-ignore: {real_only}")
                  if shim_only:
                      print(f"  In the shim's paths-ignore but missing from {real_label}'s "
                            f"paths: {shim_only}")
                  return False
              print(f"OK: {len(real_paths)} entries match between {real_label}'s paths "
                    f"and {shim_label}'s paths-ignore.")
              return True

          ok = True
          ok &= check_pair(
              ".github/workflows/ci.yml",
              ".github/workflows/ci-required-test-shim.yml",
              "ci.yml",
              "ci-required-test-shim.yml",
          )
          ok &= check_pair(
              ".github/workflows/example-ui-build-check.yml",
              ".github/workflows/example-ui-build-required-shim.yml",
              "example-ui-build-check.yml",
              "example-ui-build-required-shim.yml",
          )
          sys.exit(0 if ok else 1)
          PYEOF

      # ── changelog-lint ────────────────────────────────────────────────────
      - name: changelog-lint — skip for non-Release-Please PRs
        if: always() && github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release-please--branches--')
        run: |
          echo "Non-Release-Please PR; changelog rewrite validation is not required."
          echo "Passing changelog-lint to provide the required check context."

      - name: changelog-lint — verify prose-style entries
        if: always() && github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please--branches--')
        # Logic extracted into scripts/changelog-lint.sh so the same check can be
        # run locally before force-pushing a rewritten release-please branch
        # (CI and the local gate share one source of truth). See that script for
        # the full rationale on the two bullet patterns and the prose-evidence
        # regex.
        run: bash scripts/changelog-lint.sh CHANGELOG.md

      # ── changelog-parser-check ────────────────────────────────────────────
      # #2380: release-please's commit parser (@conventional-commits/parser,
      # via release-please's own parseConventionalCommits) can hard-fail on
      # a squashed commit body — confirmed root cause: an identifier
      # immediately followed by NESTED parentheses, e.g. Swift code quoted
      # in a commit body like `exit(FuzzReport.exitCode(for: report))`. The
      # exception is caught internally and logged only at debug level, so
      # release-please silently drops the ENTIRE commit from the generated
      # changelog with no warning anywhere in normal output. PR #2375's
      # 223-line squashed body hit this exact pattern.
      #
      # This re-runs the SAME parser release-please uses over releasable
      # commits and reds on any commit release-please itself would drop —
      # the defect directly, not a proxy for it. It deliberately does NOT
      # compare against CHANGELOG.md's text at all (that's
      # scripts/changelog-coverage-check.sh's job — kept as the operator's
      # manual pre-rewrite check, see RELEASE.md step 2; it isn't wired into
      # CI because it can only mean anything against release-please's own
      # generated bullets, and CI can't reliably observe that state on this
      # branch — see the action_required paragraph below). Not looking at
      # the changelog at all means this check has no editorial-omission
      # false-positive surface and fires on ANY push by ANY actor.
      #
      # Two runs, two different ranges, both below:
      #   1. Per-PR (every PR, this PR's own commits since its merge-base) —
      #      preventive: rejects a parser-hostile commit body at the source,
      #      before it can ever reach a release. This is also what makes the
      #      check exercised continuously rather than only on a release PR —
      #      see the action_required paragraph for why "only tested when it
      #      matters" was rejected as a shape for this gate.
      #   2. Whole-range (release-please branch only, every releasable
      #      commit since the previous tag) — catches a commit that entered
      #      main some other way (a direct push, a squash whose body wasn't
      #      exactly any individual source commit's message) and gives the
      #      Prisma-rewrite operator one authoritative "is this release
      #      clean" answer.
      # Per-PR checks the PR's OWN (pre-squash) commit messages against the
      # parser — the right target, since that's genuinely what release-please
      # will see once GitHub assembles the squash body from them, but NOT a
      # guarantee about the exact final squashed text (a maintainer can still
      # edit the squash-merge box by hand at merge time).
      #
      # Firing on any actor (both ranges) is what makes this immune to a
      # real, verified gap: EVERY github-actions[bot]-triggered workflow run
      # on the release-please branch — across both the 0.73.0 and 0.74.0
      # cycles, all 6 workflows that trigger on it (Lint, CI, CI Required
      # Test Shim, CodeQL, README Snippets, cold-start-human), 94 runs total
      # — sits at `conclusion: action_required` and never actually executes;
      # only roryford-actor pushes ever complete (`gh api
      # repos/ManifoldKit/ManifoldKit/actions/runs?branch=
      # release-please--branches--main`). A check gated to fire only on a
      # bot regeneration (an earlier draft of this gate did exactly that)
      # would never run in practice under this repo's current Actions
      # settings — see AGENTS.md § Release workflow for the full writeup;
      # that finding outlives this PR and applies to `changelog-lint` too.
      - name: Set up Node.js (changelog-parser-check)
        if: always() && github.event_name == 'pull_request'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Pinned to a major, not 'lts/*' — the setup-node action is
          # SHA-pinned but a floating alias here would let a future Node LTS
          # that breaks release-please red unrelated PRs on this required
          # check with no warning. 24 is current LTS as of this pin; bump
          # deliberately alongside a verification run, not silently.
          node-version: '24'

      - name: changelog-parser-check (per-PR) — this PR's own commits parse cleanly
        if: always() && github.event_name == 'pull_request'
        # scripts/changelog-parser-check.sh installs the pinned release-please
        # dependency and runs check.mjs against an explicit range; `npm ci`
        # failing is a hard failure here, never a silent skip — see that
        # script's header comment. Base-ref handling mirrors dep-budget /
        # large-file-guard just above: fetch the base tip (fetch-depth: 0
        # from Checkout already has most of it; this refreshes it, never
        # `--depth=1` — #2325), then diff against the true merge-base so a
        # long-lived branch isn't penalized for commits landing on the base
        # after it diverged.
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${{ github.base_ref }}"
          base_sha="$(git merge-base "origin/${{ github.base_ref }}" HEAD)"
          # --per-pr: zero releasable commits in THIS PR's own range is
          # normal (a release-please PR is one hidden `chore(main): release`
          # commit, a Dependabot PR is `chore(deps): bump …`, a WIP branch
          # can be all non-conventional commits) -- see check.mjs's own
          # header comment for the full reasoning. Without this flag the
          # whole-range run below still fails closed on zero matches.
          bash scripts/changelog-parser-check.sh --per-pr "$base_sha" HEAD

      - name: changelog-parser-check — skip whole-range run for non-Release-Please PRs
        if: always() && github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release-please--branches--')
        run: |
          echo "Non-Release-Please PR; the whole-release-range changelog parser validation is not required (the per-PR run above already covers this PR's own commits)."
          echo "Passing changelog-parser-check to provide the required check context."

      - name: changelog-parser-check (whole-range) — every releasable commit since the last tag parses
        if: always() && github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please--branches--')
        run: bash scripts/changelog-parser-check.sh

      # ── commitlint (PR title) ─────────────────────────────────────────────
      - name: commitlint — validate PR title
        if: always() && github.event_name == 'pull_request'
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            dx
            test
            refactor
            perf
            ci
            build
            revert
          requireScope: false

      # ── pr-title-quote-guard ──────────────────────────────────────────────
      # release-please's conventional-commit parser silently DROPS the
      # changelog entry for any commit whose subject contains a literal double
      # quote — the squash-merge subject is the PR title, so a title with `"`
      # yields a released version with a missing bullet and no error anywhere.
      # amannn/action-semantic-pull-request above validates the type/scope
      # shape but not this; add an explicit reject here.
      #
      # The title is routed through env: (never interpolated as `${{ }}`
      # directly into the run script) so a title containing shell metacharacters
      # or quotes cannot break out of the string and inject commands (#2099).
      - name: pr-title-quote-guard — reject embedded double quotes in PR title
        if: always() && github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          case "$PR_TITLE" in
            *'"'*)
              echo "::error::PR title contains a literal double-quote (\") character."
              echo "::error::release-please's conventional-commit parser silently DROPS the"
              echo "::error::changelog entry for a commit subject containing a double quote, so"
              echo "::error::the released version would ship with this change missing from"
              echo "::error::CHANGELOG.md and no error anywhere. Use single quotes instead."
              echo "::error::Title was: $PR_TITLE"
              exit 1
              ;;
          esac
          echo "✓ PR title contains no embedded double quotes."

      # ── known-issue-lint ──────────────────────────────────────────────────
      - name: known-issue-lint — verify withKnownIssue has FIXME link
        if: always()
        run: |
          set -euo pipefail

          # Search Swift sources for `withKnownIssue(` and capture file:line
          # for each occurrence. `-n` keeps line numbers; `-H` keeps filenames
          # even when only one file matches; `--include` keeps the search
          # tight on Swift sources only.
          mapfile -t hits < <(grep -RHn --include='*.swift' \
            -E '\bwithKnownIssue\(' Tests Sources 2>/dev/null || true)

          if [ ${#hits[@]} -eq 0 ]; then
            echo "✓ No withKnownIssue usages found."
            exit 0
          fi

          echo "Found ${#hits[@]} withKnownIssue usage(s); verifying each has a // FIXME link above…"
          echo ""

          violations=0
          for hit in "${hits[@]}"; do
            file="${hit%%:*}"
            rest="${hit#*:}"
            line_no="${rest%%:*}"

            # Walk upward past blank/whitespace-only lines and find the first
            # non-blank line. That line must be a `// FIXME:` comment.
            prev=$((line_no - 1))
            while [ "$prev" -gt 0 ]; do
              prev_content=$(sed -n "${prev}p" "$file")
              if [[ -n "$(echo "$prev_content" | tr -d '[:space:]')" ]]; then
                break
              fi
              prev=$((prev - 1))
            done

            if [ "$prev" -le 0 ]; then
              prev_content=""
            fi

            if echo "$prev_content" | grep -qE '^\s*//\s*FIXME:.*(https?://|#[0-9]+)'; then
              # Compliant: FIXME comment with either a URL or a #NNN issue ref.
              continue
            fi

            violations=$((violations + 1))
            echo "::error file=$file,line=$line_no::withKnownIssue at $file:$line_no lacks a '// FIXME: <issue URL or #N>' comment on the line above."
            echo "  Found above: ${prev_content:-<top of file>}"
            echo ""
          done

          if [ "$violations" -gt 0 ]; then
            echo ""
            echo "::error::$violations withKnownIssue usage(s) violate the policy in CLAUDE.md."
            echo "::error::Add a '// FIXME: <issue URL>' comment on the line directly above each usage,"
            echo "::error::or remove the withKnownIssue wrapper if the underlying bug is fixed."
            exit 1
          fi

          echo "✓ All ${#hits[@]} withKnownIssue usage(s) have a tracking // FIXME link."

      # ── docs-header-lint ──────────────────────────────────────────────────
      # ci.yml's macOS `test` job (which runs the authoritative
      # DocsAudienceStatusAuditTest) is paths-filtered and excludes docs/**, so
      # a docs-only PR skips it — the CI Required Test Shim reports green in
      # its place. The merge queue's `merge_group` trigger has no paths filter
      # and forces a full run, so a docs-only PR missing headers only fails
      # for the first time in the queue, where it also poisons up to 4 other
      # batched PRs (2026-07: PR #2306 failed the queue twice and took #2212
      # down with it 6 times). Lint runs on every PR unconditionally, so this
      # step catches the same problem on the cheap ubuntu-latest PR run,
      # before the queue.
      - name: "docs-header-lint — verify Audience:/Status: headers"
        if: always()
        run: bash scripts/lint-docs-headers.sh

      # ── doc-claims-lint ───────────────────────────────────────────────────
      # Same rationale as docs-header-lint immediately above, for the
      # markdown-only half of Tests/ManifoldCoreTests/DocClaimsAuditTest.swift:
      # broken relative .md links, dead #anchors, and orphaned docs are all
      # breakable by a docs-only diff, which never runs the macOS `test` job on
      # the PR head — so without this the first failure lands in the merge
      # queue and poisons the batch (#2306 / #2212, 2026-07).
      #
      # The symbol-existence check is deliberately NOT mirrored: it can only be
      # broken by a *source* change, and a source change always triggers
      # ci.yml where the authoritative Swift audit runs. See the script header.
      - name: "doc-claims-lint — verify doc links, anchors, index coverage"
        if: always()
        run: bash scripts/lint-doc-claims.sh

      # ── snippet-policy-lint ───────────────────────────────────────────────
      # extract-snippets.sh enforces three policies that need no compiler:
      # the `no-build:<reason>` requirement, the per-doc ">=1 compiled block"
      # assertion, and the skip-count ratchet. Extraction is pure awk/sed text
      # work — no Swift, no macOS — so it can run here.
      #
      # It has to run here, because its only other host is `readme-snippets`,
      # which is NOT a required check: a red there does not stop
      # `gh pr merge --auto`. Enforcing policy solely from an advisory workflow
      # is the red-but-not-blocking shape that let the api-digester reds through
      # (#2274, #2287) — so the text-only half is promoted to required `lint`
      # and only the actual snippet COMPILE stays in readme-snippets.
      #
      # No duplication: this runs the same script, not a mirror of it.
      - name: "snippet-policy-lint — no-build reasons, per-doc coverage, skip ratchet"
        if: always()
        run: bash scripts/extract-snippets.sh --out "${RUNNER_TEMP:-/tmp}/snippet-policy-lint"

      # ── availability-audit ────────────────────────────────────────────────
      # Flags @available / #available annotations that exceed the Package.swift
      # platform floors (macOS 15 / iOS 18). Enforces the n-1 platform policy
      # as compiler-truth: any annotation gating on macOS 16+ or iOS 19+
      # outside the ManifoldFoundation* targets is a violation.
      # See scripts/audit-availability.sh for the full exemption logic.
      - name: availability-audit — verify n-1 platform floor annotations
        if: always()
        run: bash scripts/audit-availability.sh

      # ── readme-lint ───────────────────────────────────────────────────────
      # Tripwire for stale README API references. Ensures the install pin
      # matches version.txt and that no deleted public API names re-appear in
      # the README. See scripts/check-readme.sh for the full rationale.
      #
      # The script's path is in this workflow's trigger so an edit to the
      # script revalidates against the current README. README edits also
      # re-run this job because the workflow has no `paths:` filter; running
      # on every PR keeps the cost negligible (a single grep pass).
      - name: readme-lint — verify README install pin and API references
        if: always()
        run: scripts/check-readme.sh

      # ── secret-scan (trufflehog) ──────────────────────────────────────────
      - name: secret-scan — scan changed commits for leaked secrets
        # Gated off merge_group: trufflehog has no PR base/head to diff on the
        # queue branch. Each PR is already secret-scanned on its pull_request run
        # before being queued, so re-scanning the batch adds no coverage.
        if: always() && github.event_name != 'merge_group'
        uses: trufflesecurity/trufflehog@bcfcf73aaf4759d4dadc2783177c245a02792318 # v3.97.0
        with:
          # The composite action pulls `ghcr.io/trufflesecurity/trufflehog:${version}`.
          # Tag `v3.95.2` is missing from GHCR (manifest unknown), so the explicit
          # `version:` input is intentionally omitted — the action's default tag
          # resolves to a published image. Action SHA pin above keeps the
          # composite definition itself fixed for supply-chain safety.
          # Keep signal high by failing only on verifiable active secrets.
          extra_args: --results=verified

      # ── dependency-review ─────────────────────────────────────────────────
      - name: dependency-review — fail on newly introduced vulnerable deps
        # Dependency Review compares base/head and is most useful on PRs.
        if: always() && github.event_name == 'pull_request'
        # Fail-closed: a newly introduced vulnerable dependency now blocks merge.
        # REQUIRES the repo Dependency graph to be enabled (Settings > Advanced
        # Security > Dependency graph). Without it the action exits non-zero and
        # this step hard-fails — that is intentional supply-chain pressure, not
        # a misconfiguration to paper over with continue-on-error.
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          vulnerability-check: true
          license-check: false

      # ── dep-budget ────────────────────────────────────────────────────────
      # Guards against silent dependency-graph explosions like the one that
      # prompted the ManifoldServer trait-gating work (Package.resolved went
      # 20 → 38 pins in a single PR). Adds friction proportional to dep weight:
      # 1–2 pins is fine, anything more requires the `deps-ok` label as a
      # deliberate sign-off captured in the PR's history.
      - name: dep-budget — check Package.resolved pin delta
        if: always() && github.event_name == 'pull_request'
        # PR_LABELS is routed through env: rather than interpolated inline as
        # `${{ toJSON(...) }}` — GitHub Actions substitutes the expression into
        # the run script's source *before* the shell ever parses it, so a label
        # name containing a single quote would break out of the quoted string
        # and inject shell commands (#2099). env: values are passed as
        # ordinary process environment strings instead, immune to this class
        # of template injection. Creating/applying labels requires
        # triage/write access, capping the blast radius, but the fix is free.
        env:
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail
          # Full (non-shallow) fetch of the base. Under fetch-depth: 0,
          # origin/<base> is usually already present from checkout's all-history
          # refspec — this refreshes the tip. Never pass `--depth=1`: a shallow
          # re-fetch replaces that tip with an orphan commit and breaks
          # `git diff A...B` / merge-base on long-lived PRs (#2325).
          git fetch --no-tags origin "${{ github.base_ref }}"
          new=$(git diff "origin/${{ github.base_ref }}...HEAD" -- Package.resolved | grep -c '^+.*"identity"' || true)
          echo "PR adds $new new package pin(s)."
          if [ "$new" -gt 2 ]; then
            # jq index() does an exact-element match against the JSON array —
            # unlike the previous `grep -q 'deps-ok'` substring match, a label
            # like `pre-deps-okay` cannot false-positive here.
            if printf '%s' "$PR_LABELS" | jq -e 'index("deps-ok") != null' >/dev/null; then
              echo "::notice::PR adds $new new pins; 'deps-ok' label present, allowing."
              exit 0
            fi
            echo "::error::PR adds $new new package pins (limit: 2). Either reduce the dep additions or add the 'deps-ok' label to the PR with a justification in the description."
            exit 1
          fi

      # ── large-file-guard ─────────────────────────────────────────────────
      # A stray large file (an accidental `git add -A` of a run-artifact tree,
      # a vendored binary, a debug dump) is cheap to add and expensive to
      # remove — history rewrite is the only real fix once it's merged. This
      # guard fails a PR that ADDS any file over 1MB, computed against the
      # true merge-base diff so renames/moves of pre-existing large files
      # don't false-positive. Written for POSIX sh / Bash 3.2 (no
      # `declare -A`) since this repo's CI runs on macOS runners, which
      # ship Bash 3.2 — verified locally with `bash --posix`.
      - name: large-file-guard — reject newly added files over 1MB
        if: always() && github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          # Full (non-shallow) fetch of the base — see dep-budget comment.
          git fetch --no-tags origin "${{ github.base_ref }}"
          bash scripts/large-file-guard.sh "origin/${{ github.base_ref }}" "HEAD"

      # ── release-context ───────────────────────────────────────────────────
      # Detects whether THIS run is validating an in-flight release: version.txt
      # bumped to a valid SemVer version strictly newer than the latest
      # published GitHub release tag. The two
      # release-only gates below (companion-canary-gate, migration-index-gate)
      # key off this step's `is_release` output.
      #
      # WHY THIS RUNS IN `lint`, NOT A DEDICATED RELEASE WORKFLOW: empirically,
      # the release-please branch (release-please--branches--main) is CI-dark.
      # Zero push-event workflow runs have ever fired on it (nothing in this
      # repo triggers on `push` to that branch), and github-actions[bot]-actor
      # `pull_request` runs on it sit at conclusion `action_required` and never
      # execute. Measured 2026-08-09 over the 500 most recent runs on that
      # branch (2026-07-12 -> 2026-08-09): 450 bot-actor runs `action_required`,
      # only 5 bot-actor runs ever completed, and all 45 completed runs were
      # roryford-actor — i.e. the manual changelog-rewrite force-push is the
      # only thing that has ever made CI run there. (Reproduce with `gh api
      # 'repos/ManifoldKit/ManifoldKit/actions/runs?branch=release-please--branches--main&per_page=100&page=N'`.
      # The narrower 94-run figure quoted in the changelog-parser-check comment
      # above and in AGENTS.md is an earlier, differently-scoped count over the
      # 0.73.0/0.74.0 cycles — both stand.) `merge_group`, by
      # contrast, always runs to completion, and `lint` is one of only three
      # required status contexts on `main` (test, lint, api-digester-check) —
      # so a step added to THIS job, gated on `pull_request`/`merge_group`, is
      # the only placement that both (a) actually executes on the release PR
      # and (b) blocks the merge, with no new required-context registration
      # needed. Registering a brand-new required context is a known trap here:
      # `readme-snippets` has sat un-required for exactly that reason. See
      # AGENTS.md § "Release workflow" for the full writeup this paragraph
      # summarizes — that section is authoritative if the two ever disagree.
      #
      # FAIL CLOSED: a lookup failure (API error, empty tag, missing/empty
      # version.txt) fails the job outright. A release gate that silently
      # resolves to "not a release" when its own precondition check fails
      # would defeat the entire point of gating a release.
      - name: "release-context — detect whether version.txt is strict-SemVer newer than the latest published tag"
        id: release_context
        if: always() && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Passed via env rather than interpolated into the script: a branch
          # name is attacker-controllable on a fork PR and inlining it is a
          # script-injection vector (actionlint flags the inline form).
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail

          if [ ! -s version.txt ]; then
            echo "::error::version.txt is missing or empty — cannot determine release context."
            exit 1
          fi
          current_version="$(tr -d '[:space:]' < version.txt)"
          if [ -z "$current_version" ]; then
            echo "::error::version.txt is empty after trimming whitespace."
            exit 1
          fi

          # CONDITION 2 IS EVALUATED FIRST, AND DELIBERATELY SO. It is purely
          # local (a git diff), whereas condition 1 needs an external API call.
          # Ordering them the other way put an unretried network call on the
          # critical path of `lint` — one of three required contexts — for
          # EVERY pull_request and merge_group run in the repo, so a transient
          # 5xx would red a PR that has nothing to do with a release. Checking
          # locally first confines the external dependency to the handful of
          # runs that actually touch version.txt. Do not reorder these.
          #
          # Why condition 2 exists at all — do not "simplify" it away. A bare
          # version-vs-tag comparison has a false-positive window: once the
          # release PR merges, `main` carries the bumped version.txt for the
          # minutes before release-please creates the tag (longer if that job
          # queues or fails). During that window an unrelated PR would
          # evaluate as a release and fire both gates — and migration-index
          # would red on `next` rows that are entirely legitimate on main
          # right after a release. A required check going spuriously red on an
          # unrelated change is precisely the failure this whole gate exists
          # to remove. Only the release PR modifies version.txt.
          case "${{ github.event_name }}" in
            pull_request)
              if ! git fetch --no-tags -q origin "${{ github.base_ref }}"; then
                echo "::error::Could not fetch origin/${{ github.base_ref }} to determine whether version.txt changed."
                exit 1
              fi
              diff_range="origin/${{ github.base_ref }}...HEAD"
              ;;
            merge_group)
              diff_range="${{ github.event.merge_group.base_sha }} ${{ github.event.merge_group.head_sha }}"
              ;;
            *)
              echo "::error::release-context ran on an unexpected event (${{ github.event_name }})."
              exit 1
              ;;
          esac

          # shellcheck disable=SC2086  # diff_range is deliberately two args on merge_group
          if ! changed_files="$(git diff --name-only $diff_range)"; then
            echo "::error::Could not diff $diff_range to determine whether version.txt changed."
            exit 1
          fi
          # An empty diff means the refs above did not resolve to what we think
          # they did — never a legitimate state for a change under validation.
          # Fail rather than guess in either direction: defaulting to
          # "not a release" would silently disable the gates, defaulting to
          # "is a release" would red unrelated PRs.
          if [ -z "$changed_files" ]; then
            echo "::error::Diff of $diff_range listed zero changed files — refusing to guess release context."
            exit 1
          fi

          version_touched=false
          if printf '%s\n' "$changed_files" | grep -qx 'version.txt'; then
            version_touched=true
          fi
          echo "version.txt:           $current_version"
          echo "version.txt modified:  $version_touched  (range: $diff_range)"

          # On the release PR itself we KNOW a release is in flight regardless
          # of what any API says. Recording that up front lets us treat a
          # "not a release" verdict there as a defect rather than a quiet skip
          # — see the assertion at the end.
          on_release_branch=false
          if [ "${{ github.event_name }}" = "pull_request" ] \
             && [ "${HEAD_REF#release-please--}" != "$HEAD_REF" ]; then
            on_release_branch=true
          fi

          # Condition 1, only now that condition 2 has already passed. If
          # version.txt is untouched this run cannot be a release, so there is
          # nothing the API could tell us and no reason to depend on it.
          if [ "$version_touched" = false ]; then
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            echo "→ Not a release: this change does not modify version.txt (no API call made)."
            if [ "$on_release_branch" = true ]; then
              echo "::error::On $HEAD_REF but version.txt is not modified — the release PR must bump it. Refusing to skip the release gates here."
              exit 1
            fi
            exit 0
          fi

          if ! latest_tag="$(gh api "repos/${{ github.repository }}/releases/latest" --jq .tag_name)"; then
            echo "::error::Failed to query the latest published release via the GitHub API (repos/${{ github.repository }}/releases/latest)."
            exit 1
          fi
          if [ -z "$latest_tag" ] || [ "$latest_tag" = "null" ]; then
            echo "::error::Latest-release API call returned an empty/null tag_name — cannot determine release context."
            exit 1
          fi
          latest_version="${latest_tag#v}"
          echo "latest published tag:  $latest_tag (version $latest_version)"

          # `!=` is not a release comparison: with latest v0.76.1, an old
          # branch carrying 0.76.0 is unequal yet must NOT trigger a release
          # gate. The helper validates both values as strict SemVer and applies
          # SemVer precedence (including prereleases); malformed input fails
          # closed instead of becoming a false "not a release" result.
          if ! comparison="$(bash scripts/release-context-check.sh --is-strictly-greater "$current_version" "$latest_version")"; then
            echo "::error::Could not compare version.txt ($current_version) with latest published tag ($latest_tag) as strict SemVer."
            exit 1
          fi
          if [ "$comparison" = "true" ]; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
            echo "→ Release in flight: version.txt ($current_version) is strict-SemVer newer than the latest published tag ($latest_version), and this change modifies it."
            exit 0
          fi
          if [ "$comparison" != "false" ]; then
            echo "::error::release-context comparator returned an unexpected result ($comparison); refusing to skip release gates."
            exit 1
          fi

          # version.txt is touched but is equal to or older than the latest
          # published tag. On an ordinary PR that is a legitimate no-op or a
          # stale branch. On the release PR it means condition 1 — which
          # depends on a mutable external API — has told us something that
          # cannot be true, and silently skipping the gates is exactly the
          # outcome this change exists to prevent.
          echo "is_release=false" >> "$GITHUB_OUTPUT"
          echo "→ Not a release: version.txt is not newer than the latest published tag."
          if [ "$on_release_branch" = true ]; then
            echo "::error::On $HEAD_REF the release gates must run, but version.txt ($current_version) is not newer than the latest published tag ($latest_tag). Refusing to skip them silently — check whether a release was published out of band."
            exit 1
          fi

      # ── companion-canary-gate ─────────────────────────────────────────────
      # Also fires on merge_group even for a real release: the canary gate runs
      # only on pull_request by design (see the long comment below the dispatch
      # step), so the queue run should say so rather than leaving a silent hole
      # where a reader might expect a check.
      - name: companion-canary-gate — skip (not a release, or not the pull_request run)
        if: always() && (github.event_name != 'pull_request' || steps.release_context.outputs.is_release == 'false')
        run: |
          if [ "${{ github.event_name }}" = "merge_group" ] && [ "${{ steps.release_context.outputs.is_release }}" = "true" ]; then
            echo "Release detected, but the companion-canary gate runs only on the pull_request event."
            echo "It already blocked there: \`lint\` is a required check, so this PR could not have been"
            echo "queued without that run passing. Re-checking here would grade a fresh canary against a"
            echo "main tip that moves with every unrelated merge, which reds the batch for reasons that"
            echo "have nothing to do with the release."
          else
            echo "Not a release in this run (or release-context does not apply to this event)."
            echo "The companion-canary gate does not apply here — no dispatch or check was performed."
          fi

      # WHY THIS STEP IS SPLIT BY EVENT (pull_request vs. merge_group), not run
      # once in read-only mode. companion-canary-check.sh's PRIMARY check is
      # LANDING-RELATIVE: a canary run that started before the current
      # `origin/main` tip actually merged is STALE regardless of wall-clock
      # age (see the script's own FRESHNESS comment block). Each companion's
      # `Canary (core main)` workflow runs nightly plus on `core-release` and
      # on demand — at release time `main` has almost always received merges
      # since the last nightly, so a pure read-only check would read STALE on
      # nearly every release, not on real breakage. A gate that is red every
      # time gets routed around — the exact failure this whole change exists
      # to prevent (AGENTS.md § "Release workflow"). So: dispatch fresh runs
      # on the one bot-independent PR-event moment (Rory's changelog-rewrite
      # force-push — the only `pull_request` run on the release-please branch
      # that actually executes; see the `release-context` step above). There
      # is deliberately no merge_group canary step — see the long comment
      # below the dispatch step. The PR-event dispatch is the blocking one
      # (`lint` is required); a queue-side re-read grades a moving main tip
      # and ejects the batch.
      #
      # TIP-COMMIT DERIVATION UNDER merge_group (applies to both steps below):
      # the script never reads the runner's checked-out HEAD (which, under
      # merge_group, is the queue's candidate commit — not yet on main and not
      # associated with any merged PR). It explicitly `git fetch`es `origin
      # main` and diffs against the resulting `origin/main` ref, falling back
      # to the local HEAD only if that fetch or ref resolution fails. Under
      # this job's `actions/checkout` (fetch-depth: 0, default `origin`
      # remote), that fetch resolves to the TRUE main tip in both
      # pull_request and merge_group runs — so no explicit ref needs to be
      # passed here.
      #
      # `--dispatch` needs COMPANION_DISPATCH_TOKEN — a fine-grained PAT with
      # contents read+write on manifold-mlx / manifold-llama, the same secret
      # release-please.yml's `notify-companions` job uses (see its header
      # comment: "the default `secrets.GITHUB_TOKEN` is scoped to THIS
      # repository and cannot fire [cross-repo requests]" — that constraint
      # applies identically to `gh workflow run` here). FAIL, don't silently
      # fall back to read-only, if the secret is unset: a downgrade that then
      # reads a stale-but-green result is worse than an explicit failure.
      - name: "companion-canary-gate (pull_request) — dispatch fresh companion canary runs and wait"
        if: always() && github.event_name == 'pull_request' && steps.release_context.outputs.is_release == 'true'
        # Bounds the one step that can legitimately run for tens of minutes, so
        # a hang here is attributed to the dispatch wait rather than to `lint`
        # as a whole. 45 = the script's own ~40-min worst-case poll ceiling
        # (2 companions x 20 min) plus headroom for the freshness re-check.
        timeout-minutes: 45
        env:
          GH_TOKEN: ${{ secrets.COMPANION_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::COMPANION_DISPATCH_TOKEN secret is not set — cannot dispatch fresh companion canary runs."
            echo "::error::Without a fresh dispatch here this gate has no fresh evidence to grade, and a"
            echo "::error::downgrade to reading the last nightly would pass on a tree it never tested."
            echo "::error::Create/restore the fine-grained PAT documented in release-please.yml's"
            echo "::error::notify-companions job — and note it needs Actions: read+write on manifold-mlx"
            echo "::error::and manifold-llama for \`gh workflow run\`, which is a DIFFERENT scope from the"
            echo "::error::contents scope repository_dispatch uses."
            exit 1
          fi

          # PRE-FLIGHT: this token is handed to the whole script run, not just
          # the dispatch calls, and the script also reads THIS repo to resolve
          # the tip commit's true merge time (`/commits/{sha}/pulls`). That read
          # is deliberately tolerant — it falls back to a +60-minute margin when
          # the API is unavailable — which is right for a transient failure but
          # wrong for a systematic one: a PAT scoped only to the companion repos
          # would fail that read on EVERY run, silently swapping the exact
          # landing-relative check for the coarse estimate precisely when the
          # gate is being relied on. Prove the token can read this repo first,
          # so that degradation can never happen quietly.
          # Use the PR head SHA, not github.sha. On pull_request github.sha is
          # the merge-ref commit, and GET /commits/{merge-sha}/pulls can 422
          # "No commit found for SHA" — which would red every release even
          # after the PAT is scoped correctly.
          if ! gh api "repos/${{ github.repository }}/commits/${{ github.event.pull_request.head.sha }}/pulls" --jq 'length' >/dev/null 2>&1; then
            echo "::error::COMPANION_DISPATCH_TOKEN cannot read repos/${{ github.repository }}. The canary"
            echo "::error::script needs that read to resolve when the main tip actually merged; without it"
            echo "::error::it silently falls back to a +60min margin and can grade a stale canary as fresh."
            echo "::error::Grant the PAT contents:read on THIS repository as well as Actions:read+write"
            echo "::error::(and contents:read+write) on manifold-mlx / manifold-llama."
            exit 1
          fi

          bash scripts/companion-canary-check.sh --dispatch

      # THERE IS DELIBERATELY NO merge_group COMPANION-CANARY STEP. An earlier
      # revision ran a read-only check here on the theory that merge_group is
      # "the run that actually blocks". Review showed that gate cannot work,
      # and would have re-created the exact pathology this whole change exists
      # to remove:
      #
      # companion-canary-check.sh grades freshness LANDING-RELATIVE against
      # origin/main's tip at the moment it runs. In a merge_group run that tip
      # is main WITHOUT the release PR — a value that changes every time
      # anything else merges. So: force-push at 09:45 dispatches fresh canaries
      # at ~09:50; an unrelated batch merges at 10:25; the release batch
      # validates at 10:30; the 09:50 canary now predates the 10:25 tip and
      # reads STALE; `lint` reds and the batch is ejected. The documented
      # remedy (re-dispatch, re-push) restarts the identical race. Main's
      # median inter-commit gap is ~95 min with 44% of gaps under 60 min, so
      # this is a routine outcome, not a corner case — and a hard-blocking gate
      # that reds on unrelated merges is precisely the "red every time, so it
      # gets routed around" failure warned about above.
      #
      # The pull_request dispatch step above is already blocking on its own:
      # `lint` is a required status check (branch protection on `main` lists
      # test / lint / api-digester-check, strict), so the release PR cannot be
      # queued until that run is green, and --dispatch makes its evidence
      # genuinely fresh at that moment.
      #
      # BE PRECISE ABOUT WHAT THIS TRADE COSTS — an earlier version of this
      # comment claimed the queue re-check "adds no signal" and that the
      # residual gap "is the same exposure every other pre-merge check
      # carries". Both were false, and both are the kind of claim a later
      # reader acts on:
      #   * It DID add signal — coverage of main moving between the PR-event
      #     check and the merge. The honest reason to drop it is that its
      #     false-positive rate swamps that signal, not that the signal is
      #     zero.
      #   * The exposure is NOT the same as other checks'. Every other required
      #     check validates the PR's own content, and the queue re-validates it
      #     against the true merged tree. This gate's subject is external repos
      #     versus main — a target that moves independently of the PR — so
      #     after this change it is the only release-relevant gate with no
      #     merged-tree validation at all.
      # The residual window is the incident class this gate exists for: on
      # 2026-07-19 the last green canary ran 06:42Z and the seam-moving commit
      # merged 06:58Z. A commit like that landing between the PR-event dispatch
      # and the merge still ships a broken release. The window is narrowed from
      # ~24h (nightly cadence) to the PR-check-to-merge gap. It is not closed,
      # and this is a deliberate trade, not an oversight.

      # ── migration-index-gate ──────────────────────────────────────────────
      - name: migration-index-gate — skip (not a release)
        if: always() && steps.release_context.outputs.is_release != 'true'
        run: |
          echo "Not a release in this run (or release-context does not apply to this event)."
          echo "The migration-index --release gate does not apply here — no check was performed."

      # Release-only, hard-blocking: fails if any docs/MIGRATION-INDEX.md row
      # still says "next" in the Release column while a version is shipping —
      # RELEASE.md's changelog-rewrite step is supposed to flip these by hand;
      # this is what stops a forgotten row from shipping silently.
      #
      # Runs on pull_request AND merge_group. Unlike the canary, leftover
      # `next` rows in the tree about to be tagged are true positives: a note
      # that landed on main after the rewrite, or rode in the same queue
      # batch, ships in this version. The canary's STALE-vs-moving-tip
      # argument does not transfer. Do not restrict this back to
      # pull_request for symmetry with the canary.
      - name: migration-index-gate — no migration-note row may still say "next"
        if: always() && (github.event_name == 'pull_request' || github.event_name == 'merge_group') && steps.release_context.outputs.is_release == 'true'
        run: bash scripts/migration-index-check.sh --release

      # ── migration-index-completeness (EVERY run, not release-only) ────────
      # The cheap mirror of MigrationIndexAuditTest, and it is not optional.
      # AGENTS.md § "Documentation gates": "A new markdown-driven audit ships
      # with a `lint` mirror, or it does not block on the PRs that can break
      # it." That audit reads docs/MIGRATION-INDEX.md and enumerates
      # docs/MIGRATION-*.md, so a PR adding a migration note with no index row
      # is exactly what breaks it — and such a PR is typically docs-only.
      # ci.yml's pull_request paths carry no docs/** entry, so the required
      # `test` job is satisfied by ci-required-test-shim.yml in seconds, and
      # scripts/affected-suites.sh resolves a docs-only diff to NONE. The
      # audit would therefore first execute in the merge queue and poison the
      # batch — the #2306 shape that took #2212 down six times.
      #
      # lint.yml's pull_request trigger has no paths filter and its push paths
      # already include docs/** and *.md, so this step runs on every PR that
      # can break the audit. No `--release`: the "next"-row rule is release-only
      # (a note legitimately sits at `next` from the PR that adds it until the
      # release ships it), and running it here would red every such PR.
      - name: "migration-index-completeness — every docs/MIGRATION-*.md has an index row"
        if: always()
        run: bash scripts/migration-index-check.sh
