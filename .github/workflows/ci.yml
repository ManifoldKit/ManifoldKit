name: CI

on:
  push:
    branches: [main]
    paths:
      - "Sources/**"
      - "Tests/**"
      - "Package.swift"
      - "Package.resolved"
      - ".github/workflows/ci.yml"
      - "scripts/test.sh"
      - "scripts/ci-test-with-watchdog.sh"
      - "scripts/example-ui-tests.sh"
      - "scripts/cold-start*.sh"
      - "scripts/check-foundation-only-bundle.sh"
      - "scripts/test-ios-simulator.sh"
      - "scripts/lint-no-new-force-unwraps.sh"
      # Tier 0 selective-testing gate (issue #1588). Listed so edits to the
      # resolver or its committed graph snapshot re-trigger CI and the dry-run
      # logging — otherwise a change to the gate would bypass the gate.
      - "scripts/affected-suites.sh"
      - "scripts/affected-suites-graph.json"
      # Tier 2 selective CI (issue #1590). Listed so edits to the selective
      # runner or the xcscheme files re-trigger CI — otherwise a change to
      # the gate would bypass it (per CI path-filter self-validation rule).
      - "scripts/ci-selective-test.sh"
      - ".swiftpm/xcode/xcshareddata/xcschemes/**"
      # Per CI path-filter self-validation rule: edits to the composite action
      # must re-trigger CI so the action change is validated under the gate.
      - ".github/actions/setup-swift-ci/**"
  pull_request:
    branches: [main]
    paths:
      - "Sources/**"
      - "Tests/**"
      - "Package.swift"
      - "Package.resolved"
      - ".github/workflows/ci.yml"
      - "scripts/test.sh"
      - "scripts/ci-test-with-watchdog.sh"
      - "scripts/example-ui-tests.sh"
      - "scripts/cold-start*.sh"
      - "scripts/check-foundation-only-bundle.sh"
      - "scripts/test-ios-simulator.sh"
      - "scripts/lint-no-new-force-unwraps.sh"
      # Tier 0 selective-testing gate (issue #1588). Listed so edits to the
      # resolver or its committed graph snapshot re-trigger CI and the dry-run
      # logging — otherwise a change to the gate would bypass the gate.
      - "scripts/affected-suites.sh"
      - "scripts/affected-suites-graph.json"
      # Tier 2 selective CI (issue #1590). See push section above.
      - "scripts/ci-selective-test.sh"
      - ".swiftpm/xcode/xcshareddata/xcschemes/**"
      # Per CI path-filter self-validation rule: edits to the composite action
      # must re-trigger CI so the action change is validated under the gate.
      - ".github/actions/setup-swift-ci/**"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Single ubuntu-latest job that runs dorny/paths-filter once for every
  # downstream job that needs it. Avoids spinning up a macOS runner (10× billed)
  # per push just to detect that no relevant files changed.
  changes:
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.filter.outputs.server }}
      macros: ${{ steps.filter.outputs.macros }}
      cold-start: ${{ steps.filter.outputs.cold-start }}
      persistence: ${{ steps.filter.outputs.persistence }}
      foundation-only: ${{ steps.filter.outputs.foundation-only }}
      # Tier 0 (issue #1588): the affected per-PR test-job suite list, or the
      # sentinel FULL / NONE. DRY-RUN — published for a later PR to wire into the
      # test --filter; nothing consumes it to change execution yet.
      affected: ${{ steps.affected.outputs.affected }}
      # Per-module API surface flags — consumed by the per-PR API-break gate to
      # limit diagnose-api-breaking-changes to only the modules that changed.
      api-inference: ${{ steps.filter.outputs.api-inference }}
      api-runtime: ${{ steps.filter.outputs.api-runtime }}
      api-cloudcore: ${{ steps.filter.outputs.api-cloudcore }}
      api-persistence: ${{ steps.filter.outputs.api-persistence }}
      api-ui: ${{ steps.filter.outputs.api-ui }}
      # Consumed by `all-traits-build`: true when Sources, Package.swift, or this
      # workflow file changes — the same set that triggers the main `test` job.
      all-traits: ${{ steps.filter.outputs.all-traits }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4
        id: filter
        with:
          # `list-files: json` exposes the full changed-file list as
          # `steps.filter.outputs.all_files` (via the catch-all `all` filter
          # below) for the Tier 0 resolver to map to affected suites.
          list-files: json
          filters: |
            all:
              - '**'
            server:
              - 'Sources/ManifoldServer*/**'
              - 'Tests/ManifoldServerTests/**'
              - 'Package.swift'
              - 'Package.resolved'
              - '.github/workflows/ci.yml'
              - 'scripts/test.sh'
            macros:
              - 'Sources/ManifoldMacrosPlugin/**'
              - 'Sources/ManifoldInference/Macros/**'
              - 'Tests/ManifoldInferenceTests/ToolSchemaMacro*.swift'
              - 'Package.swift'
              - 'Package.resolved'
              - '.github/workflows/ci.yml'
              - 'scripts/test.sh'
            cold-start:
              - 'Package.swift'
              - 'Package.resolved'
              - 'scripts/cold-start-conformance.sh'
              - 'scripts/cold-start-tier2-bootstrap.sh'
              - 'scripts/cold-start-tier3-chatview.sh'
              - 'scripts/cold-start-specialised-mcp.sh'
              - 'scripts/cold-start-specialised-voice.sh'
              - 'scripts/cold-start-specialised-uimodelmanagement.sh'
              - 'Sources/ManifoldMCP/**'
              - 'Sources/ManifoldVoice/**'
              - 'Sources/ManifoldUIModelManagement/**'
              - '.github/workflows/ci.yml'
            persistence:
              - 'Sources/ManifoldPersistenceSwiftData/**'
              - 'Tests/ManifoldPersistenceSwiftDataTests/ModelContainerFileProtectionTests.swift'
              - '.swiftpm/xcode/xcshareddata/xcschemes/ManifoldPersistenceSwiftDataTests.xcscheme'
              - 'Package.swift'
              - 'Package.resolved'
              - '.github/workflows/ci.yml'
              - 'scripts/test-ios-simulator.sh'
            foundation-only:
              - 'Package.swift'
              - 'Package.resolved'
              - 'Sources/ManifoldFoundation/**'
              - 'scripts/check-foundation-only-bundle.sh'
              - '.github/workflows/ci.yml'
            # Per-module API surface filters — used to gate and narrow the
            # per-PR diagnose-api-breaking-changes check to only the targets
            # that actually changed. Intentionally omit Package.swift /
            # Package.resolved: a dep-graph change can't introduce an API
            # break in the Swift source; the nightly full-run will catch it.
            api-inference:
              - 'Sources/ManifoldInference/**'
              # ManifoldContract is @_exported from ManifoldInference, so its
              # public surface is part of ManifoldInference's API contract.
              - 'Sources/ManifoldContract/**'
            api-runtime:
              - 'Sources/ManifoldRuntime/**'
            api-cloudcore:
              - 'Sources/ManifoldCloudCore/**'
            api-persistence:
              - 'Sources/ManifoldPersistenceSwiftData/**'
            api-ui:
              - 'Sources/ManifoldUI/**'
            # Used by the `all-traits-build` job below. Matches any Swift source,
            # Package.swift, and ci.yml itself so the job self-validates on edits
            # (per CI path-filter self-validation rule: a gate that doesn't track
            # its own workflow file bypasses the gate when the file is changed).
            all-traits:
              - 'Sources/**'
              - 'Package.swift'
              - 'Package.resolved'
              - '.github/workflows/ci.yml'

      # Tier 0 selective testing (issue #1588).
      #
      # Maps the diff to the subset of per-PR `test`-job suites it could affect,
      # using the committed SwiftPM target-graph snapshot
      # (scripts/affected-suites-graph.json) so this 1×-billed ubuntu job needs
      # only jq — no Swift toolchain (ubuntu-latest has none; resolving the graph
      # on Linux fails on the Apple-only MLX/llama deps anyway). The snapshot is
      # derived purely from Package.swift and its freshness is guarded in the
      # `test` job.
      #
      # The `affected` output is consumed by "Compute test mode" in the `test` job
      # (Tier 2, issue #1590) to route each run to either the selective xcodebuild
      # path or the full swift-test batch. On push to main the resolver returns FULL
      # — selective applies to pull_request only.
      #
      # NONE means the changed files do not map to any test-job suite (e.g. a
      # docs-only or script-only change). The `test` job maps NONE → mode=full as a
      # conservative fallback — see "Compute test mode" for the rationale.
      - name: Tier 0 — affected-suite resolver
        id: affected
        env:
          ALL_FILES: ${{ steps.filter.outputs.all_files }}
          MANIFOLD_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -uo pipefail
          files="${ALL_FILES:-[]}"
          # Never let a resolver hiccup fail the cheap changes job; fall back to FULL.
          affected="$(printf '%s' "$files" | jq -r '.[]?' | bash scripts/affected-suites.sh)" || affected=FULL
          [ -z "$affected" ] && affected=FULL
          echo "affected=$affected" >> "$GITHUB_OUTPUT"
          {
            echo "### Tier 0 selective-testing (issue #1588)"
            echo ""
            if [ "$affected" = "FULL" ]; then
              echo "Running the **full** test-job suite list (no narrowing)."
            elif [ "$affected" = "NONE" ]; then
              echo "No test-job suites matched the changed files — falling back to a **full run** as a conservative measure (NONE → full)."
            else
              n=$(printf '%s\n' "$affected" | wc -w | tr -d ' ')
              echo "Running **${n}** affected test-job suite(s) via selective path: \`${affected}\`"
            fi
            echo ""
            echo "_Tier 0 (execution routing) + Tier 2 (compile pruning, issue #1590) are now wired. When mode=selective the \`test\` job runs only the affected suites via xcodebuild per-target instead of the full swift-test bundle._"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Tier 0: affected=${affected}"

  test:
    needs: [changes]
    runs-on: macos-15  # Apple Silicon (arm64) standard runner to reduce spend

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # paths-filter needs the parent commit to diff against on `push` events;
          # `pull_request` works with the default shallow clone.
          fetch-depth: 2

      - name: Detect dependency-graph changes
        id: deps-changed
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4
        with:
          filters: |
            deps:
              - 'Package.swift'
              - 'Package.resolved'

      - name: Setup Swift CI environment
        uses: ./.github/actions/setup-swift-ci
        with:
          verify-toolchain: "true"

      # .build/debug is intentionally NOT cached. Tried twice (#961, #1045), reverted
      # twice (#1036, this PR) — measured median 13% worse than no cache because SwiftPM
      # embeds paths in module fingerprints, making restored objects invalid on miss
      # while the cache-write cost is paid on every PR. Do not re-attempt without a
      # materially different strategy (e.g., content-addressed module cache).
      #
      # A *surgical* deps-only variant was also spiked (2026-06) and rejected. The
      # dependency-built products are only ~33 MB (vs ~248 MB for our own modules),
      # and restoring just those (with build.db/debug.yaml) DOES work — SwiftPM
      # accepts them and skips recompiling ArgumentParser/ViewInspector/etc. But it
      # saves ~0s wall-clock: dep compilation parallelizes behind our own ~248 MB
      # local graph (the long pole), which changes every PR and can never be cached.
      # Measured cold vs deps-restored: 40-44s both, within noise, before counting
      # the ~67 MB cache I/O. The real floor is local-module + test compile and test
      # execution, neither cacheable. Don't re-spike the deps cache.

      - name: Lint — ManifoldUI does not import ManifoldUIModelManagement
        # The two modules form a one-way edge: ManifoldUIModelManagement depends
        # on ManifoldUI, never the other way around. A back-edge would close the
        # cycle the v2.0 peel was designed to break. The cycle is currently
        # dissolved by closure-injecting `APIConfigurationView` into ChatView and
        # GenerationSettingsView; this lint guards against accidental regression.
        run: |
          set -euo pipefail
          if grep -RIn --include='*.swift' '^[[:space:]]*import[[:space:]]\+ManifoldUIModelManagement' Sources/ManifoldUI/; then
            echo "::error::ManifoldUI must not import ManifoldUIModelManagement (would close the dep cycle)."
            exit 1
          fi
          echo "ManifoldUI -> ManifoldUIModelManagement edge is clean."

      - name: Lint — ManifoldRuntime must not import SwiftData or SwiftUI
        # ManifoldRuntime is a pure inference-orchestration module: no persistence
        # framework, no UI framework, no Observation. This keeps it usable from
        # any context that doesn't need a full app stack.
        # `//` comments are stripped before matching so docs may name the
        # forbidden frameworks when explaining the boundary.
        run: |
          set -euo pipefail
          violations=$(
            find Sources/ManifoldRuntime -name '*.swift' -print0 \
            | while IFS= read -r -d '' f; do
                sed 's://.*$::' "$f" | grep -nE 'import (SwiftData|SwiftUI|Observation)' | sed "s|^|$f:|" || true
              done
          )
          if [ -n "$violations" ]; then
            echo "$violations"
            echo "::error::ManifoldRuntime must not import SwiftData, SwiftUI, or Observation."
            exit 1
          fi
          echo "ManifoldRuntime framework-isolation posture OK."

      - name: Lint — ManifoldRuntime must not use URLSession or Keychain
        # ManifoldRuntime must not perform networking or access the system keychain
        # directly — those concerns belong in ManifoldInference or ManifoldBackends.
        # `//` comments are stripped before matching so docs may name the
        # forbidden APIs when explaining the boundary (e.g. WebSearchRuntime).
        run: |
          set -euo pipefail
          violations=$(
            find Sources/ManifoldRuntime -name '*.swift' -print0 \
            | while IFS= read -r -d '' f; do
                sed 's://.*$::' "$f" | grep -nE 'URLSession|SecItemCopyMatching|kSecClass' | sed "s|^|$f:|" || true
              done
          )
          if [ -n "$violations" ]; then
            echo "$violations"
            echo "::error::ManifoldRuntime must not use URLSession or Keychain."
            exit 1
          fi
          echo "ManifoldRuntime networking/keychain posture OK."

      - name: Lint — ManifoldUI must not import ManifoldPersistenceSwiftData
        # ManifoldUI must not reach the SwiftData adapter layer directly.
        # All persistence access goes through the port protocols in ManifoldRuntime.
        #
        run: |
          set -euo pipefail
          if grep -rn --include='*.swift' 'import ManifoldPersistenceSwiftData' Sources/ManifoldUI/; then
            echo "::error::ManifoldUI must not import ManifoldPersistenceSwiftData directly."
            exit 1
          fi
          echo "ManifoldUI -> ManifoldPersistenceSwiftData edge is clean."

      - name: Lint — no new force-unwraps in Sources
        run: bash scripts/lint-no-new-force-unwraps.sh Sources

      - name: Lint — Macro plugin builds inside the SwiftPM sandbox
        # SwiftPM compiles macro plugins (`ManifoldMacrosPlugin`) inside a
        # sandbox-exec jail by default on macOS. The jail blocks network
        # access and most filesystem writes, which is the only thing
        # standing between a compromised swift-syntax dependency and
        # exfiltrating local secrets at compile time (see #726).
        #
        # `Package.swift` can opt out of the jail via `unsafeFlags`. This
        # lint refuses to merge any change that introduces such an opt-out
        # in the macro plugin target or globally.
        run: |
          set -euo pipefail
          if grep -nE 'unsafeFlags|--disable-sandbox|SWIFTPM_DISABLE_SANDBOX' Package.swift; then
            echo "::error::Package.swift must not disable the SwiftPM macro/build sandbox."
            echo "::error::Macro plugins (ManifoldMacrosPlugin) must run sandboxed — see issue #726."
            exit 1
          fi
          # Defensive: guard against anyone wiring --disable-sandbox into a
          # workflow's swift build/test invocation. Excluded paths are this
          # file's own commentary and the threat-model docs that quote the flag.
          if grep -RIn --include='*.yml' --exclude='ci.yml' -- '--disable-sandbox' .github/workflows/; then
            echo "::error::Workflow scripts must not pass --disable-sandbox to swift build/test."
            exit 1
          fi
          echo "Macro plugin sandbox posture OK."

      - name: Verify Package.resolved is up to date
        # Was a separate `resolve-check` job on its own macos-15 runner; folding
        # it into `test` removes one 10×-billed runner per PR and eliminates the
        # second queue wait that `needs: [resolve-check]` imposed.
        # Gated on the deps-changed filter: Package.resolved can only go stale
        # when Package.swift is edited, so skipping when neither file changed
        # avoids ~47s of wasted resolve work on the typical PR (~15% of total CI).
        if: steps.deps-changed.outputs.deps == 'true'
        run: |
          swift package resolve
          git diff --exit-code Package.resolved || \
            (echo "Package.resolved is stale — run 'swift package resolve' and commit the result." && exit 1)

      - name: Verify Tier 0 affected-suites graph snapshot is up to date
        # The Tier 0 resolver (scripts/affected-suites.sh, issue #1588) reads a
        # committed snapshot of the SwiftPM target graph so the ubuntu `changes`
        # job can resolve affected suites with jq alone (no Swift on Linux). The
        # snapshot is derived purely from Package.swift, so it can only drift when
        # the manifest changes — gate on deps-changed (same as the lockfile check
        # above) and fail if the committed copy is stale so it is regenerated in
        # the same PR.
        if: steps.deps-changed.outputs.deps == 'true'
        run: |
          set -euo pipefail
          scripts/affected-suites.sh --generate > /tmp/affected-suites-graph.json
          diff -u scripts/affected-suites-graph.json /tmp/affected-suites-graph.json || {
            echo "::error::scripts/affected-suites-graph.json is stale — run 'scripts/affected-suites.sh --generate > scripts/affected-suites-graph.json' and commit."
            exit 1
          }
          echo "Tier 0 affected-suites graph snapshot OK."

      - name: Public API source-compatibility check (changed modules only)
        # Guards `import ManifoldKit` source-compat for downstream consumers
        # (TavernPad / localclaw): a public symbol removed by accident from the
        # umbrella's core targets would break those builds.
        #
        # Only runs when at least one of the five checked modules changed
        # (path-gated via the `changes` job) and only checks those modules —
        # avoiding the ~12 min compile cost on PRs that only touch tests,
        # docs, or unrelated modules. The nightly full run (nightly-slow-tests.yml)
        # always checks all five targets so Sources-only regressions in modules
        # not touched by a PR are still caught within 24 h.
        #
        # `--targets` is REQUIRED: whole-package mode fails on the trait-gated
        # `llama` C module — swift-api-digester reports "missing required module
        # 'llama'" when checking out the baseline source.
        #
        # The umbrella `ManifoldKit` target is DELIBERATELY NOT listed — see the
        # comment above the full-run equivalent step in nightly-slow-tests.yml.
        # Skipped on push to main: on a push event origin/main IS the commit
        # being tested, so the diff would be HEAD against HEAD — a guaranteed
        # no-op (measured 526s in run 27209277711). PRs already ran this check
        # before merge; nightly-slow-tests.yml runs it unconditionally as the
        # 24h backstop for Sources-only regressions not touched by a PR.
        if: |
          github.event_name == 'pull_request' && (
            needs.changes.outputs.api-inference == 'true' ||
            needs.changes.outputs.api-runtime == 'true' ||
            needs.changes.outputs.api-cloudcore == 'true' ||
            needs.changes.outputs.api-persistence == 'true' ||
            needs.changes.outputs.api-ui == 'true'
          )
        run: |
          set -euo pipefail
          TARGETS=""
          [[ "${{ needs.changes.outputs.api-inference }}" == "true" ]]   && TARGETS="$TARGETS --targets ManifoldInference"
          [[ "${{ needs.changes.outputs.api-runtime }}" == "true" ]]     && TARGETS="$TARGETS --targets ManifoldRuntime"
          [[ "${{ needs.changes.outputs.api-cloudcore }}" == "true" ]]   && TARGETS="$TARGETS --targets ManifoldCloudCore"
          [[ "${{ needs.changes.outputs.api-persistence }}" == "true" ]] && TARGETS="$TARGETS --targets ManifoldPersistenceSwiftData"
          [[ "${{ needs.changes.outputs.api-ui }}" == "true" ]]          && TARGETS="$TARGETS --targets ManifoldUI"
          echo "Checking API surface for:${TARGETS}"
          # diagnose-api-breaking-changes checks out the baseline tree object
          # from origin/main. A shallow clone (actions/checkout default) omits
          # those objects and causes "unable to read tree" (#1723). --unshallow
          # converts the shallow clone to a full one; fall back to a plain fetch
          # if the repo is already full-depth (e.g. local runs).
          git fetch --unshallow origin main 2>/dev/null || git fetch origin main
          # The allowlist (.github/api-breakage-allowlist.txt) carries the
          # false-positive "X has been removed" entries produced when public
          # types are relocated DOWNWARD into a leaf module that ManifoldInference
          # re-exports via `@_exported import` (P2a Contract extraction, #1719).
          # swift-api-digester analyses each target's own emitted interface and
          # does NOT follow `@_exported` re-exports, so a relocated-but-still-
          # source-reachable symbol reads as "removed" against the pre-merge
          # baseline. The all-traits build proves source-compat is intact. Each
          # entry self-expires: once the relocation lands on main the baseline
          # no longer sees the symbol in ManifoldInference, the digester stops
          # emitting that message, and the unmatched allowlist line becomes an
          # inert no-op (a genuine future removal of a DIFFERENT symbol still
          # trips the gate). See #1723.
          # shellcheck disable=SC2086
          swift package diagnose-api-breaking-changes origin/main $TARGETS \
            --breakage-allowlist-path .github/api-breakage-allowlist.txt

      # CI smoke profile (GitHub macOS Apple Silicon runners):
      # - Runs ManifoldCoreTests + ManifoldRuntimeTests + ManifoldPersistenceSwiftDataTests
      #   + ManifoldInferenceTests + ManifoldInferenceSwiftTestingTests
      #   + ManifoldMCPTests + ManifoldUITests + ManifoldBackendsTests + ManifoldTestSupportTests.
      # - ManifoldInferenceTests contains XCTest suites only; Swift Testing suites live in
      #   ManifoldInferenceSwiftTestingTests to prevent a libmalloc SIGABRT from mixed harnesses.
      # - --disable-default-traits skips MLX (default-enabled) to avoid metallib
      #   crashes in CI — Metal shaders are only compiled by Xcode.
      # - ManifoldBackendsTests without traits runs only CI-safe cloud/SSE tests.
      # - Server tests run in the sibling `server-tests` job behind a paths
      #   filter so Hummingbird only compiles when server code changes.
      # - Macro tests run in the sibling `macros-tests` job behind a paths
      #   filter so swift-syntax (~647 files) only compiles when macro
      #   code changes.
      # Local-only coverage:
      # - Run `swift test --filter ManifoldBackendsTests --traits MLX,Llama` on
      #   Apple Silicon for MLX/llama.cpp paths.
      # - Run `swift test --filter ManifoldE2ETests` on physical hardware.
      # - --traits MCP compiles the offline ManifoldMCPTests target; RUN_MCP_E2E
      #   stays unset here, so per-PR CI never requires external MCP servers.
      # - MCP E2E stays out of per-PR CI; nightly-slow-tests runs the
      #   RUN_MCP_E2E-gated streamable-HTTP smoke with a narrow filter so
      #   npx/network-backed subprocess tests remain local-only.

      # --skip-update: Package.resolved pins every dependency, so the graph is
      # already up to date (the Verify step re-confirms this when deps changed).
      # Without this flag, every `swift build`/`swift test` invocation re-contacts
      # every git remote (~10-15s).
      #
      # The XCTest batch below compiles the test bundle on first invocation,
      # so a separate `swift build --build-tests` step would be duplicate work.

      # ── Tier 2 selective path (issue #1590) ─────────────────────────────────
      # When Tier 0 returns a bounded affected-suite list (pull_request only),
      # route each suite to the fastest correct test path via ci-selective-test.sh:
      #   - Suite has an xcscheme AND is not trait-gated → xcodebuild (subgraph compile)
      #   - ManifoldMCPTests → swift test --traits MCP (no xcodebuild trait activation)
      #   - ManifoldBackendsTests → serial swift test (hardware dep in subgraph)
      # Saves ~127s full-bundle compile by compiling only the affected subgraph(s).
      # When Tier 0 returns FULL (hub-module change, push to main) or NONE (no
      # test-job suites affected), fall through to the existing full swift-test batch.
      - name: Compute test mode (Tier 2 selective or full)
        id: test-mode
        run: |
          set -euo pipefail
          affected="${{ needs.changes.outputs.affected }}"
          # Helper: emit "full" with a reason and exit
          emit_full() { echo "mode=full" >> "$GITHUB_OUTPUT"; echo "Test mode: full ($1)"; exit 0; }
          # NONE means no test-job suite maps to the changed files. We fall back
          # to full rather than skipping all tests: the resolver is conservative
          # (it can over-approximate but never under-approximate), and a NONE on
          # a non-docs PR is almost certainly a graph-snapshot gap, not proof that
          # nothing needs testing. Nightly is the backstop; we never skip here.
          [[ "$affected" == "FULL" || "$affected" == "NONE" || -z "$affected" ]] \
            && emit_full "affected=${affected:-unset} (NONE falls back to full as conservative measure)"
          # Count suites that require a full swift-test bundle compile (can't use xcodebuild):
          # ManifoldMCPTests (MCP trait not in defaults) and ManifoldBackendsTests
          # (ManifoldMLX/ManifoldLlama in subgraph → Metal shaders with xcodebuild defaults).
          # Running 2+ such suites separately compiles the full bundle twice, which is always
          # slower than one full run. Also fall back if total suite count is large (≥8)
          # to avoid excessive sequential xcodebuild overhead outweighing the compile savings.
          swift_test_count=0
          for s in $affected; do
            case "$s" in ManifoldMCPTests|ManifoldBackendsTests) ((swift_test_count++)) ;; esac
          done
          total_count=$(printf '%s\n' $affected | wc -w | tr -d ' ')
          [[ $swift_test_count -ge 2 ]] \
            && emit_full "2+ swift-test suites (${affected}) would compile full bundle twice"
          [[ $total_count -ge 8 ]] \
            && emit_full "${total_count} suites — xcodebuild overhead exceeds full-run savings"
          echo "mode=selective" >> "$GITHUB_OUTPUT"
          echo "suites=$affected" >> "$GITHUB_OUTPUT"
          echo "Test mode: selective — ${total_count} suite(s): $affected"

      # ── SELECTIVE PATH (Tier 2) ──────────────────────────────────────────────
      - name: Test — Selective (Tier 2 compile-pruned xcodebuild)
        id: test-selective
        if: steps.test-mode.outputs.mode == 'selective'
        timeout-minutes: 30
        env:
          MANIFOLD_TEST_OUTPUT_FILE: ${{ github.workspace }}/test-diagnostics/test-selective.log
          STALL_SECONDS: "240"
        run: scripts/ci-selective-test.sh ${{ steps.test-mode.outputs.suites }}

      # ── FULL PATH — existing swift-test batch (unchanged) ────────────────────
      # Run the full XCTest batch with --parallel. Every test that read or wrote
      # `UserDefaults.standard` has been migrated to a per-suite
      # `UserDefaults(suiteName:)` instance — see
      # `Tests/ManifoldCoreTests/UserDefaultsStandardAuditTest` (the tripwire
      # that fails CI if a future test reintroduces the bare `.standard`
      # access) and issue #910 for the migration history. Combined with
      # MockURLProtocol's per-test unique hosts, the XCTest batch is now
      # safe under SwiftPM's per-process worker model.
      #
      # Swift Testing must stay isolated — mixing XCTest + Swift Testing in one
      # swift test process triggers a libmalloc double-free SIGABRT (see
      # SwiftTestingAuditTest, #681).
      # Wrapped in scripts/ci-test-with-watchdog.sh so a hung test aborts the
      # *test* (with a SIGABRT backtrace identifying it) instead of silently
      # starving the 30-min job step. Without the watchdog, every push to main
      # for the past week has burned 60 wall-clock minutes (30-min kill on
      # this step + 30-min kill on the Swift Testing step below) with zero
      # diagnostic signal about which test stalled. See the script header for
      # the design rationale.
      #
      # All three test invocations below pass the SAME trait set
      # (`MCP,CloudSaaS`). `swift test --filter` always builds the whole test
      # tree (the filter only gates execution), so a different trait set per
      # invocation means a different conditional-compilation config and forces a
      # full recompile each time — measured ~63s rebuilt on the Swift Testing
      # step alone (CI log, run 26705440802). Using one superset trait set lets
      # steps 2–3 reuse step 1's `.build` and drop to test-execution-only. The
      # set is a superset (step 1 needs MCP, step 3 needs CloudSaaS, step 2 needs
      # neither) — traits only ADD compiled code, so no suite's behavior changes.
      # Keep all three in sync; diverging the traits silently reintroduces the
      # redundant rebuilds.
      - name: Test — XCTest suites (Core + Runtime + PersistenceSwiftData + UI + UIModelManagement + MCP + TestSupport + AppIntents + Inference + Networking + TurnLoopCharacterization, parallel) [full]
        id: test-xctest-suites
        if: steps.test-mode.outputs.mode == 'full'
        timeout-minutes: 30
        env:
          MANIFOLD_TEST_OUTPUT_FILE: ${{ github.workspace }}/test-diagnostics/test-xctest-suites.log
          STALL_SECONDS: "240"
        run: scripts/ci-test-with-watchdog.sh --filter ManifoldCoreTests --filter ManifoldRuntimeTests --filter ManifoldPersistenceSwiftDataTests --filter ManifoldUITests --filter ManifoldUIModelManagementTests --filter ManifoldMCPTests --filter ManifoldTestSupportTests --filter ManifoldAppIntentsTests --filter ManifoldInferenceTests --filter ManifoldNetworkingTests --filter ManifoldSecretsTests --filter ManifoldHardwareTests --filter ManifoldModelCatalogTests --filter ManifoldTurnLoopCharacterizationTests --disable-default-traits --traits MCP,CloudSaaS --skip-update --parallel

      # ManifoldBackendsTests is intentionally NOT included in the --parallel batch
      # above. Under --parallel, swift-test schedules XCTest classes across workers
      # concurrently, so ClaudeBackendConformanceTests.test_z_contract_metaContract
      # can fire before the OpenAI* backend classes have loaded and registered their
      # claims. The shared claims registry then looks incomplete and the meta-contract
      # check fails (see CLAUDE.md "BackendContractChecks" note). Running this suite
      # alone in a separate serial invocation guarantees every backend class loads and
      # registers before any meta-contract assertion executes.
      # In selective mode this suite runs via ci-selective-test.sh when it appears in
      # the affected set; the full-mode step below is therefore scoped to full runs.
      - name: Test — ManifoldBackendsTests (serial, claims-registry safe) [full]
        id: test-backends
        if: ${{ steps.test-mode.outputs.mode == 'full' && (success() || failure()) }}
        timeout-minutes: 30
        env:
          MANIFOLD_TEST_OUTPUT_FILE: ${{ github.workspace }}/test-diagnostics/test-backends.log
          STALL_SECONDS: "240"
        run: scripts/ci-test-with-watchdog.sh --filter ManifoldBackendsTests --disable-default-traits --traits MCP,CloudSaaS --skip-update

      # `if: (success() || failure())` so a failing XCTest step still surfaces
      # Swift Testing failures in the same run — otherwise breakage in both
      # harnesses costs two re-push cycles to triage. In selective mode this
      # suite runs via ci-selective-test.sh when it appears in the affected set.
      - name: Test — Inference (Swift Testing, isolated process) [full]
        id: test-inference-swift-testing
        if: ${{ steps.test-mode.outputs.mode == 'full' && (success() || failure()) }}
        timeout-minutes: 30
        env:
          MANIFOLD_TEST_OUTPUT_FILE: ${{ github.workspace }}/test-diagnostics/test-inference-swift-testing.log
          STALL_SECONDS: "240"
        run: scripts/ci-test-with-watchdog.sh --filter ManifoldInferenceSwiftTestingTests --disable-default-traits --traits MCP,CloudSaaS --skip-update

      # Coverage thresholds run nightly in nightly-slow-tests.yml — they were
      # moved out of per-main-push CI to reclaim ~130s of wall (~22 billed
      # macOS-min) per push.  scripts/check-coverage.sh thresholds sit 10pp
      # below the 2026-05-15 baseline, so a ≤24h detection delay is acceptable.

      # PinnedSessionDelegateTests lives in Tests/ManifoldBackendsTests/ and is
      # an XCTestCase subclass. The "ManifoldBackendsTests (serial)" step above
      # already covers it in full mode (same target, same trait set). In selective
      # mode, ManifoldBackendsTests is in the Tier 0 dependency graph under
      # ManifoldCloudCore, so ci-selective-test.sh picks it up whenever
      # ManifoldCloudCore (or any ancestor) changes. The two separate steps
      # (pre-build warm-up + PinnedSessionDelegate test) were removed: the
      # pre-build was a workaround for the watchdog firing on a cold .build
      # directory that only arose when the three full-path steps were skipped
      # in selective mode — a path that no longer exists now that ManifoldBackends-
      # Tests is the canonical home for these tests. Measured cost of the removed
      # steps: ~182s per run for <1s of actual test execution.
      - name: Stage test diagnostics
        # Each test step writes to a unique workspace log path via
        # MANIFOLD_TEST_OUTPUT_FILE so `if: always()` follow-up steps cannot
        # overwrite a previous failing step's diagnostics.
        if: failure()
        env:
          SELECTIVE_FAILED: ${{ steps.test-selective.outcome == 'failure' }}
          XCTEST_SUITES_FAILED: ${{ steps.test-xctest-suites.outcome == 'failure' }}
          BACKENDS_FAILED: ${{ steps.test-backends.outcome == 'failure' }}
          INFERENCE_SWIFT_TESTING_FAILED: ${{ steps.test-inference-swift-testing.outcome == 'failure' }}
          # Note: PINNED_SESSION step removed — PinnedSessionDelegateTests is now
          # covered by the ManifoldBackendsTests serial step (same target).
        run: |
          mkdir -p test-diagnostics
          {
            echo "run-id=${{ github.run_id }}"
            echo "run-attempt=${{ github.run_attempt }}"
            echo "job=test"
            echo "selective-failed=${SELECTIVE_FAILED}"
            echo "xctest-suites-failed=${XCTEST_SUITES_FAILED}"
            echo "backends-failed=${BACKENDS_FAILED}"
            echo "inference-swift-testing-failed=${INFERENCE_SWIFT_TESTING_FAILED}"
          } > test-diagnostics/failed-steps.txt
          # Best-effort: copy any xcresult bundles a future xcodebuild step
          # might have produced under DerivedData.
          find "${HOME}/Library/Developer/Xcode/DerivedData" -type d -name "*.xcresult" -maxdepth 6 2>/dev/null \
            | while read -r r; do cp -R "$r" test-diagnostics/ || true; done

      - name: Upload test diagnostics on failure
        # swift test does not produce .xcresult bundles, so we upload whatever
        # diagnostics the failing step left behind (captured stdout/stderr,
        # watchdog stall snapshots/backtrace tails, plus any xcresult bundles
        # if they exist).
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xcresult-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: test-diagnostics/

  # Server tests are split out of the per-PR mega-batch because the
  # Hummingbird transitive graph (~18 extra pins, swift-nio + NIOSSL +
  # BoringSSL + AsyncHTTPClient + ContainersPreview + Configuration) added
  # ~250s to the build step when it shipped unconditionally. The Server trait
  # peels Hummingbird out of the default-trait build so only this job pays
  # the compile cost — and only when server code or the dep graph changes.
  server-tests:
    needs: [changes]
    if: needs.changes.outputs.server == 'true'
    runs-on: macos-15  # match the `test` job runner so cache keys collide

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # paths-filter needs the parent commit to diff against on `push` events;
          # `pull_request` works with the default shallow clone.
          fetch-depth: 2

      # Same path/key shape as the `test` job — both jobs share the SwiftPM dep
      # tarball cache so we don't re-download the graph twice per workflow run.
      - name: Setup Swift CI environment
        uses: ./.github/actions/setup-swift-ci
        with:
          verify-toolchain: "true"

      - name: Test — Server suite (Server trait)
        id: test-server
        timeout-minutes: 12
        env:
          MANIFOLD_TEST_OUTPUT_FILE: ${{ github.workspace }}/test-diagnostics/test-server.log
        run: scripts/test.sh --filter ManifoldServerTests --disable-default-traits --traits Server --skip-update

      - name: Stage test diagnostics
        if: failure()
        run: |
          mkdir -p test-diagnostics
          {
            echo "run-id=${{ github.run_id }}"
            echo "run-attempt=${{ github.run_attempt }}"
            echo "job=server-tests"
            echo "test-server-failed=${{ steps.test-server.outcome == 'failure' }}"
          } > test-diagnostics/failed-steps.txt

      - name: Upload test diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xcresult-server-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: test-diagnostics/

  # Macro plugin tests are split out of the per-PR mega-batch because the
  # `@ToolSchema` macro plugin pulls swift-syntax (~647 source files) into the
  # build graph. Trait-gated behind `Macros` (off by default) so the default
  # `test` job skips the swift-syntax compile cost; this job picks them up
  # only when macro code or the dep graph changes.
  macros-tests:
    needs: [changes]
    if: needs.changes.outputs.macros == 'true'
    runs-on: macos-15  # match the `test` job runner so cache keys collide

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # paths-filter needs the parent commit to diff against on `push` events;
          # `pull_request` works with the default shallow clone.
          fetch-depth: 2

      # Same path/key shape as the `test` job — both jobs share the SwiftPM dep
      # tarball cache so we don't re-download the graph twice per workflow run.
      - name: Setup Swift CI environment
        uses: ./.github/actions/setup-swift-ci
        with:
          verify-toolchain: "true"

      - name: Test — @ToolSchema macro suite (Macros trait)
        id: test-macros
        timeout-minutes: 12
        env:
          MANIFOLD_TEST_OUTPUT_FILE: ${{ github.workspace }}/test-diagnostics/test-macros.log
        run: scripts/test.sh --filter ToolSchemaMacro --disable-default-traits --traits Macros --skip-update

      - name: Stage test diagnostics
        if: failure()
        run: |
          mkdir -p test-diagnostics
          {
            echo "run-id=${{ github.run_id }}"
            echo "run-attempt=${{ github.run_attempt }}"
            echo "job=macros-tests"
            echo "test-macros-failed=${{ steps.test-macros.outcome == 'failure' }}"
          } > test-diagnostics/failed-steps.txt

      - name: Upload test diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xcresult-macros-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: test-diagnostics/

  # Cold-start conformance — all six gate scripts on a single runner.
  #
  # Previously six separate jobs (cold-start, cold-start-tier2, cold-start-tier3,
  # cold-start-specialised-mcp, cold-start-specialised-voice,
  # cold-start-specialised-uimodelmanagement), each on its own macos-15 runner.
  # Combined sequential runtime (~1,277s) is below the `test` job they run
  # alongside (~1,347s), so one runner running all six scripts sequentially costs
  # zero added wall-clock while saving 5 runner spin-ups + 5 cache restores per
  # triggering PR. Steps 2–6 use `if: success() || failure()` so a single script
  # failure does not mask the remaining checks — every tier always reports,
  # matching the `test` job's pattern. The job fails automatically if any step
  # fails (GitHub marks the job failed whenever any non-always step exits non-zero).
  #
  # Per-PR gating: fires when cold-start filter matches (Package.swift,
  # Package.resolved, any cold-start*.sh script, or the specialised module
  # sources). Nightly runs all six unconditionally every day.
  cold-start:
    needs: [changes]
    if: needs.changes.outputs.cold-start == 'true'
    runs-on: macos-15  # match the `test` job runner so cache keys collide

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Setup Swift CI environment
        uses: ./.github/actions/setup-swift-ci

      # Tier 1 — scaffolds a fresh SwiftPM consumer in a tmpdir, links ManifoldKit
      # by local path, and runs one chat turn through a tiny inline fake backend.
      # Catches breaks in the public consumer surface (Package.swift link shape,
      # public registration / load / generate APIs, GenerationStream consumption
      # pattern, swift-tools-version floor).
      # See scripts/cold-start-conformance.sh for the full rationale.
      - name: Cold-start tier 1 — public consumer surface
        timeout-minutes: 10
        run: scripts/cold-start-conformance.sh

      # Tier 2 — extends the tier-1 pattern to the high-level orchestration surface
      # real chat apps use: ManifoldBootstrap → ChatViewModel → vm.sendMessage().
      # Catches breaks in ManifoldBootstrap link shape (Inference + Runtime +
      # PersistenceSwiftData + UI products), the configure(runtime:) ergonomics,
      # and the ambient inputText / sendMessage pattern.
      # See scripts/cold-start-tier2-bootstrap.sh for the full rationale.
      - name: Cold-start tier 2 — ManifoldBootstrap → ChatViewModel
        if: success() || failure()
        timeout-minutes: 10
        run: scripts/cold-start-tier2-bootstrap.sh

      # Tier 3 — scaffolds a fresh SwiftPM consumer that composes a downstream
      # SwiftUI RootView around ChatView, proving @Observable view models are passed
      # via .environment(_:) (not ObservableObject/@EnvironmentObject) and that the
      # @ViewBuilder apiConfiguration: closure shape still compiles.
      # See scripts/cold-start-tier3-chatview.sh for the full rationale.
      - name: Cold-start tier 3 — ChatView composition
        if: success() || failure()
        timeout-minutes: 10
        run: bash scripts/cold-start-tier3-chatview.sh

      # Specialised: ManifoldMCP — links ManifoldMCP as a standalone product
      # dependency and verifies that MCPServerDescriptor, MCPTransportKind, and
      # MCPToolSource are reachable from outside the package. MCP trait is not
      # required (trait only gates the ManifoldMCPTests dependency edge).
      - name: Cold-start specialised — ManifoldMCP
        if: success() || failure()
        timeout-minutes: 10
        run: scripts/cold-start-specialised-mcp.sh

      # Specialised: ManifoldVoice — links ManifoldVoice as a standalone product
      # dependency and verifies VoiceError, VoiceCaptureState, and the
      # SpeechTranscribing / SpeechSynthesizing protocol pair are reachable.
      - name: Cold-start specialised — ManifoldVoice
        if: success() || failure()
        timeout-minutes: 10
        run: scripts/cold-start-specialised-voice.sh

      # Specialised: ManifoldUIModelManagement — links ManifoldUIModelManagement as
      # a standalone product dependency and verifies ModelManagementViewModel,
      # ModelImportError, and DocumentLibraryViewModel are reachable. Runs with the
      # baseline trait set (no optional traits) so it exercises the always-present slice.
      - name: Cold-start specialised — ManifoldUIModelManagement
        if: success() || failure()
        timeout-minutes: 10
        run: scripts/cold-start-specialised-uimodelmanagement.sh

  # FoundationOnly bundle audit — proves the App Store-lean trait set keeps
  # ManifoldKit overhead under 5 MB and never leaks MLX/Llama framework symbols. One
  # `swift build --traits FoundationOnly` invocation, no `swift test`, so the
  # job is cheap. See scripts/check-foundation-only-bundle.sh for the gate
  # logic and docs/AppStoreSubmission.md for the rationale.
  #
  # Per-PR gating: only fires when Package.swift / Package.resolved, the gate
  # script, or anything in Sources/ManifoldFoundation/** changes (the only
  # target whose code can flip the FoundationOnly bundle composition).
  # Nightly runs it unconditionally every day.
  foundation-only-build:
    needs: [changes]
    if: needs.changes.outputs.foundation-only == 'true'
    runs-on: macos-15  # match the `test` job runner so cache keys collide

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      # FoundationOnly resolves a much smaller dep graph than the default set
      # (no MLX, no llama.swift, no swift-huggingface), but it shares the same
      # cache key family so a tier-1 / tier-2 / default cache hit can warm-restore
      # the package metadata.
      - name: Setup Swift CI environment
        uses: ./.github/actions/setup-swift-ci
        with:
          cache-key-suffix: "-foundation-only"

      - name: Run FoundationOnly bundle audit
        timeout-minutes: 10
        run: scripts/check-foundation-only-bundle.sh

  # iOS Simulator lane — runs ModelContainerFileProtectionTests on a real iOS
  # Simulator destination so the four tests guarded by `#if os(iOS)` actually
  # execute.  NSFileProtectionComplete / NSFileProtectionCompleteUntilFirst-
  # UserAuthentication are iOS kernel features; the standard macOS `swift test`
  # lane skips those tests entirely.  Scoped to only the
  # ManifoldPersistenceSwiftDataTests/ModelContainerFileProtectionTests suite to
  # keep runtime short.  See scripts/test-ios-simulator.sh for the full rationale.
  ci-ios-file-protection:
    needs: [changes]
    if: needs.changes.outputs.persistence == 'true'
    runs-on: macos-15  # match the `test` job runner

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Setup Swift CI environment
        uses: ./.github/actions/setup-swift-ci

      - name: Test — ModelContainerFileProtectionTests (iOS Simulator)
        id: test-ios-file-protection
        timeout-minutes: 15
        run: scripts/test-ios-simulator.sh --ci

      - name: Stage test diagnostics
        if: failure()
        run: |
          mkdir -p test-diagnostics
          {
            echo "run-id=${{ github.run_id }}"
            echo "run-attempt=${{ github.run_attempt }}"
            echo "job=ci-ios-file-protection"
            echo "test-ios-file-protection-failed=${{ steps.test-ios-file-protection.outcome == 'failure' }}"
          } > test-diagnostics/failed-steps.txt
          find "${HOME}/Library/Developer/Xcode/DerivedData" -type d -name "*.xcresult" -maxdepth 6 2>/dev/null \
            | while read -r r; do cp -R "$r" test-diagnostics/ || true; done

      - name: Upload test diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xcresult-ios-file-protection-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: test-diagnostics/

  # All-traits build gate (trait-combo exhaustiveness check).
  #
  # WHY: The main `test` job and `--profile ci` both run with
  # `--disable-default-traits`, which compiles only the default-traits-off
  # subset of the package.  Trait-gated `switch` exhaustiveness and other
  # trait-combo breakage is therefore invisible to per-PR CI.  Two canonical
  # failure shapes have already burned CI time:
  #   - #1382: a KV-cache reuse race that only manifests under `--traits MLX,Llama`
  #   - #1660: a BackendRegistrar break that only manifests under `--traits Ollama`
  # Both merged green on the `--disable-default-traits` lane and were caught by
  # the nightly all-traits build — *after* landing on main.
  #
  # This job adds a *per-PR* build-only gate: `swift build --build-tests` with the
  # full trait sweep.  Build only — no `swift test`.  Metal/metallib is only a
  # test-*run* hazard (the compiler emits valid dylib; the crash happens on load);
  # build-modes.yml's nightly `full` leg already proves all-traits builds work on
  # these runners.  The compile step catches switch exhaustiveness gaps,
  # conditional-compilation errors, and missing conformances before merge.
  #
  # `Macros` and `Server` are deliberately excluded: swift-syntax (~647 files)
  # and Hummingbird have their own path-filtered jobs (`macros-tests`,
  # `server-tests`) and their build time would dominate the step budget.
  # The documented trait-combo sweep in CLAUDE.md also omits them.
  #
  # Path-gated via the `all-traits` filter, which matches `Sources/**`,
  # `Package.swift`, `Package.resolved`, and `.github/workflows/ci.yml` — the
  # same set as the main `test` job.  Including `.github/workflows/ci.yml` is
  # required per the CI path-filter self-validation rule: a gate that does not
  # track its own workflow file would bypass itself when this file changes.
  all-traits-build:
    needs: [changes]
    if: needs.changes.outputs.all-traits == 'true'
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Setup Swift CI environment
        uses: ./.github/actions/setup-swift-ci
        with:
          # Own cache namespace: this job's dependency slice (llama.cpp
          # xcframework, mlx-swift checkouts) never appears in the standard
          # --disable-default-traits cache, so sharing the key would re-download
          # the heavy artifacts every run AND restore stale bare repos.
          # restore-keys still falls back to the standard key for the rest.
          cache-key-suffix: "-all-traits"
          verify-toolchain: "true"

      # Build-only — no swift test.  Metal/metallib is only a test-run-time
      # hazard; the compiler produces valid objects on these runners.
      # No --skip-update: a fallback-restored cache can hold bare repos that
      # predate a pinned tag (first red run: llama.swift 2.9553.0 unresolvable
      # from the stale shared cache), and --skip-update suppresses the fetch
      # that would repair it. The ~10-15s of remote contact is correctness here.
      - name: Build — all-traits sweep (trait-combo exhaustiveness)
        timeout-minutes: 25
        run: |
          swift build --build-tests \
            --traits MLX,Llama,Ollama,CloudSaaS,MCP,MCPBuiltinCatalog,HuggingFace,Fuzz
