# Cold-start conformance — tier 4 (human path).
#
# Tiers 1, 2, 3 (in ci.yml) scaffold known-good consumers from hand-written
# code: they prove the *machine* path that a SwiftPM consumer can link
# ManifoldKit and call its public surface in shapes the maintainers control.
#
# Tier 4 follows the *human* path. It treats README.md as the documented
# onboarding contract and asks: would a person reading the README from line 1
# reach a working chat? The gate enforces two structural constraints:
#
#   1. The FIRST H2 in README.md must be `## Hello World`.
#   2. The first ```swift fenced block under that heading must compile against
#      the current ManifoldKit on this branch.
#
# Sibling worker W-D-C1 ships a complementary gate that compiles ALL Swift
# snippets across README + docs. C2 (this workflow) is narrower and stricter:
# the canonical Hello World leads the README and works.
#
# Lives in its own workflow file (not ci.yml) so the human path's onboarding
# contract is visible in PR checks under its own name and so future README /
# QuickStart restructure PRs surface the failure mode at a glance.
#
# Per `[[feedback_ci_path_filter_self_validation]]`, the script's own path is
# in the trigger filter so script-only PRs still exercise the gate. The
# README and Hello World snippet's source dependencies (Sources/ManifoldKit/
# QuickStart.swift, the umbrella `Exports.swift`, ManifoldUI's public
# composition surface) are also covered so a backend / UI refactor that
# breaks the snippet without touching README still fires the gate.

name: cold-start-human

on:
  pull_request:
    # `ready_for_review` required so a draft→ready transition triggers this
    # gate (see CLAUDE.md §"Draft-PR review loop"); the job's draft guard keeps
    # drafts a zero-CI staging area.
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - "README.md"
      - "Package.swift"
      - "Package.resolved"
      - "Sources/ManifoldKit/**"
      - "Sources/ManifoldInference/**"
      - "Sources/ManifoldUI/**"
      - "scripts/cold-start-human.sh"
      # scripts/cold-start-human.sh now sources this shared lib for its build
      # step — list it explicitly so edits to it re-trigger this gate (per CI
      # path-filter self-validation rule).
      - "scripts/_lib/**"
      - ".github/workflows/cold-start-human.yml"
      - ".github/actions/setup-swift-ci/**"

concurrency:
  group: cold-start-human-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  # The provenance step reads the Actions cache metadata after an exact hit.
  # It fails rather than claiming a cache is current without that evidence.
  actions: read
  contents: read

jobs:
  cold-start-human:
    # Skip on draft PRs — CI runs once the PR is marked ready.
    if: github.event.pull_request.draft == false
    # Match the macos-15 runner the tier-1/2/3 cold-start jobs use so SwiftPM
    # cache keys collide and we share the warm checkouts cache.
    runs-on: macos-15
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      # Match the macos-15 runner the tier-1/2/3 cold-start jobs use so SwiftPM
      # cache keys collide and we share the warm checkouts cache.
      - name: Setup Swift CI environment
        uses: ./.github/actions/setup-swift-ci

      # Bound an exact-key hit to one UTC day. PR cache entries are scoped, so
      # an otherwise unchanged content key can remain main-scoped for weeks;
      # accepting it would make this diagnostic depend on old build output.
      - name: Calculate cold-start cache generation
        id: cold-start-cache-generation
        run: |
          set -euo pipefail
          generation="$(date -u +%Y-%m-%d)"
          if ! [[ "${generation}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::Could not calculate UTC-day cold-start cache generation: ${generation}"
            exit 1
          fi
          echo "value=${generation}" >> "${GITHUB_OUTPUT}"
          echo "cold-start cache generation: ${generation} (UTC day; exact cache hits expire at the next generation)"

      # Cache the cold-start consumer's own build path across runs. The script
      # honors MANIFOLDKIT_COLD_START_BUILD_CACHE_DIR by passing it as SwiftPM's
      # --build-path; the consumer target itself rebuilds each run (mktemp
      # source path changes its module fingerprint), but the entire ManifoldKit
      # dependency closure (artifacts + checkouts + transitive object files) is
      # reused. Local measurement: cold 90s → warm 12s (7.5× speed-up), with
      # 1545 → 359 build steps (dep graph re-used, only consumer target
      # recompiled). This is deliberately EXACT-KEY-ONLY: a PR can see its
      # own cache and main's cache, but never another PR's cache. A broad
      # restore prefix would therefore repeatedly select an old main-scoped
      # build directory when the exact key exists only on PR refs (#2423).
      # A clean miss is correct evidence; stale build output is not a speed-up.
      # Memory `feedback_ci_build_debug_cache` warned off caching `.build/debug`
      # for the main test job because path fingerprints invalidate restored
      # objects; that risk is real here too, so the report step below records
      # the exact key and cache provenance whenever one is restored.
      - name: Cache cold-start consumer build path
        id: cold-start-human-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        # Bump v3 when the cache layout or acceptance policy changes. The
        # UTC-day bucket makes every cache older than a day ineligible;
        # `hashFiles` is only available in a step context.
        env:
          COLD_START_HUMAN_CACHE_KEY: ${{ runner.os }}-${{ runner.arch }}-xcode-26.3-cs-human-v3-d${{ steps.cold-start-cache-generation.outputs.value }}-${{ hashFiles('Package.resolved', 'scripts/cold-start-human.sh') }}
        with:
          path: |
            ~/.cache/manifoldkit-cold-start-human
          key: ${{ env.COLD_START_HUMAN_CACHE_KEY }}

      # A miss is intentional: without a broad restore prefix, no unrelated
      # main-scoped build output can be admitted. On an exact hit, look up the
      # only eligible refs (this PR, then the default branch) and fail closed
      # if GitHub's metadata cannot prove which cache generation was restored.
      - name: Report cold-start cache provenance
        env:
          CACHE_HIT: ${{ steps.cold-start-human-cache.outputs.cache-hit }}
          CACHE_KEY: ${{ runner.os }}-${{ runner.arch }}-xcode-26.3-cs-human-v3-d${{ steps.cold-start-cache-generation.outputs.value }}-${{ hashFiles('Package.resolved', 'scripts/cold-start-human.sh') }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "cold-start cache key: ${CACHE_KEY}"

          if [[ "${CACHE_HIT}" != "true" ]]; then
            echo "::notice title=Cold-start cache::Intentional clean miss; no exact cache key was restored."
            echo "cold-start cache provenance: none (exact-key-only restore policy)"
            exit 0
          fi

          fetch_cache_metadata() {
            curl --fail --silent --show-error --retry 3 --get \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --data-urlencode "key=${CACHE_KEY}" \
              --data-urlencode "ref=$1" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/caches"
          }

          cache_ref="${GITHUB_REF}"
          cache_metadata="$(fetch_cache_metadata "${cache_ref}")"
          cache_count="$(printf '%s' "${cache_metadata}" | jq -er '.total_count')"
          if [[ "${cache_count}" == "0" ]]; then
            cache_ref="refs/heads/${DEFAULT_BRANCH}"
            cache_metadata="$(fetch_cache_metadata "${cache_ref}")"
            cache_count="$(printf '%s' "${cache_metadata}" | jq -er '.total_count')"
          fi

          if [[ "${cache_count}" != "1" ]]; then
            echo "::error::Exact cache hit for ${CACHE_KEY}, but cache metadata on eligible ref ${cache_ref} was ambiguous (count=${cache_count})."
            exit 1
          fi

          cache_id="$(printf '%s' "${cache_metadata}" | jq -er '.actions_caches[0].id')"
          cache_created_at="$(printf '%s' "${cache_metadata}" | jq -er '.actions_caches[0].created_at')"
          restored_cache_key="$(printf '%s' "${cache_metadata}" | jq -er '.actions_caches[0].key')"
          if [[ "${restored_cache_key}" != "${CACHE_KEY}" ]]; then
            echo "::error::Cache metadata key ${restored_cache_key} does not match current key ${CACHE_KEY}."
            exit 1
          fi

          echo "cold-start cache provenance: id=${cache_id} key=${restored_cache_key} createdAt=${cache_created_at} ref=${cache_ref}"

      - name: Run tier-4 human cold-start gate
        run: |
          # Resolve cache path under $HOME so the cache step's `~/.cache/...`
          # literal resolves to the same directory. GitHub Actions does not
          # expand `~` in env: blocks, so we set the env var inline.
          mkdir -p "$HOME/.cache/manifoldkit-cold-start-human"
          export MANIFOLDKIT_COLD_START_BUILD_CACHE_DIR="$HOME/.cache/manifoldkit-cold-start-human"
          bash scripts/cold-start-human.sh
