name: Release Please

on:
  push:
    branches: [main]
    paths:
      # Fire only when files that can affect the released version change.
      # release-please scans full commit history on each run, so skipping
      # pushes here never causes it to miss a feat:/fix: commit — the next
      # triggered run sees them all. Excluded: Tests/**, .github/**, scripts/**,
      # docs/**, README.md, Package.resolved (Dependabot bumps are chore: and
      # don't bump the version). CHANGELOG.md / version.txt /
      # .release-please-manifest.json must stay so release-please's own PR
      # merge triggers the GitHub release tag creation.
      - "Sources/**"
      - "CHANGELOG.md"
      - "version.txt"
      - ".release-please-manifest.json"
  workflow_dispatch:

# Cancelling in-progress runs is safe here — only the latest matters. Scoped
# at the workflow level (not job level) for consistency with every other
# workflow's concurrency block (ci.yml, lint.yml, nightly-slow-tests.yml,
# codeql.yml) — cosmetic only, no functional change (#2099).
concurrency:
  group: release-please
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release-please.outputs.release_created }}
      tag_name: ${{ steps.release-please.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release-please
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  sync-release-notes:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Extract changelog entry
        env:
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          python3 - <<'EOF'
          import os, re, sys

          tag = os.environ["TAG_NAME"]
          version = tag.lstrip("v")

          text = open("CHANGELOG.md").read()
          # Match from the version header to the next version header (or end of file)
          pattern = rf"## \[{re.escape(version)}\][^\n]*\n(.*?)(?=\n## \[|\Z)"
          m = re.search(pattern, text, re.DOTALL)
          notes = m.group(1).strip() if m else ""

          if not notes:
              print(f"WARNING: No changelog entry found for {version}", file=sys.stderr)
              sys.exit(1)

          with open("/tmp/release_notes.md", "w") as f:
              f.write(notes)

          print(f"Extracted {len(notes)} chars for {version}")
          EOF

      - name: Update GitHub release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh release edit "$TAG_NAME" --notes-file /tmp/release_notes.md

  # Notify the companion backend packages that a core release shipped.
  # Their canary workflows listen for `repository_dispatch` of type
  # `core-release` and re-resolve against the new tag — the one moment a
  # stale `.upToNextMinor` core pin actually matters (#1749, v0.48 C2).
  #
  # NOTE: the default `secrets.GITHUB_TOKEN` is scoped to THIS repository and
  # cannot fire repository_dispatch cross-repo. `COMPANION_DISPATCH_TOKEN`
  # must be a fine-grained PAT with `contents: read+write` (Repository
  # dispatch falls under contents) on ManifoldKit/manifold-llama,
  # ManifoldKit/manifold-mlx, and ManifoldKit/manifold-eval. Until the maintainer
  # creates that secret this job fails visibly rather than silently skipping the
  # canaries. NOTE: manifold-eval only re-resolves if it ships a matching
  # `repository_dispatch: [core-release]` listener — without one this dispatch is
  # a no-op for that repo (the dispatch target and the listener must land together).
  notify-companions:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch core-release to companion repos
        env:
          GH_TOKEN: ${{ secrets.COMPANION_DISPATCH_TOKEN }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::COMPANION_DISPATCH_TOKEN secret is not set — companion canaries will not re-resolve against $TAG_NAME. Create a fine-grained PAT with contents write on ManifoldKit/manifold-llama, ManifoldKit/manifold-mlx, and ManifoldKit/manifold-eval." >&2
            exit 1
          fi
          for repo in ManifoldKit/manifold-llama ManifoldKit/manifold-mlx ManifoldKit/manifold-eval; do
            gh api -X POST "repos/${repo}/dispatches" \
              -f event_type=core-release \
              -f "client_payload[tag]=${TAG_NAME}"
            echo "Dispatched core-release (${TAG_NAME}) to ${repo}"
          done
