name: Release Provenance Rehearsal (read-only)

on:
  # Rehearsal is a dry-run of release-provenance.yml. It does not need to gate
  # every PR — a weekly cron + manual dispatch is enough to catch breakage
  # before the next tagged release. Per-PR runs added ~macos-15 minutes of
  # 10×-billed CI to every change for no signal on the vast majority of PRs.
  schedule:
    - cron: "0 12 * * 1" # Mondays 12:00 UTC
  workflow_dispatch:

# A scheduled run overlapping a manual workflow_dispatch (or a second manual
# dispatch) would race on the same macos-15 runner's shared caches — the
# exact cache-key hazard nightly-slow-tests.yml's own header comment
# identifies and solves. Cancel the in-flight run so only one is ever active
# (#2099).
concurrency:
  group: release-provenance-rehearsal
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rehearsal:
    name: Rehearse release dependency + SBOM generation
    # Mirrors release-provenance.yml. (No trait flags since v0.48 PR C2 —
    # there are no default traits and the ML families live in companion
    # packages; a bare resolve is the release metadata path.)
    runs-on: macos-15
    # macOS jobs are org-capped at ~5 concurrent; an unbounded default (360
    # min) can stall the whole org queue if this job hangs (#2099 CI review).
    timeout-minutes: 30
    steps:
      - name: Checkout PR commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: "26.3"

      - name: Verify Swift toolchain matches Package.swift tools-version
        run: ./scripts/check-swift-toolchain.sh

      - name: Resolve packages
        run: swift package resolve

      - name: Snapshot dependency tree
        run: |
          mkdir -p artifacts
          swift package show-dependencies --format json \
            > artifacts/dependency-tree.json
          python3 -c '
          import json
          tree = json.load(open("artifacts/dependency-tree.json"))
          assert isinstance(tree, dict), "dependency tree is not an object"
          assert "name" in tree, "dependency tree missing root name"
          print("Dependency tree json shape OK")
          '

      - name: Generate CycloneDX SBOM
        run: |
          ./scripts/generate-sbom.sh --output artifacts/sbom.cdx.json
          python3 -c '
          import json
          bom = json.load(open("artifacts/sbom.cdx.json"))
          assert bom["bomFormat"] == "CycloneDX", "bomFormat mismatch"
          assert bom["specVersion"] == "1.5", "specVersion mismatch"
          assert isinstance(bom["components"], list), "components not a list"
          assert len(bom["components"]) > 0, "no components"
          component_count = len(bom["components"])
          print(f"SBOM ok: {component_count} components")
          '

      - name: Persist rehearsal artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-provenance-rehearsal-${{ github.sha }}
          path: artifacts/
          retention-days: 14
