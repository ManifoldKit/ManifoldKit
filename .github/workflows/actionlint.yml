name: Actionlint

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/actionlint*"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/actionlint*"

concurrency:
  group: actionlint-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install actionlint
        id: install_actionlint
        run: bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.7

      - name: Lint GitHub Actions workflows
        run: ${{ steps.install_actionlint.outputs.executable }} -color
