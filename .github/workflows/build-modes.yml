name: Build modes + binary symbol audit

# Phase 3 of #714. Proves all four documented build modes (offline / ollama /
# saas / full) compile, plus a per-mode binary symbol audit that becomes the
# procurement-evidence artifact.
#
# Cost discipline (per CLAUDE.md "Issue & PR hygiene"):
#  - This workflow runs on the **nightly** cadence. Per-PR CI (ci.yml) already
#    burns macos-15 at 10x billing once per push; cloning that for four modes
#    would 5x it. The `paths:` filter on pull_request below adds a *narrow*
#    on-demand trigger — it only fires when a PR actually edits trait-gated
#    source, Package.resolved (dep bumps), or this workflow's own configuration.
#    Doc-only PRs, Package.swift-only edits (e.g. adding a non-backend target),
#    and unrelated source changes don't trigger it.
#  - **PR vs schedule matrix split.** On `pull_request`, the matrix runs only
#    `[saas]`; on `schedule` (and `workflow_dispatch`) it runs all four
#    `[offline, ollama, saas, full]`. Rationale: `saas` carries a
#    reduced-shape test step (`ManifoldBackendsTests`)
#    that mirrors ci.yml's lane against the SaaS product graph, so it stays
#    per-PR. `full`
#    is a release-config full-graph build that produces a binary symbol
#    audit; per-PR it cost ~9 min wall-clock (~90 min billed at the 10x
#    macos-15 multiplier) on every dep-touching PR while catching only
#    build-graph regressions (not live bugs), so per #953 Lever A it now
#    runs nightly + workflow_dispatch instead. `offline` and `ollama` were
#    already nightly-only because `full` is a strict trait superset that
#    catches every compile-time regression they would. The full 4-mode
#    build+audit matrix continues nightly so the procurement-evidence
#    requirement (90-day per-mode artifacts) is unchanged. Trigger the
#    workflow manually via `gh workflow run build-modes.yml` before merging
#    a risky dep bump if the symbol-audit signal is needed pre-merge.
#  - All four modes run on `macos-15` (10x billing): the package depends on
#    `os` (Apple-only) and SwiftUI throughout `ManifoldUI`/
#    `ManifoldUIModelManagement`, so a Linux compile leg is structurally
#    unviable. The audit relies on Darwin-only `nm -gU` / `otool -L` flags
#    anyway, so a heterogeneous matrix would have produced silently
#    no-op artifacts on Linux even if the build worked.
#
# Symbol audit limitations: defense in depth, not authoritative proof.
# String obfuscation (URLComponents builders, base64, hex bytes, UTF-16 splits)
# defeats the strings pass. SECURITY.md (Phase 4 of #714) documents this.

on:
  schedule:
    # 05:30 UTC daily — after nightly-slow-tests (04:30) so the two macos-15
    # nightlies don't contend for the SwiftPM artifact cache. (fuzz-nightly
    # previously held the 05:00 UTC slot but is now dispatch-only pending a
    # self-hosted Apple-Silicon runner.) The `full` mode is nightly-only:
    # the release-config full-graph build is a 9-min/PR audit; runs nightly
    # because per-PR cost dominated wall-clock without catching live bugs
    # (#953 Lever A).
    - cron: "30 5 * * *"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      # Package.resolved only (not Package.swift): a dep-version bump can break
      # the per-mode product graphs, so it warrants the saas+full build check.
      # Package.swift edits always accompany backend source changes (listed
      # below), so Package.swift alone is dropped — non-backend target
      # additions and platform floor bumps don't affect the product-scoped
      # builds, and the nightly run catches any gap within 24 hours.
      - "Package.resolved"
      - "Sources/ManifoldCloudCore/**"
      - "Sources/ManifoldOllama/**"
      - "Sources/ManifoldCloudSaaS/**"
      - "Sources/ManifoldServer/**"
      - "Sources/ManifoldUI/Views/Settings/**"
      - "Sources/ManifoldUIModelManagement/Views/Settings/**"
      - "Sources/ManifoldHardware/APIProvider.swift"
      - "Sources/manifold-tools/main.swift"
      - ".github/workflows/build-modes.yml"
      - "scripts/build-modes.sh"

# Cancel earlier in-flight runs of this workflow on the same ref. Scheduled
# runs and PR runs share the bucket so a workflow_dispatch retry doesn't
# double-bill macos-15.
concurrency:
  group: build-modes-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos-build-and-audit:
    name: ${{ matrix.mode }} (macOS build + audit)
    runs-on: macos-15
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        # On PRs: only saas. `saas` carries a SaaS-product test slice,
        # which is the per-PR-relevant signal. `full` and
        # the offline/ollama legs are audit-only builds; running them per-PR
        # cost ~9 min wall-clock and ~90 min billed time on every dep-touching
        # PR without catching live bugs (#953 Lever A). On schedule/
        # workflow_dispatch: all four modes for the procurement-evidence
        # artifact set. Trigger the workflow manually before risky merges if
        # the `full`-leg symbol audit is needed pre-merge.
        mode: ${{ github.event_name == 'pull_request' && fromJSON('["saas"]') || fromJSON('["offline", "ollama", "saas", "full"]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: "26.3"

      - name: Cache SwiftPM
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            .build/artifacts
            .build/checkouts
            .build/repositories
          key: ${{ runner.os }}-${{ runner.arch }}-xcode-26.3-spm-${{ matrix.mode }}-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-xcode-26.3-spm-${{ matrix.mode }}-
            ${{ runner.os }}-${{ runner.arch }}-xcode-26.3-spm-

      # The saas leg additionally runs the backends test slice — the
      # other two legs are build+audit only. Splitting this out keeps the
      # matrix readable and avoids running tests on `full` (already covered
      # by the per-PR ci.yml suite).
      # `--skip-update` was previously passed here but produced
      # `unable to read tree <sha>` failures when the SwiftPM cache was
      # restored against a stale repository pack (upstream deps retag between
      # releases, and the cached repo doesn't always have the new revision
      # pack). The flag is also deprecated in current SwiftPM. Dropping it
      # costs ~1s of `git fetch` and is the documented escape hatch.
      - name: Test [saas] — ManifoldBackends, reduced shape
        if: matrix.mode == 'saas'
        run: scripts/test.sh --filter ManifoldBackendsTests

      - name: Build + audit [${{ matrix.mode }}]
        env:
          BUILD_MODES_ARTIFACT_DIR: build-modes-audit
        run: scripts/build-modes.sh ${{ matrix.mode }} --audit

      - name: Upload audit artifacts (${{ matrix.mode }})
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-modes-audit-${{ matrix.mode }}-${{ github.run_id }}
          # 90-day retention is the procurement-evidence requirement called
          # out in the issue. Each artifact is a few MB of nm/strings/otool
          # text snapshots, so retention cost is trivial.
          retention-days: 90
          if-no-files-found: warn
          path: build-modes-audit/
