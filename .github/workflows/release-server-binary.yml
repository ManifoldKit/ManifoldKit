name: Release Server Binary

# Builds a release arm64 manifold-server binary and uploads it as a release
# asset whenever a GitHub release is published. This workflow is intentionally
# minimal — it mirrors the style of release-provenance.yml.
#
# Gatekeeper caveat: the binary is unsigned and unnotarized. Users who
# download it directly (rather than installing via the Homebrew formula, which
# builds from source) will need to clear quarantine:
#
#   xattr -dr com.apple.quarantine manifold-server
#
# Signing / notarization is deferred until a code-signing identity is
# established for this project.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (e.g. v0.46.0)"
        required: true
        type: string

permissions:
  contents: write       # upload assets to the GitHub release
  id-token: write       # OIDC token for sigstore signing
  attestations: write   # create build-provenance attestations

jobs:
  build-server-binary:
    name: Build manifold-server (arm64 macOS)
    runs-on: macos-15
    # macOS jobs are org-capped at ~5 concurrent; an unbounded default (360
    # min) can stall the whole org queue if this job hangs (#2099 CI review).
    timeout-minutes: 45

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve tag name
        id: tag
        env:
          TAG_INPUT: ${{ github.event.inputs.tag }}
        run: |
          if [[ -n "$TAG_INPUT" ]]; then
            echo "name=$TAG_INPUT" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: "26.3"

      - name: Resolve packages
        # Resolve with the Server trait so the Hummingbird/NIO stack the
        # server binary needs is in the graph.
        run: swift package --traits Server resolve

      - name: Build release binary
        run: |
          swift build \
            --configuration release \
            --product ManifoldServer \
            --traits Server \
            --arch arm64

      - name: Package binary
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          mkdir -p artifacts
          cp .build/release/ManifoldServer artifacts/manifold-server
          cd artifacts
          tar -czf "manifold-server-${TAG}-macos-arm64.tar.gz" manifold-server
          shasum -a 256 "manifold-server-${TAG}-macos-arm64.tar.gz" \
            > "manifold-server-${TAG}-macos-arm64.tar.gz.sha256"

      # Closes the #726 gap for the one binary consumers actually download —
      # release-provenance.yml only attests the SBOM/dependency-tree metadata
      # files, never this tarball, and its sidecar .sha256 is regenerated on
      # the same runner (transfer-integrity only, not provenance: a swapper
      # would regenerate both together). Consumers verify with:
      #   gh attestation verify <tarball> --repo ManifoldKit/ManifoldKit
      - name: Attest binary build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/manifold-server-${{ steps.tag.outputs.name }}-macos-arm64.tar.gz

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          gh release upload "$TAG" \
            "artifacts/manifold-server-${TAG}-macos-arm64.tar.gz" \
            "artifacts/manifold-server-${TAG}-macos-arm64.tar.gz.sha256" \
            --clobber

      - name: Persist artifacts on the workflow run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: manifold-server-binary-${{ steps.tag.outputs.name }}
          path: artifacts/
          retention-days: 90
