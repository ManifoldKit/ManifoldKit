name: Security gates

on:
  pull_request:
    branches: [main]
    paths:
      - "Sources/**"
      - "Tests/**"
      - "Package.swift"
      - "Package.resolved"
      - "scripts/test.sh"
      - ".github/workflows/security-gates.yml"
  push:
    branches: [main]
    paths:
      - "Sources/**"
      - "Tests/**"
      - "Package.swift"
      - "Package.resolved"
      - "scripts/test.sh"
      - ".github/workflows/security-gates.yml"

concurrency:
  group: security-gates-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security-audits:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.3"

      - name: Cache SwiftPM build
        uses: actions/cache@v5
        with:
          path: |
            .build/artifacts
            .build/checkouts
            .build/repositories
          key: ${{ runner.os }}-${{ runner.arch }}-xcode-26.3-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-xcode-26.3-spm-
            ${{ runner.os }}-${{ runner.arch }}-spm-

      - name: Validate Package.resolved is up to date
        run: |
          swift package resolve
          git diff --exit-code Package.resolved || \
            (echo "Package.resolved is stale — run 'swift package resolve' and commit the result." && exit 1)

      # Two default-trait audits batched into one swift-test invocation so the
      # SwiftPM build graph + test-bundle link is paid once instead of twice.
      # Mirrors the mega-batch shape from ci.yml's `Test — XCTest suites` step.
      # The CloudSaaS pinned-session audit below stays separate — its trait
      # change forces a fresh resolve and can't share a build with these.
      # Saves ~150s on every PR (Lever B of #953).
      - name: Test — Traffic boundary + MCP hardening audits (batched)
        env:
          RUN_SLOW_TESTS: "1"
          MANIFOLD_TEST_OUTPUT_FILE: ${{ github.workspace }}/test-diagnostics/test-traffic-boundary-and-mcp-hardening.log
        run: scripts/test.sh --filter "ManifoldInferenceTests.TrafficBoundaryAuditTest" --filter "ManifoldMCPTests.MCPHardeningTests" --disable-default-traits --traits MCP --skip-update --min-passed 2

      - name: Test — PinnedSessionDelegateTests (CloudSaaS)
        env:
          MANIFOLD_TEST_OUTPUT_FILE: ${{ github.workspace }}/test-diagnostics/test-pinned-session-delegate.log
        run: scripts/test.sh --filter "ManifoldBackendsTests.PinnedSessionDelegateTests" --disable-default-traits --traits CloudSaaS --skip-update --min-passed 1
