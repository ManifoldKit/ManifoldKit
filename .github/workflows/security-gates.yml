name: Security gates

on:
  pull_request:
    branches: [main]
    paths:
      - "Sources/**"
      - "Tests/**"
      - "Package.swift"
      - "Package.resolved"
      - "scripts/test.sh"
      - ".github/workflows/security-gates.yml"
  push:
    branches: [main]
    paths:
      - "Sources/**"
      - "Tests/**"
      - "Package.swift"
      - "Package.resolved"
      - "scripts/test.sh"
      - ".github/workflows/security-gates.yml"

concurrency:
  group: security-gates-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security-audits:
    runs-on: macos-15
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.3"

      - name: Cache SwiftPM build
        uses: actions/cache@v5
        with:
          path: |
            .build/artifacts
            .build/checkouts
            .build/repositories
          key: ${{ runner.os }}-${{ runner.arch }}-xcode-26.3-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-xcode-26.3-spm-
            ${{ runner.os }}-${{ runner.arch }}-spm-

      - name: Cache SwiftPM debug build
        id: swiftpm-debug-cache
        uses: actions/cache@v5
        with:
          path: .build/debug
          key: ${{ runner.os }}-${{ runner.arch }}-xcode-26.3-spm-debug-${{ hashFiles('Package.resolved', 'Package.swift', 'Sources/**/*.swift', 'Tests/**/*.swift') }}

      - name: Normalize SwiftPM debug cache mtimes
        if: steps.swiftpm-debug-cache.outputs.cache-hit == 'true'
        run: scripts/ci-normalize-swiftpm-debug-cache.sh .build/debug

      - name: Validate Package.resolved is up to date
        run: |
          swift package resolve
          git diff --exit-code Package.resolved || \
            (echo "Package.resolved is stale — run 'swift package resolve' and commit the result." && exit 1)

      # MCP hardening audit — fast per-PR gate for the MCP security surface.
      # TrafficBoundaryAuditTest is intentionally excluded here: its source-tree
      # walk is slow and it already runs in nightly-slow-tests.yml where the
      # RUN_SLOW_TESTS=1 flag enables it. Keeping it in per-PR security-gates
      # caused 45-min cold-build timeouts (nightly coverage is sufficient for
      # traffic-boundary violations). The CloudSaaS pinned-session audit below
      # stays separate — its trait change forces a fresh resolve.
      - name: Test — MCP hardening audit
        env:
          MANIFOLD_TEST_OUTPUT_FILE: ${{ github.workspace }}/test-diagnostics/test-mcp-hardening.log
        run: scripts/test.sh --filter "ManifoldMCPTests.MCPHardeningTests" --disable-default-traits --traits MCP --skip-update --min-passed 1

      - name: Test — PinnedSessionDelegateTests (CloudSaaS)
        env:
          MANIFOLD_TEST_OUTPUT_FILE: ${{ github.workspace }}/test-diagnostics/test-pinned-session-delegate.log
        run: scripts/test.sh --filter "ManifoldBackendsTests.PinnedSessionDelegateTests" --disable-default-traits --traits CloudSaaS --skip-update --min-passed 1
