name: Dependency Review

# Flags newly-introduced dependencies with known vulnerabilities or
# incompatible licenses on PRs that touch a manifest. Public-org supply-chain
# baseline (estate policies/devops-baseline.md, "Public product" section).

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
