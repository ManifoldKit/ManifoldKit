name: Fuzz (weekly rotation)

# Weekly-tier fuzzing: 30 minutes rotating every installed Ollama model on a
# self-hosted Apple-Silicon runner. Findings are gated against
# `.github/fuzz-allowlist.json` via `scripts/fuzz-ci-gate.sh` (#2367) — an
# unallowlisted finding fails the job; every finding is still uploaded as an
# artifact for review regardless of gate outcome.
#
# This is the single fuzz workflow ManifoldKit runs. The historical PR /
# nightly / hosted-heartbeat tiers were retired in 2026-05: the signal data
# showed that once a backend is mature the fuzzer goes quiet for months at a
# time, so paying per-PR and nightly CI minutes did not pay off. The fuzzer
# remains valuable when adding a new backend or model family — re-introduce
# a higher cadence (or run `scripts/fuzz.sh` locally) during that work.
#
# Requires a self-hosted runner labelled `[self-hosted, macos, arm64]`
# with Ollama installed and at least one model pulled. See FUZZING.md § CI tiers.

# No `schedule:` trigger exists yet — only workflow_dispatch below. A prior
# cron was removed because no `[self-hosted, macos, arm64]` runner is
# registered (a scheduled run against a nonexistent runner queues for 24h and
# auto-cancels). Provisioning a runner is necessary but not sufficient to make
# this run automatically: someone must also add a `schedule:` block back, not
# just "re-enable" one — there is nothing here to re-enable. See FUZZING.md
# § CI tiers.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: [self-hosted, macos, arm64]
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run fuzz (weekly, 30 min, --model all)
        run: |
          swift run fuzz-chat \
            --backend ollama \
            --model all \
            --minutes 30 \
            --seed ${{ github.run_number }}

      - name: Summarise findings
        if: always()
        run: |
          if [[ -f tmp/fuzz/INDEX.md ]]; then
            echo "## Weekly fuzz run — $(date -u +%Y-%m-%d)"
            echo ""
            cat tmp/fuzz/INDEX.md
          else
            echo "Weekly fuzz run produced no INDEX.md."
          fi

      # Fails the job on any finding not covered by an unexpired
      # .github/fuzz-allowlist.json entry. This is the enforcement point
      # scripts/fuzz-ci-gate.sh was built for (#549) and left unwired when
      # the PR-tier job that used to call it was retired (#1440, #2367).
      # `if: always()` so a gate failure doesn't hide behind a green "Run
      # fuzz" step whose 30-minute budget simply expired with findings on
      # the board.
      - name: Gate findings against allowlist
        if: always()
        run: scripts/fuzz-ci-gate.sh tmp/fuzz/index.json

      - name: Upload findings artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-weekly-findings-${{ github.run_id }}
          path: tmp/fuzz/
          if-no-files-found: ignore
