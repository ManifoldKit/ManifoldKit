name: Release train version-matrix tripwire

# Nightly source of truth for whether the ManifoldKit release train (core ->
# repository_dispatch -> manifold-mlx / manifold-llama / manifold-eval
# core-bump.yml, see ManifoldKit/.github RELEASE-PROCESS.md) is actually
# coherent right now. A drifted companion pin is otherwise invisible until a
# companion build fails or an eval run silently tests stale core behavior.
#
# Checks (scripts/release-train-check.sh):
#   1. manifold-mlx / manifold-llama core pins match the latest core MINOR
#      (they float automatically on core patch releases — RELEASE.md).
#   2. manifold-eval pins with `exact:` (not a range) and matches the latest
#      core version exactly.
#   3. No open bump PR has sat past the age budget: release-please for
#      manifold-mlx/llama, the `auto/bump-manifoldkit-*` core-bump.yml PR for
#      manifold-eval (which has no release-please branch for pin bumps).
#   4. README.md's install-pin snippet matches the latest core version
#      (version.txt).
#
# This is metadata-only (Package.swift/README/version.txt text + `gh pr
# list`) — no Swift build, so ubuntu-latest is fine (no macOS-runner budget
# consumed) and the job is cheap enough to run nightly rather than on a
# manual button.
#
# Read-only cross-repo access to manifold-mlx / manifold-llama / manifold-eval
# needs no special token: all three are public, same as companion-compat.yml's
# checkout — the default GITHUB_TOKEN suffices for `gh api`/`gh pr list` reads.

on:
  schedule:
    # 05:15 UTC — offset from nightly-slow-tests.yml's 04:30 UTC cron so the
    # two nightly jobs don't contend for the same slot.
    - cron: "15 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Needed for the failure-issue step below (mirrors nightly-slow-tests.yml).
      issues: write
    steps:
      - name: Check out ManifoldKit (with tags)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Full history/tags: version.txt is the primary source of truth for
          # the latest core version, but the script also sanity-checks that a
          # matching git tag exists (warns, doesn't drift, if not).
          fetch-depth: 0

      - name: Run release-train-check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/release-train-check.sh

      - name: Open GitHub issue on failure
        # Creates a tracking issue so a nightly failure is visible without
        # relying on GitHub's email digest. De-duplication: if an open issue
        # with the same title prefix already exists, appends a comment instead
        # of opening a second issue — avoids spam during multi-day failure runs.
        # Mirrors nightly-slow-tests.yml's pattern.
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          title="Release train version-matrix tripwire failed"
          existing=$(gh issue list \
            --repo "${{ github.repository }}" \
            --state open \
            --search "${title} in:title" \
            --json number \
            --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "Open issue #${existing} already exists — adding comment."
            gh issue comment "$existing" \
              --repo "${{ github.repository }}" \
              --body "Also failed on [run ${{ github.run_id }}](${run_url})."
          else
            gh issue create \
              --repo "${{ github.repository }}" \
              --title "${title}" \
              --body "$(printf '## Release train version-matrix tripwire failed\n\n**Run:** [%s](%s)\n\nCheck the run logs for which repo/invariant drifted (or which check itself failed — see CHECK-ERROR lines) and close this issue once resolved.' "${{ github.run_id }}" "${run_url}")"
          fi
