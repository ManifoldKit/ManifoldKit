name: Docs (DocC → GitHub Pages)

# Builds the ManifoldKit DocC site as *combined documentation* — the curated
# umbrella `ManifoldKit` hub page plus a separate, properly-curated page per
# module — and publishes it to GitHub Pages with one unified navigation sidebar.
#
# Why the SwiftPM DocC plugin + `--enable-experimental-combined-documentation`
# (replacing `xcodebuild docbuild -scheme ManifoldKit`): docbuild merged every
# catalog into ONE umbrella archive, and because `ManifoldKit` re-exports eight
# modules via `@_exported import`, every one of their ~776 public symbols was
# baked into the umbrella's symbol graph and dumped as flat auto-generated groups
# on the landing page (swift-docc #331) — burying the curated Topics. The per-
# module catalogs were built but discarded (only `ManifoldKit.doccarchive` shipped,
# so e.g. /documentation/manifoldinference/ 404'd). Combined documentation instead
# publishes one page per `--target`, with cross-module links resolving via absolute
# `/Module/Symbol` paths. We pair it with `-DBUILDING_DOCC` (see Sources/ManifoldKit/
# Exports.swift), which adds `@_documentation(visibility: internal)` to the
# umbrella's `@_exported import`s for the doc build only (the imports stay
# `@_exported`, so the umbrella still compiles and re-exports the full surface),
# dropping the re-exported symbols from its symbol graph so the umbrella page
# renders just its curated entry points. The historical llama-xcframework blocker
# that forced docbuild died with the v0.48 PR C2 companion-package split,
# unblocking the plugin route.
#
# NOTE: `--enable-experimental-combined-documentation` is experimental (swift-docc-
# plugin ≥1.4.2, Swift 6.0+) — the archive layout may change across toolchains.
# `--target` list MUST cover every module referenced by an absolute `/Module/...`
# link on the umbrella page, or the link silently 404s.
#
# SELF-VALIDATION: the `paths:` filter below MUST list this workflow's own path
# plus every DocC catalog and `Package.swift`, otherwise edits to a catalog or to
# the gate itself would not re-trigger the publish (see CLAUDE.md memory:
# "Script-driven CI gates need their script path in paths: filter").

on:
  # Publish on every merge to main that can change the rendered docs.
  push:
    branches: [main]
    paths:
      - "Sources/**/*.docc/**"
      - "Sources/**/*.swift"
      - "Package.swift"
      - "Package.resolved"
      - "README.md"
      - ".github/workflows/docs.yml"
  # Manual re-publish without a code change.
  workflow_dispatch:

# Allow one concurrent deployment; let an in-flight run finish (don't cancel a
# publish midway and leave Pages half-written).
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

jobs:
  build:
    runs-on: macos-15  # Apple Silicon arm64 — matches ci.yml
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          # Same pin as ci.yml / readme-snippets.yml — single toolchain truth.
          xcode-version: "26.3"

      - name: Cache SwiftPM dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            .build/artifacts
            .build/checkouts
            .build/repositories
          key: ${{ runner.os }}-docs-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-docs-spm-

      - name: Build combined DocC site
        # One plugin invocation builds every --target's page into a single
        # static-hostable site at ./docs-site, with a shared navigation sidebar.
        #
        # Flag placement / grant choice (the experimental combined-docs plugin is
        # finicky about both):
        #   * `-Xswiftc -DBUILDING_DOCC` and `--allow-writing-to-package-directory`
        #     are *package-manager* options and must precede the
        #     `generate-documentation` verb; `--enable-...`, `--target`,
        #     `--transform-...`, `--output-path` are *plugin* options and follow it.
        #   * ORDER AMONG THE PM OPTIONS MATTERS: `-Xswiftc` (a global build
        #     option) MUST come *before* `--allow-writing-to-package-directory`.
        #     The permission flag switches SwiftPM into its plugin-permission
        #     sub-parser (usage: `swift package default-command
        #     [--allow-writing-to-package-directory] [--allow-writing-to-directory]
        #     [--allow-network-connections] [--package]`), which does NOT accept
        #     global build options — so any `-Xswiftc` appearing *after* the grant
        #     is rejected with `error: Unknown option '-Xswiftc'` (exit 64). #2081:
        #     PR #2074 introduced this invocation with the grant first and never ran
        #     it (it replaced an `xcodebuild docbuild` step), so the misordering
        #     shipped straight to `main` and every publish aborted at the parse.
        #   * We grant filesystem access with `--allow-writing-to-package-directory`
        #     (output lands in the `./docs-site` package subdir), NOT the blanket
        #     sandbox-disable flag — that flag is banned in workflow scripts by the
        #     macro-sandbox guard (ci.yml, issue #726), which greps every *.yml for
        #     it (so it must not appear here even in a comment).
        #     Crucially, the SwiftPM grant flag MUST sit *before* the verb: there it
        #     is consumed by SwiftPM and never reaches the plugin. If placed *after*
        #     the verb it falls into the plugin's pass-through args and leaks to
        #     `docc convert`, which rejects it ("Unknown option") — that misordering,
        #     not the grant flag itself, was the abort this comment used to describe.
        #
        # `-DBUILDING_DOCC` adds `@_documentation(visibility: internal)` to the
        # `@_exported import`s in Sources/ManifoldKit/Exports.swift (they stay
        # `@_exported`, not downgraded to plain `import`), so the umbrella's symbol
        # graph stops absorbing the eight re-exported modules' ~776 symbols.
        #
        # The --target list MUST include every module referenced by an absolute
        # `/Module/Symbol` link in ManifoldKit.docc/ManifoldKit.md (the curated hub),
        # or that link 404s — AND every listed target must own a `.docc` catalog.
        # A catalog-LESS target triggers a non-deterministic `docc convert` exit-64
        # race ("No documentation directory exists at …") in combined mode, so
        # ManifoldContract / ManifoldModelCatalog / ManifoldFoundation each carry a
        # minimal landing-page catalog precisely so they can appear here safely.
        #
        # Best-effort *publish*, not a link gate: no `--warnings-as-errors` (the
        # per-module catalogs carry pre-existing DocC warnings that are out of scope
        # here; snippet drift is gated by readme-snippets.yml).
        run: |
          set -euo pipefail
          rm -rf ./docs-site
          # Root-served on the custom domain docs.manifoldkit.com (pinned via the
          # CNAME written below), so NO --hosting-base-path — that flag is only for
          # project pages served under /<repo>/, and it would rewrite every asset URL
          # under /ManifoldKit/. Omitting it yields root-relative asset paths.
          swift package \
            -Xswiftc -DBUILDING_DOCC \
            --allow-writing-to-package-directory \
            generate-documentation \
            --enable-experimental-combined-documentation \
            --target ManifoldKit \
            --target ManifoldModelCatalog \
            --target ManifoldContract \
            --target ManifoldInference \
            --target ManifoldRuntime \
            --target ManifoldUI \
            --target ManifoldPersistenceSwiftData \
            --target ManifoldFoundation \
            --transform-for-static-hosting \
            --output-path ./docs-site
          # Redirect the site root to the curated umbrella hub so visiting
          # https://docs.manifoldkit.com/ lands on ManifoldKit, not a 404.
          # (Combined docs also synthesize a bare target index at documentation/,
          # but the curated hub is the better front door.)
          cat > ./docs-site/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>ManifoldKit Documentation</title>
          <meta http-equiv="refresh" content="0; url=documentation/manifoldkit/">
          <link rel="canonical" href="documentation/manifoldkit/">
          <p>Redirecting to <a href="documentation/manifoldkit/">the ManifoldKit documentation</a>…</p>
          HTML
          # Pin the custom domain into the artifact so GitHub Pages keeps serving
          # docs.manifoldkit.com across every deploy (not just the one-time setting).
          echo 'docs.manifoldkit.com' > ./docs-site/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./docs-site

      - name: Open GitHub issue on failure
        # Creates a tracking issue so a DocC build failure is visible without
        # relying on GitHub's email digest. De-duplication: if an open issue
        # with the same title prefix already exists, appends a comment instead
        # of opening a second issue — avoids spam during multi-run failure streaks.
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          title="DocC publish failed"
          existing=$(gh issue list \
            --repo "${{ github.repository }}" \
            --state open \
            --search "${title} in:title" \
            --json number \
            --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "Open issue #${existing} already exists — adding comment."
            gh issue comment "$existing" \
              --repo "${{ github.repository }}" \
              --body "Also failed on [run ${{ github.run_id }}](${run_url})."
          else
            gh issue create \
              --repo "${{ github.repository }}" \
              --title "${title}" \
              --body "$(printf '## DocC publish failed\n\n**Run:** [%s](%s)\n\nThe DocC → GitHub Pages workflow failed. Check the run logs for the root cause and close this issue once resolved.' "${{ github.run_id }}" "${run_url}")"
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
