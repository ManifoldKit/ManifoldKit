version: 1
builder:
  configs:
    # Document the public-facing target set on the macOS SPM builder. SPI
    # generates DocC archives for each target listed here.
    # ManifoldBackends is excluded because it requires Apple Silicon
    # xcframeworks (MLX, llama.cpp) that do not link on Intel CI runners.
    # ManifoldCore was renamed to ManifoldInference + ManifoldRuntime +
    # ManifoldPersistenceSwiftData in v2.0.
    - documentation_targets:
        - ManifoldInference
        - ManifoldRuntime
        - ManifoldPersistenceSwiftData
        - ManifoldUI
        - ManifoldUIModelManagement
        - ManifoldMCP
      platform: macosSpm
